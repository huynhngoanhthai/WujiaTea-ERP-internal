  build_override: "ĐÃ DEPLOY UAT 26/09/2026 — sẵn sàng retest | 26/09/2026 | Sprint 2026-09-26-G1 | bản mã fcce811 | Đo lại CHỈ ĐỌC trên máy chạy thử bằng trình duyệt thật với tài khoản chủ tiệm em.hcm, mọi lệnh gửi dữ liệu bị chặn trừ đăng nhập và hai bộ đếm số trên chuông và giỏ (chỉ đọc), không lệnh nào phải chặn, không lỗi kịch bản: 26 màn nhân 3 khổ điện thoại 360, 390, 430, có và không có vùng an toàn 34; thanh đáy cao 72 (có vùng an toàn 106), mỗi mục 50, nhãn 12, không tràn; số trên chuông không chạm biểu tượng; bảng Thêm nằm sát ngay trên thanh ở cả hai chế độ (trước chồng 8 khi có vùng an toàn); cuộn hết mọi màn dòng cuối nằm trên thanh ít nhất 13. Máy tính không hiện thanh đáy. Bảng đo: docs/g1-acceptance-matrix.md"
  url: "Cổng cửa hàng trên điện thoại (dưới 992 điểm ảnh) — thanh menu đáy của mọi màn, bảng Thêm mở từ thanh đáy, nút tròn nổi ở màn Đăng ký thi; máy tính không đổi"
  odoo_fit: "Custom"
  fix: "Thanh menu đáy điện thoại trước cao 83 cố định rồi mới cộng thêm vùng an toàn của máy, chữ nhãn 11. Nay thanh cao 72 cộng đúng vùng an toàn thực tế của máy (máy không có vùng an toàn cao 72, iPhone có vùng an toàn 34 cao 106), mỗi mục bấm cao 50, biểu tượng 22, nhãn chữ 12 dễ đọc hơn. Số trên chuông và giỏ (ví dụ 8, 12, 44, 99+) neo vào góc trên phải biểu tượng, đo ở cả ba khổ không chạm nét biểu tượng. Khoảng chừa cuối trang tính theo chiều cao thanh mới nên cuộn hết trang dòng cuối vẫn nằm trên thanh ít nhất 13 điểm ảnh. Sửa kèm một lỗi có từ trước chỉ lộ trên máy có vùng an toàn: bảng Thêm và nút tròn nổi Đăng ký thi tính theo chiều cao thanh mà bỏ quên vùng an toàn nên bảng Thêm chồng lên thanh đáy 8 điểm ảnh; nay bảng Thêm nằm sát ngay trên thanh, nút tròn nổi cách thanh 16"
  impact: "Chỉ giao diện điện thoại: thanh đáy thấp đi 11 điểm ảnh, nội dung thấy nhiều hơn. Không đổi dữ liệu, quyền, số mục hay thứ tự mục trên thanh, không đổi luồng nghiệp vụ hay xử lý phía máy chủ. Đo 28 màn ở khổ 360, 390 và 430, có và không có vùng an toàn: thanh đúng 72 và 106, không mục nào tràn, các màn thuộc nhóm Thêm (Đổi trả, Kiến thức, Hỗ trợ, Đăng ký thi, Công nợ, Báo cáo, Tài khoản) sáng đúng mục Thêm, cuộn hết trang dòng cuối không bị che, thanh giỏ nổi ở Đặt hàng vẫn nằm trên thanh đáy 8 điểm ảnh. Máy tính không có thanh này nên không đổi"
  retest: "Mở Portal trên điện thoại khổ 390, tốt nhất là iPhone có vạch vuốt ở đáy. Thanh đáy thấp hơn trước, nhãn chữ to hơn, vạch vuốt của máy không đè lên nhãn. Có thông báo hoặc giỏ có hàng: con số nằm ở góc trên phải biểu tượng, không che biểu tượng. Bấm Thêm: bảng mở ra nằm ngay trên thanh đáy, không đè lên thanh. Vào Đổi trả, Kiến thức, Hỗ trợ: mục Thêm sáng. Mở một form dài (Tạo đổi trả hoặc Tạo yêu cầu hỗ trợ) kéo hết xuống: nút cuối cùng bấm được, không bị thanh che. Màn Đăng ký thi: nút tròn nổi nằm trên thanh đáy"
  limit: "Thứ nhất, BA từng chốt thanh đáy 83 (ghi chú Sprint 12); issue này ghi 72 và không cần BA xác nhận nên làm theo issue mới, báo BA để biết. Thứ hai, vùng an toàn iPhone đo bằng chế độ giả lập vùng an toàn của trình duyệt Chromium, chưa đo trên iPhone thật. Thứ ba, khoảng chừa cuối trang giờ tính theo chiều cao thanh (72 cộng 13, trước là số cố định 96) nên trang ngắn cuối trang gọn hơn 11 điểm ảnh; muốn đổi chỉ cần sửa một con số chung. Thứ tư, lỗi bảng Thêm chồng thanh đáy 8 điểm ảnh trên máy có vùng an toàn có từ trước, sửa kèm vì cùng một công thức tính chiều cao thanh"
WJ-ORD-MOB-SPACING-001:
  sprint: "2026-09-26-G1"
  commit: "fcce811"
  build_override: "ĐÃ DEPLOY UAT 26/09/2026 — sẵn sàng retest | 26/09/2026 | Sprint 2026-09-26-G1 | bản mã fcce811 | Đo lại CHỈ ĐỌC trên máy chạy thử bằng trình duyệt thật với tài khoản chủ tiệm em.hcm, mọi lệnh gửi dữ liệu bị chặn trừ đăng nhập và hai bộ đếm số trên chuông và giỏ (chỉ đọc), không lệnh nào phải chặn, không lỗi kịch bản: 26 màn nhân 3 khổ điện thoại 360, 390, 430, có và không có vùng an toàn 34; màn Đặt hàng ô tìm kiếm đến hàng lọc 12, hàng lọc đến Danh sách sản phẩm 8 ở cả 3 khổ, ô tìm cao 44, nút lọc 32; thanh giỏ nổi nằm trên thanh đáy. Không thử thêm giỏ trên máy chạy thử (quy định chỉ đọc), đã thử trên bản sao dữ liệu. Bảng đo: docs/g1-acceptance-matrix.md"
  url: "/portal/order — màn Đặt hàng trên điện thoại (dưới 992 điểm ảnh), khoảng giữa ô tìm kiếm, hàng lọc danh mục và tiêu đề Danh sách sản phẩm; máy tính không đổi"
  odoo_fit: "Custom"
  fix: "Đo lại sau khi đã gọn tiêu đề và thanh đáy (hai issue cùng cụm): từ ô tìm kiếm đến hàng lọc danh mục còn 23 điểm ảnh, từ hàng lọc đến tiêu đề Danh sách sản phẩm 14, đúng như BA đo. Khoảng 23 là do khung chung của cổng tự chừa 15 dưới mọi ô nhập liệu cộng với khoảng cách chung giữa các khối. Nay chỉnh ngay tại vỏ màn Đặt hàng: ô tìm kiếm đến hàng lọc còn 12, hàng lọc đến Danh sách sản phẩm còn 8, không đụng thành phần hàng lọc hay ô tìm kiếm dùng chung nên các màn khác không đổi. Đo ở khổ 360, 390 và 430 được đúng 12 và 8, giữ nguyên sau khi bấm lọc danh mục (danh sách tải lại) và sau khi tìm kiếm"
  impact: "Chỉ phần đầu màn Đặt hàng trên điện thoại, danh sách sản phẩm lên cao hơn 17 điểm ảnh. Không đổi dữ liệu, giá, số lượng, giỏ hàng, luồng nghiệp vụ hay xử lý phía máy chủ. Ô tìm kiếm vẫn cao 44, nút lọc danh mục 32, thẻ sản phẩm và nút thêm giỏ không đổi. Thử lại trên bản sao dữ liệu với trình duyệt thật: lọc danh mục, tìm kiếm, tăng giảm số lượng (2 lên 3 về 2), thêm vào giỏ (giỏ từ 3 lên 4 mặt hàng) đều chạy, không lỗi kịch bản. Máy tính không đổi"
  retest: "Mở Portal trên điện thoại khổ 390 (hoặc 360, 430), vào Đặt hàng: hàng nút lọc danh mục nằm sát hơn dưới ô tìm kiếm, tiêu đề Danh sách sản phẩm nằm sát hơn dưới hàng lọc, trông cân đối, không dính vào nhau. Bấm một danh mục: danh sách đổi, khoảng cách giữ nguyên. Gõ tìm một sản phẩm: kết quả hiện, khoảng cách giữ nguyên. Tăng giảm số lượng và thêm một sản phẩm vào giỏ (không cần gửi đơn): hoạt động như trước. Mở các màn khác có hàng lọc (Lịch sử, Giao hàng, Đổi trả): không đổi"
  limit: "Thứ nhất, khoảng 12 và 8 chỉ áp cho màn Đặt hàng như issue yêu cầu; màn khác có ô tìm kiếm và hàng lọc vẫn theo khoảng chung của cổng. Thứ hai, khi cửa hàng không có danh mục nào để lọc thì hàng lọc ẩn và tiêu đề Danh sách sản phẩm cách ô tìm kiếm 12 theo cách tính; trường hợp này chưa đo bằng trình duyệt và issue không nêu số riêng"

