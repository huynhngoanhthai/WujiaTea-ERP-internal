# I12 (09/10/2026) — 169 WJ-PORTAL-UI-005. Chủ dự án chốt: mở hộp thì focus vào nút Đóng (như sheet Thêm WJ-PORTAL-UI-004).
WJ-PORTAL-UI-005:
  stt: 169
  sprint: "2026-10-09-I12"
  build_override: "ĐÃ DEPLOY UAT 09/10/2026 — sẵn sàng retest | Sprint 2026-10-09-I12 | commit: a64ce589 | Deploy: -u wujia_portal_layout,wujia_portal_base rồi khởi động lại (không có bước cập nhật dữ liệu) | URL: /portal | Đo lại chỉ đọc trên UAT 09/10: hộp thoại 1440/390: có tên, focus vào trong, Tab không thoát, Esc đóng và trả focus về nút mở"
  url: "/portal — hộp Đổi cửa hàng mở từ Cửa hàng hiện tại (máy tính: ô trên thanh trên cùng; điện thoại: dải cửa hàng dưới thanh trên cùng)"
  odoo_fit: "Custom"
  fix: "Hộp chọn cửa hàng nay là hộp thoại chuẩn, dùng chung một cách cho máy tính và điện thoại: trình đọc màn hình đọc được vai trò hộp thoại và tên 'Đổi cửa hàng đang thao tác' (lúc bắt buộc chọn: 'Chọn cửa hàng đang thao tác') kèm câu mô tả; nút Cửa hàng hiện tại báo trước là sẽ mở hộp thoại. Mở bằng chuột hay phím Enter thì con trỏ bàn phím nhảy vào nút Đóng; phần nền phía sau bị khoá (không bấm, không Tab tới được); Tab và Shift+Tab chỉ đi vòng trong hộp (Đóng → cửa hàng đang chọn → Hủy → Đổi cửa hàng); phím mũi tên chuyển lựa chọn mà chưa đổi cửa hàng. Escape, nút Đóng, Hủy hay bấm ra nền đều đóng hộp và đưa con trỏ về đúng nút Cửa hàng hiện tại (mở từ menu tài khoản thì cũng về nút Cửa hàng hiện tại vì menu đã đóng). Lúc bắt buộc chọn cửa hàng: hộp cũng khoá nền, con trỏ đặt sẵn ở cửa hàng đầu, Escape không thoát"
  impact: "Mọi trang Portal có hộp chọn cửa hàng (tài khoản thuộc từ 2 cửa hàng). Đo bản sao dữ liệu tài khoản Administrator (3 cửa hàng), máy tính 1440×900 và điện thoại 390×844: mở bằng Enter và bằng chuột, con trỏ trong hộp; 10 lần Tab và 10 lần Shift+Tab không lần nào ra ngoài (trước: 10/10 ra ngoài); nền khoá 12/12 khối; Escape / Đóng / Hủy / bấm nền đều đóng và trả con trỏ về Cửa hàng hiện tại (trước: Escape không đóng, Đóng / Hủy / nền làm con trỏ mất về đầu trang); cửa hàng không đổi khi chưa bấm Đổi cửa hàng; không lỗi trình duyệt. Giao diện hộp không đổi. Không đổi: luồng đổi cửa hàng, dữ liệu, quyền"
  retest: "Máy tính 1440: đứng ở Cửa hàng hiện tại trên thanh trên cùng (Tab tới), nhấn Enter — hộp mở, con trỏ ở nút Đóng; nhấn Tab, Shift+Tab nhiều lần — con trỏ chỉ đi trong hộp; nhấn Escape — hộp đóng, con trỏ về Cửa hàng hiện tại. Lặp lại, đóng bằng nút Đóng, Hủy, bấm ra nền — mỗi lần con trỏ đều về Cửa hàng hiện tại và cửa hàng không đổi. Điện thoại 390: làm tương tự với dải cửa hàng dưới thanh trên cùng. Dùng trình đọc màn hình: khi mở phải đọc 'hộp thoại, Đổi cửa hàng đang thao tác'"
  limit: "Chưa chạy thao tác Đổi cửa hàng thật (giữ đúng phạm vi issue: chỉ mở/đóng). Trình đọc màn hình chỉ đo bằng cây truy cập của trình duyệt, chưa thử trên VoiceOver/TalkBack thật — nhờ BA kiểm khi retest"

