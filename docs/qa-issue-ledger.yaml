WJ-SUPPORT-002:
  stt: 162
  sprint: "2026-10-09-I8"
  build_override: "ĐÃ DEPLOY UAT 09/10/2026 — sẵn sàng retest | Sprint 2026-10-09-I8 | commit: f8744424 | Deploy: -u wujia_portal_support rồi khởi động lại (không có bước cập nhật dữ liệu) | URL: /portal/support/<id> | Đo lại chỉ đọc trên UAT 09/10: điện thoại: phiếu WJ-TK/26/00016 có khối Nội dung yêu cầu, không tràn"
  url: "/portal/support/<id> — chi tiết yêu cầu hỗ trợ, điện thoại và máy tính (ví dụ WJ-TK/26/00006 /portal/support/6)"
  odoo_fit: "Custom"
  fix: "Nguyên nhân: bản điện thoại của trang chi tiết yêu cầu hỗ trợ chưa từng có khối nội dung — chỉ bản máy tính có. Nay điện thoại có thẻ Nội dung yêu cầu ngay dưới khối thông tin (Nhóm, Ưu tiên, Người gửi, Ngày tạo), trước File đính kèm, Lịch sử trao đổi và ô trả lời, nên đọc được nội dung gốc trước khi phản hồi. Hiện đầy đủ, không thu gọn; giữ xuống dòng, đoạn, danh sách như người gửi nhập; đường dẫn hay chuỗi rất dài tự xuống dòng trong thẻ. Không có nội dung thì hiện dấu gạch như máy tính. Máy tính giữ nguyên khối Nội dung yêu cầu, chỉ thêm tự xuống dòng cho chuỗi dài (trước đây chuỗi liền rất dài tràn ra khỏi thẻ ở khổ 1440)"
  impact: "Chỉ trang chi tiết yêu cầu hỗ trợ. Không đổi dữ liệu, danh sách, tạo mới, trả lời. Đo bản sao dữ liệu ở 1920 / 1440 / 430 / 390 / 360 với phiếu có nội dung nhiều đoạn, danh sách đánh số, một đường dẫn rất dài và một chuỗi liền 90 ký tự, kèm tệp đính kèm tên dài, và phiếu WJ-TK/26/00006: điện thoại hiện đủ nội dung giống máy tính, chữ nằm gọn trong thẻ, trang không cuộn ngang; cuộn tới cuối, nút Gửi cách thanh điều hướng dưới 41 px, không bị che. Máy tính hết tràn chuỗi dài, các khối khác không đổi"
  retest: "Mở /portal/support/6 (WJ-TK/26/00006, chọn cửa hàng của phiếu) trên điện thoại 390: thấy thẻ Nội dung yêu cầu với Reset mật khẩu user POS. và Ticket #3, state=waiting_customer., trước Lịch sử trao đổi; cuộn tới cuối, ô trả lời và nút Gửi không bị thanh dưới che. Lặp ở 360 và 430. Máy tính 1440: khối Nội dung yêu cầu như trước. Nếu có phiếu nội dung dài nhiều dòng hoặc có đường dẫn dài: đọc đủ, không tràn ngang"
  limit: "Không thu gọn nội dung dài (chủ dự án chốt hiện đầy đủ) — phiếu rất dài phải cuộn qua mới tới phần trao đổi. Không thử nội dung có ảnh chèn trong bài vì ô nhập ở cổng chỉ nhận chữ"

WJ-EXAM-008:
  stt: 166
  sprint: "2026-10-09-I8"
  build_override: "ĐÃ DEPLOY UAT 09/10/2026 — sẵn sàng retest | Sprint 2026-10-09-I8 | commit: f8744424 | Deploy: -u wujia_portal_exam rồi khởi động lại (không có bước cập nhật dữ liệu) | URL: /portal/exam/register | Đo lại chỉ đọc trên UAT 09/10: modal Thêm người 1440/1920: chưa chọn ↔ đã chọn ↔ xoá ảnh về chưa chọn, hai trạng thái không hiện cùng lúc"
  url: "/portal/exam/register — hộp Thêm người đăng ký, máy tính 1440 / 1920"
  odoo_fit: "Custom"
  fix: "Nguyên nhân: khung ảnh trong hộp Thêm người có tiêu đề Ảnh đã được chọn và một tên tệp mẫu viết cứng sẵn trong trang; khi mở hộp, chương trình chỉ đổi dòng tên tệp thành Chưa chọn ảnh mà không đổi tiêu đề, nên hai trạng thái hiện cùng lúc. Nay khung ảnh có đúng một trạng thái, do một chỗ duy nhất quyết định theo việc đã có ảnh hay chưa. Chưa có ảnh: tiêu đề Chưa chọn ảnh, ảnh đại diện mặc định, một nút Chọn ảnh, không có dòng tên tệp, không có nút Xóa ảnh. Đã có ảnh: tiêu đề Ảnh đã được chọn, ảnh xem trước, tên tệp và định dạng (hoặc Ảnh đã chọn khi sửa một người đã có ảnh), nút Thay ảnh và Xóa ảnh. Xóa ảnh trở về chưa chọn; tệp không hợp lệ trở về chưa chọn kèm câu báo lỗi. Bấm Thêm người khi thiếu tên hoặc số điện thoại chỉ hiện lỗi của ô nhập, trạng thái ảnh giữ đúng như trước khi bấm"
  impact: "Chỉ khung ảnh trong hộp Thêm/Sửa người ở màn Đăng ký thi trên máy tính. Không đổi cách lưu ảnh, kiểm tra tệp (JPG/PNG, tối đa 5 MB), gửi đăng ký; luồng đăng ký trên điện thoại không có khung này. Đo bản sao dữ liệu ở 1440 và 1920, không gửi đăng ký: mở hộp → chỉ Chưa chọn ảnh; bấm Thêm người khi trống → lỗi tên và số điện thoại hiện, vẫn Chưa chọn ảnh; chọn ảnh PNG → xem trước + Ảnh đã được chọn + tên tệp, nút Thay ảnh và Xóa ảnh; bấm Thêm người khi trống lần nữa → vẫn Ảnh đã được chọn; Xóa ảnh → Chưa chọn ảnh; chọn tệp không phải ảnh → Chưa chọn ảnh + câu Ảnh không hợp lệ; thêm một người có ảnh rồi bấm Sửa → Ảnh đã được chọn; mở Thêm người mới → Chưa chọn ảnh. Không lần nào hai trạng thái cùng hiện, không lỗi trang"
  retest: "Máy tính 1440, mở /portal/exam/register, bấm Thêm người: khung ảnh chỉ có Chưa chọn ảnh và nút Chọn ảnh. Bấm Thêm người khi để trống tên và số điện thoại: hiện lỗi hai ô, khung ảnh vẫn Chưa chọn ảnh. Chọn một ảnh JPG hoặc PNG nhỏ: thấy ảnh xem trước, Ảnh đã được chọn, tên tệp, nút Thay ảnh và Xóa ảnh. Bấm Xóa ảnh: trở lại Chưa chọn ảnh. Không cần gửi đăng ký"
  limit: "Dòng Hoặc kéo thả ảnh mới vẫn là chữ hướng dẫn, kéo thả chưa hoạt động (có từ trước, ngoài phạm vi issue). Chưa đo hộp ở khổ điện thoại vì điện thoại dùng luồng đăng ký riêng không có khung ảnh này"

# I9 (09/10/2026) — ngôn ngữ trên header: 167 WJ-LANG-002 · 164 WJ-INSPECT-001.
#   Chủ dự án chốt: pill ngôn ngữ PC nới theo nhãn, tối thiểu 118 · #164 vá ở khung portal_layout + bàn giao nhóm Khảo sát
#   (không sửa wujia_portal_inspection).
WJ-LANG-002:
  stt: 167
  sprint: "2026-10-09-I9"
  build_override: "ĐÃ DEPLOY UAT 09/10/2026 — sẵn sàng retest | Sprint 2026-10-09-I9 | commit: 0e53d12b | Deploy: -u wujia_portal_layout rồi khởi động lại (không có bước cập nhật dữ liệu) | URL: /portal | Đo lại chỉ đọc trên UAT 09/10: cờ ngôn ngữ đang chọn 20×15 ở 1440 và 1920"
  url: "/portal (và mọi trang dùng chung header) — nút ngôn ngữ trên header máy tính 1440 / 1920"
  odoo_fit: "Custom"
  fix: "Nguyên nhân: nút ngôn ngữ trên header máy tính bị ép rộng cố định 118 px; phần còn lại không đủ cho cả cờ lẫn tên ngôn ngữ, mà tên không co được nên cờ bị bóp lại (English (US) còn 4 px, Tiếng Việt 11 px). Nay cờ có ô cố định 20×15 px không co; nút rộng tối thiểu 118 px như thiết kế và tự nới theo tên ngôn ngữ dài, tên không xuống dòng. Đo sau sửa: cờ đang chọn 20×15 với English (US), Tiếng Việt, ภาษาไทย, 简体中文 ở cả 1440 và 1920; nút rộng 139,6 / 126,6 / 118 / 118 px; cờ và chữ thẳng hàng giữa; khoảng cách tới nút giỏ hàng giữ 22 px, không chồng lấn"
  impact: "Chỉ nút ngôn ngữ trên header máy tính từ 1200 px trở lên, ở mọi trang dùng chung header (Trang chủ, Đặt hàng, Hỗ trợ, Công nợ, Kiến thức, Khảo sát…). Không đổi: danh sách chọn ngôn ngữ thả xuống, header khổ 992–1199 (chỉ hiện cờ, nút vẫn 55 px), header điện thoại (cờ 22×16 ở 360 / 390 / 430). Đo bản sao dữ liệu 4 ngôn ngữ × 1920 / 1440 / 1199 / 992 / 430 / 390 / 360: không tràn ngang, không lỗi trang mới"
  retest: "Máy tính 1440 và 1920, đổi lần lượt English (US), Tiếng Việt, ภาษาไทย ở nút ngôn ngữ trên header: cờ đang chọn luôn đủ hình (khoảng 20×15), thẳng hàng với tên ngôn ngữ; với English (US) nút rộng ra một chút, không đè nút giỏ hàng. Mở danh sách ngôn ngữ và xem trên điện thoại 390: không đổi so với trước"
  limit: "Nút ngôn ngữ với English (US) và Tiếng Việt rộng hơn 118 px của thiết kế (nới theo tên, chủ dự án chốt). Không đo trên tên ngôn ngữ dài hơn các ngôn ngữ đang bật"
WJ-INSPECT-001:
  stt: 164
  sprint: "2026-10-09-I9"
  build_override: "ĐÃ DEPLOY UAT 09/10/2026 — sẵn sàng retest | Sprint 2026-10-09-I9 | commit: 0e53d12b | Deploy: -u wujia_portal_layout rồi khởi động lại (không có bước cập nhật dữ liệu) | URL: /portal/inspection | Đo lại chỉ đọc trên UAT 09/10: Khảo sát máy tính 1440/1920: header Tiếng Việt"
  url: "/portal/inspection · /portal/inspection/detail/<id> · /portal/inspection/remediation/<id> — máy tính và điện thoại"
  odoo_fit: "Custom"
  fix: "Nguyên nhân: các trang Khảo sát được khai báo theo kiểu trang website, nên ngôn ngữ của trang lấy theo cookie ngôn ngữ của trình duyệt chứ không theo ngôn ngữ của tài khoản như mọi trang Portal khác. Trên UAT, vừa đăng nhập trình duyệt đã mang cookie English, vì vậy header Khảo sát hiện cờ Mỹ và English (US), điện thoại có tên truy cập Language, trong khi nội dung (chữ viết sẵn) vẫn tiếng Việt. Nay khung Portal dùng chung quyết định ngôn ngữ cho mọi trang /portal khi đã đăng nhập: luôn theo ngôn ngữ của tài khoản, bỏ qua cookie trình duyệt, không chuyển địa chỉ sang /vi/…. Không sửa module Khảo sát; đã ghi bàn giao cho nhóm Khảo sát (docs/handover-inspection-scope.md)"
  impact: "Mọi trang /portal khi đã đăng nhập; thực tế chỉ đổi hành vi các trang Khảo sát (các trang khác vốn đã theo ngôn ngữ tài khoản). Khách chưa đăng nhập giữ nguyên (mặc định tiếng Việt, theo lựa chọn ở màn đăng nhập). Không tự đổi ngôn ngữ tài khoản. Đo bản sao dữ liệu, tài khoản tiếng Việt, có và không có cookie English, ở 1920 / 1440 / 390 / 360: Trang chủ → Đặt hàng → Khảo sát → chi tiết → khắc phục đều cờ Việt Nam, Tiếng Việt, tên truy cập Ngôn ngữ, địa chỉ không đổi; đổi sang English (US) thì Khảo sát cũng English. Trước sửa: có cookie English thì Khảo sát ra English (giống UAT), không có cookie thì bị chuyển sang /vi/portal/inspection"
  retest: "Đăng nhập, chọn Tiếng Việt. Mở Trang chủ rồi Khảo sát, mở một phiếu và một mục khắc phục: header luôn cờ Việt Nam và Tiếng Việt (điện thoại: nút ngôn ngữ đọc là Ngôn ngữ), địa chỉ không có /vi/. Đổi sang English (US) rồi mở lại Khảo sát: header English (US). Đổi về Tiếng Việt"
  limit: "Bản sao dữ liệu không có phiếu Khảo sát nên chi tiết / khắc phục chỉ đo được tới bước quay về danh sách; header ở hai trang đó dùng chung khung nên kỳ vọng như danh sách. Chữ trong nội dung Khảo sát vẫn viết cứng tiếng Việt, không đổi theo ngôn ngữ (thuộc nhóm Khảo sát, đã ghi khuyến nghị bàn giao)"

