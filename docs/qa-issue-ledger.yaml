  retest: "Tài khoản thuộc cửa hàng A và B, chưa chọn cửa hàng: mở lần lượt Trang chủ, Giao hàng, Báo cáo, Đổi trả, Yêu cầu cập nhật thông tin, Hỗ trợ, Thông báo ở máy tính khổ 1440 và điện thoại 390 — mỗi màn hiện khối nhắc chọn cửa hàng, không có số liệu gộp; bấm nút trong khối mở bảng chọn. Chọn A: danh sách, số đếm, chi tiết, lọc chỉ có dữ liệu A; tạo một phiếu Đổi trả / Yêu cầu cập nhật / Hỗ trợ — phiếu thuộc A; tải tệp đính kèm của phiếu A được. Đổi sang B: chỉ còn dữ liệu B. Đang chọn A, dán địa chỉ chi tiết hoặc tệp của một phiếu B: bị đưa về danh sách hoặc báo không tìm thấy. Tài khoản chỉ một cửa hàng: không phải chọn. Gỡ tài khoản khỏi cửa hàng đang chọn rồi tải lại: phải chọn lại"
  limit: "Thứ nhất, Khảo sát chưa chuyển: màn này thuộc nhóm phát triển khác, Dev không sửa; đã bàn giao cách làm (docs/handover-inspection-scope.md), nên hiện Khảo sát vẫn gộp nhiều cửa hàng khi chưa chọn. Thứ hai, Hỗ trợ và Thông báo không có trong danh sách màn của issue nhưng làm theo cùng luật (chủ dự án chốt) — BA xác nhận: Hỗ trợ chỉ còn phiếu tạo tại cửa hàng đang chọn; Thông báo chưa chọn cửa hàng chỉ thấy thông báo toàn hệ. Thứ ba, quyền vào trang Báo cáo vẫn xét vai trò cao nhất trên mọi cửa hàng — đổi theo vai trò tại cửa hàng đang chọn thuộc issue WJ-PORTAL-ROLE-001. Thứ tư, luật đã đọc thông báo theo cửa hàng thuộc issue WJ-NOTI-001"


