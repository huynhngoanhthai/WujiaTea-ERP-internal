  odoo_fit: "Custom"
  fix: "Theo quyết định BA 01/10/2026: Lịch sử đặt hàng nay tra cứu được đơn Đã hủy. Trước đây danh sách, bộ lọc và trang chi tiết đều loại bỏ đơn hủy, nên cửa hàng không có cách nào xem lại đơn đã hủy. Nay danh sách Tất cả gồm cả đơn hủy của cửa hàng đang chọn (đơn tạo trên cổng lẫn đơn tạo ở backend), nhãn Đã hủy màu đỏ; ô lọc trạng thái trên máy tính có thêm mục Đã hủy (đứng cuối), điện thoại có thêm chip Đã hủy cạnh chip Đã xác nhận; phân trang đếm cả đơn hủy; mở được chi tiết đơn hủy (không có dòng Ngày xác nhận, trạng thái giao không đè lên nhãn Đã hủy). Vẫn kiểm cửa hàng đang chọn ở mọi lần mở: sửa số đơn trên địa chỉ sang đơn hủy của cửa hàng khác ⇒ báo Không tìm thấy đơn hàng hoặc bạn không có quyền xem, tải PDF báo không tìm thấy. 5 trạng thái Chờ xác nhận / Đã gửi / Đã xác nhận / Đang giao / Hoàn tất giữ nguyên cách tính và cách lọc. Không thêm lý do hủy, không ẩn riêng đơn thay thế (BA chốt)"
  impact: "Chỉ trang Lịch sử đặt hàng (danh sách + chi tiết, máy tính và điện thoại). Trang chủ vẫn KHÔNG hiện đơn hủy ở ô Đơn hàng và khối Đơn gần đây (BA không yêu cầu). Màn kết quả gửi đơn vẫn không mở đơn hủy. Số đơn ở trang Lịch sử của cửa hàng có đơn hủy sẽ tăng. Đo bản sao dữ liệu, cửa hàng TP HCM Quận 1 (50 đơn hủy + 1 chờ xác nhận + 5 đã xác nhận), 5 khổ 1920 / 1440 / 430 / 390 / 360: Tất cả = 56 bản ghi; lọc Đã hủy = 50, trang 3 (20/trang) đủ 10 đơn, chỉ nhãn Đã hủy; lọc Chờ xác nhận vẫn 1; mở chi tiết đơn hủy có nhãn Đã hủy đỏ; đổi sang Cầu Giấy mở lại đơn đó ⇒ báo không tìm thấy. Không cuộn ngang, không lỗi trang"
  retest: "Chọn cửa hàng có đơn đã hủy (vd TP HCM Quận 1). Máy tính 1440: (1) mở Lịch sử đặt hàng ⇒ thấy đơn Đã hủy (nhãn đỏ) xen giữa các đơn khác theo ngày tạo; tổng số bản ghi tăng đúng bằng số đơn hủy. (2) Ô trạng thái chọn Đã hủy ⇒ chỉ còn đơn hủy; chuyển trang và đổi 10/20/50 dòng ⇒ không trùng, không sót. (3) Lần lượt chọn Chờ xác nhận, Đã gửi, Đã xác nhận, Đang giao, Hoàn tất ⇒ kết quả như trước. (4) Bấm một đơn hủy ⇒ trang chi tiết mở được, nhãn Đã hủy. (5) Đổi cửa hàng khác rồi dán lại địa chỉ chi tiết đơn hủy vừa mở ⇒ báo không tìm thấy hoặc không có quyền. Điện thoại 390: chip Đã hủy lọc được đơn hủy, mở chi tiết được. Trang chủ: ô Đơn hàng và Đơn gần đây vẫn không có đơn hủy"
  limit: "Thứ nhất, không phân biệt đơn hủy thường với đơn báo giá cũ bị hệ thống tự hủy khi cửa hàng gửi lại giỏ hàng — cả hai cùng hiện Đã hủy (BA chốt không thêm lý do hủy). Thứ hai, Trang chủ giữ nguyên không hiện đơn hủy. Thứ ba, ở khung Thông tin đơn hàng trên máy tính, dòng Trạng thái vẫn tô chữ màu xanh như mọi trạng thái khác (nhãn đỏ ở đầu trang mới là badge trạng thái)"

