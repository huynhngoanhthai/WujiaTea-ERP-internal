  retest: "Đăng nhập em.hcm: S00075 trên Trang chủ máy tính và điện thoại ghi Chờ xác nhận màu cam, giống danh sách và chi tiết Lịch sử đặt hàng. Kiểm thêm: đơn đã gửi (Đã gửi), đơn đã xác nhận chưa có chuyến (Đã xác nhận, màu xanh dương), đơn có chuyến đang giao (Đang giao) và chuyến đã giao xong (Hoàn tất, màu xanh lá) — mỗi đơn cùng chữ và cùng màu ở Trang chủ máy tính, điện thoại và Lịch sử. Đơn đã hủy không hiện ở Trang chủ, như Lịch sử"
  limit: "Hệ thống bán hàng của Odoo 19 không có trạng thái Hoàn tất riêng cho đơn: Hoàn tất lấy từ chuyến giao đã xong, giống quy tắc Lịch sử đặt hàng đã chốt 03/08. Đơn đã hủy bị loại khỏi Trang chủ và Lịch sử nên không có nhãn để so"

