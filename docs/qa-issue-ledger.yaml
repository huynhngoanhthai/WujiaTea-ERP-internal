UI-BUTTON-001:
  sprint: "2026-09-23-E6c"
  commit: "e621ae1"
  build_override: "ĐÃ DEPLOY UAT 24/09/2026 — sẵn sàng retest | 24/09/2026 | Sprint 2026-09-23-E6c | bản mã e621ae1, gộp cả bốn lượt E6a, E6b1, E6b2 và E6c; 12 mô đun trên máy chạy thử đã khớp phiên bản mã | Đo lại CHỈ ĐỌC trên máy chạy thử bằng trình duyệt thật, mọi lệnh gửi dữ liệu bị chặn và không có lệnh nào phải chặn: 30 màn nhân 5 khổ màn hình cộng khổ phóng to 200 phần trăm, 175 lượt nút đo được đều đúng cỡ BA chốt, bo góc 8 hoặc 12, không lỗi kịch bản; các trạng thái ẩn của màn Đăng ký thi (lịch, hộp thoại Thêm người, bảng người thi, hộp thoại gửi, thông báo xung đột và gửi thành công) không vi phạm; màn đăng nhập ở khổ 360, 390 và 1440 không còn trượt ngang; bấm đúp nút gửi chỉ đi một lần và giữ bề rộng; bàn phím Enter và phím cách chạy đúng một lần 18 trên 18 | URL: toàn bộ Portal"
  url: "Portal toàn hệ thống — mọi nút hành động và nút biểu tượng, máy tính và điện thoại; trọng tâm lượt cuối là màn Đăng ký thi và màn đăng nhập"
  odoo_fit: "Custom"
  fix: "Trước đây mỗi màn tự vẽ nút theo kiểu riêng: có nơi dùng nút Bootstrap, có nơi dùng họ nút riêng của màn, chiều cao lệch từ 28 đến 50 điểm ảnh, bo góc và cỡ chữ mỗi nơi một kiểu, nhiều nút chỉ có biểu tượng mà trình đọc màn hình không đọc được tên. Nay toàn Portal dùng MỘT bộ nút chung với năm loại (chính, phụ, viền, nguy hiểm, nhẹ) và ba cỡ đúng số BA chốt: máy tính 32, 40, 46; điện thoại 36, 44, 48; vùng chạm trên điện thoại tối thiểu 44. Tổng cộng 102 chỗ đặt nút ở 12 mô đun đã chuyển sang bộ chung qua bốn lượt; lượt cuối chuyển 30 nút của màn Đăng ký thi, kể cả các nút do trang tự vẽ khi thêm người dự thi. Mỗi vùng hành động có tối đa một nút chính. Mọi nút chỉ có biểu tượng đều có tên đọc được bằng tiếng Việt. Khi đang gửi, nút giữ nguyên bề rộng, hiện vòng quay và chặn bấm lặp. Ô chọn ngày, ô chọn khung giờ và nút nổi Đăng ký của màn thi giữ dáng riêng nhưng đọc chung thông số cỡ và bo góc của bộ nút, nên sau này chỉnh cỡ nút một chỗ là các ô này đi theo. Kèm theo, màn đăng nhập trên điện thoại hết trượt ngang 74 điểm ảnh: nguyên nhân là tên ngôn ngữ bị nhét vào ô chọn ngôn ngữ vốn chỉ đủ chỗ cho lá cờ, làm cờ bị bóp thành một chấm và chữ tràn ra ngoài mép màn hình"
  impact: "Toàn bộ nút của Portal trên máy tính và điện thoại, cùng màn đăng nhập. Không đổi dữ liệu, quyền, luồng nghiệp vụ hay cách xử lý phía máy chủ; chỉ đổi giao diện. Đo trước và sau trên cùng dữ liệu: không màn nào đổi chiều cao, không màn nào mất bản ghi trong khung nhìn, không màn nào trượt ngang. Những chỗ người dùng sẽ thấy khác: nút chính nay màu xanh đậm 0F7CA8 thay vì xanh nhạt 28A9DF vì màu cũ với chữ trắng không đủ độ tương phản dễ đọc; nút gửi ở màn đăng nhập trên máy tính thấp đi từ 50 còn 46 cho đúng cỡ lớn của BA; nút lưu mật khẩu trên điện thoại cao lên từ 46 thành 48; ô ngày của lịch thi trên điện thoại nhỏ lại từ 38 còn 36, ô khung giờ từ khoảng 51 còn 48, ô ngày trên máy tính bo góc 8 thay vì 6; nút đóng hộp thoại của màn thi đồng bộ với các hộp thoại khác; khi gửi đăng ký thi nút không đổi chữ thành Đang gửi nữa mà giữ chữ và hiện vòng quay; trên màn đăng nhập điện thoại, ô chọn ngôn ngữ chỉ còn lá cờ và mũi tên như bản thiết kế, tên ngôn ngữ vẫn hiện đủ khi mở danh sách. Kiểm tự động 729 phép đều xanh, 10 phép phá có chủ đích đều làm đỏ đúng phép kiểm tương ứng"
  retest: "Mở Portal bằng tài khoản chủ tiệm trên máy tính khổ 1440 rồi điện thoại khổ 390. Đi qua 13 màn đại diện: Trang chủ, Đặt hàng, Giỏ hàng, Lịch sử mua, Giao hàng, Công nợ, Thông báo, Kiến thức, Hỗ trợ, Tạo yêu cầu hỗ trợ, Đăng ký thi, Tạo đăng ký thi, Đổi mật khẩu. Ở mỗi màn, các nút cùng cỡ phải cao bằng nhau, bo góc giống nhau, mỗi vùng hành động chỉ một nút xanh đậm. Nhấn phím Tab qua trang: mọi nút phải thấy viền xanh đậm; nhấn Enter hoặc phím cách trên nút phải chạy đúng một lần. Ở màn Tạo yêu cầu hỗ trợ và màn Tạo đăng ký thi, bấm đúp nút gửi: chỉ được gửi một lần, nút giữ nguyên bề rộng và hiện vòng quay. Ở màn Đăng ký thi kiểm thêm lịch chọn ngày, khung giờ, hộp thoại Thêm người, nút sửa và xóa người trong bảng, các bước của trình đăng ký trên điện thoại. Mở màn đăng nhập trên điện thoại: không được vuốt ngang được, ô ngôn ngữ hiện rõ lá cờ. Nếu chưa thấy gì đổi thì tải lại trang bỏ qua bộ nhớ đệm"
  limit: "Thứ nhất, nhãn rất dài: đã thử thay nhãn mọi nút bằng câu dài tiếng Việt, tiếng Anh và tiếng Trung ở 13 màn và 3 khổ; nút luôn giữ một dòng, giữ cỡ chữ, trang không trượt ngang. Riêng nút Xem trong dòng bảng ở Giao hàng và Công nợ, nhãn dài làm bảng cuộn ngang BÊN TRONG khung bảng, đúng cách bảng dữ liệu hoạt động; và nút rộng hết màn ở khổ 360 với nhãn tiếng Anh 44 ký tự dư ra 6 điểm ảnh. Vì BA chốt nhãn một dòng và không tự thu chữ, đề xuất quy ước nhãn nút tối đa 40 ký tự chữ Latin, nhãn trong dòng bảng tối đa 12 ký tự. Thứ hai, 4 nút quay lại ở đầu các bước đăng ký thi trên điện thoại có vùng chạm 28 nhân 30, dưới mức 44; nút này thuộc thành phần Tiêu đề trang có nút quay lại chứ không phải Nút, nên lượt này chỉ thêm tên đọc được, xin BA cho biết mở phiếu riêng hay gộp vào lượt tiêu đề trang. Thứ ba, nhóm màn Khảo sát (mã anh Thái), các nút biểu tượng trên thanh điều hướng trên cùng và trang danh sách nhượng quyền của khung Odoo gốc vẫn giữ nút cũ theo ranh giới đã ghi từ lượt E6b1. Thứ tư, ba mẫu màn đăng nhập hai lớp, đăng ký và quên mật khẩu kiểu cũ hiện không có đường nào mở tới nên đã chuyển nút nhưng chưa đo được bằng trình duyệt. Thứ năm, trên máy chạy thử hiện chưa có phiếu yêu cầu cập nhật thông tin nào và hai tài khoản thử không có công nợ, nên màn chi tiết yêu cầu thông tin và nút trong bảng Công nợ chỉ đo được trên bản sao cơ sở dữ liệu, chưa đo được trên máy chạy thử; khi có dữ liệu thật cần kiểm thêm hai chỗ này"

