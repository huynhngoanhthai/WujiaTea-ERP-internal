UAT-BH-008:
  sprint: "2026-09-10-D6b"
  build_override: "ĐÃ DEPLOY UAT 10/09/2026 — sẵn sàng retest | 10/09/2026 | Sprint 2026-09-10-D6b | wujia_portal_return 19.0.3.0.0 — deploy: git pull rồi -u wujia_portal_return (CSS của mô đun đi qua gói tài nguyên nên không cần đổi số ?v=, nhưng BẮT BUỘC phải nâng cấp mô đun vì lớp mới nằm trong tệp màn hình, chỉ kéo mã nguồn về là chưa đủ — bài học ngày 10/09)"
  url: "/portal/return — màn Bù hàng, danh sách trên điện thoại (dưới 992 điểm ảnh)"
  odoo_fit: "Custom"
  fix: "Thẻ bù hàng trên điện thoại trước đây đặt hai nhãn trạng thái khác nghĩa nằm cạnh nhau trên cùng một hàng với mã phiếu: nhãn duyệt yêu cầu và nhãn tiến độ bù hàng. Người xem không biết nhãn nào nói về việc gì, và khi mã phiếu dài thì cả hai nhãn cùng bị đẩy xuống hàng dưới. Nay hàng đầu chỉ còn mã phiếu và nhãn duyệt yêu cầu; tiến độ bù hàng xuống hàng riêng ngay bên dưới, có chữ Tiến độ bù đứng trước nên đọc là hiểu ngay. Cùng lúc, hai ô thông tin phụ Đơn gốc và Ngày yêu cầu trước đây xếp co giãn nên ô thứ hai trôi theo độ dài của ô thứ nhất, thẻ nào cũng lệch một kiểu; nay chia đôi bề ngang cố định nên thẳng cột giữa mọi thẻ. Nhãn tiến độ bù vẫn lấy nguyên từ một nguồn chữ duy nhất ở phần xử lý, không chép cứng, nên sau này đổi chữ ở một chỗ là cả màn đổi theo"
  impact: "Chỉ thẻ danh sách của màn Bù hàng trên điện thoại. Không đổi dữ liệu, không đổi quyền, không đổi luồng nghiệp vụ, không đổi chữ hiển thị, không đổi gì trên máy tính. Đo trước và sau trên bản sao cơ sở dữ liệu, mười ba màn nhân sáu khổ màn hình 1440, 1024, 992, 991, 390 và 360 là bảy mươi tám ô: chỉ ba ô đổi và cả ba đều là màn Bù hàng trên điện thoại, còn lại giữ nguyên từng con số. Không màn nào giảm số bản ghi nhìn thấy trong một màn hình, không màn nào cuộn ngang, không lỗi kịch bản trình duyệt, không chỗ nào thẻ trắng lồng thẻ trắng. Trang Bù hàng trên điện thoại dài thêm khoảng hai trăm đến ba trăm điểm ảnh, đây là hệ quả trực tiếp của việc thêm một hàng theo đúng yêu cầu chứ không phải tác dụng phụ. Bảy phép kiểm tra tự động mới, và đã chứng minh chúng có tác dụng bằng cách cố tình phá từng chỗ rồi xác nhận đúng một phép kiểm đỏ lên"
  retest: "Mở màn Bù hàng trên điện thoại ở khổ 390 và 360 điểm ảnh, xem danh sách yêu cầu. Với phiếu có hình thức xử lý là bù hàng: hàng đầu của thẻ chỉ được có mã phiếu bên trái và một nhãn trạng thái duyệt bên phải; ngay hàng dưới phải có chữ Tiến độ bù kèm nhãn tiến độ. Hai nhãn không được đứng chung một hàng nữa. Kiểm đủ bốn tình trạng bù hàng là Chưa xử lý, Đã lên đơn bù, Đang bù một phần và Đã bù đủ. Hai ô Đơn gốc và Ngày yêu cầu phải bắt đầu thẳng cột nhau giữa mọi thẻ, kể cả thẻ có ô Đơn gốc trống hiện dấu gạch ngang. Cuối cùng thu màn hình về 360 điểm ảnh, danh sách không được cuộn ngang. Nếu vẫn thấy hai nhãn chung hàng thì tải lại trang bỏ qua bộ nhớ đệm, và kiểm giúp là mô đun đã được nâng cấp lên 19.0.3.0.0 chứ không chỉ kéo mã nguồn"
  limit: "Thứ nhất, ô ghi Đề xuất điều chỉnh của phiếu này nói thẻ nên chuẩn hoá theo khuôn thẻ chung, mà khuôn thẻ chung được hiểu là khuôn thẻ nền. Trên thực tế thẻ bù hàng đã được đưa về khuôn danh sách chung từ đợt trước, và chính khuôn danh sách chung đã vẽ sẵn viền, bo góc và nền cho từng bản ghi. Nếu bọc thêm một khuôn thẻ nền nữa thì sẽ dựng lại đúng lỗi thẻ trắng lồng thẻ trắng mà vừa phải vá hôm 09 tháng 09. Vì vậy đợt này giữ nguyên khuôn danh sách chung và chỉ sửa thứ bậc thông tin bên trong thẻ, không đụng tới viền, bo góc hay nền. Xin BA xác nhận cách hiểu này khi retest. Thứ hai, phần dáng chữ và khoảng cách mà ô Đề xuất nhắc tới đã do khuôn danh sách chung quy định từ đợt trước, đợt này chỉ kiểm lại là màn Bù hàng không còn khai riêng chỗ nào chống lại khuôn chung, chứ không đặt thêm con số mới. Thứ ba, đây mới là một trong hai phần của cụm Bù hàng: phần biểu mẫu tạo yêu cầu, gồm cỡ ô nhập trên điện thoại và việc gắn nhãn với ô nhập, nằm ở đợt kế tiếp"
