  fix: "Trước đây mỗi màn Portal tự dựng danh sách theo một kiểu riêng: ba mươi mốt chỗ, bảng trên máy tính thì dòng tiêu đề cao 46 hoặc 50 điểm ảnh và không ô tiêu đề nào khai rõ là tiêu đề cột nên trình đọc màn hình không hiểu, đệm ô mỗi bảng một khác, chiều cao dòng bị ép cứng nên nội dung dài bị bó; danh sách trên điện thoại thì khoảng cách giữa các thẻ chạy từ 0 đến 12 điểm ảnh và bo góc từ 0 đến 16. Nay tất cả dùng chung một khuôn danh sách duy nhất với hai dáng: bảng cho máy tính từ 992 điểm ảnh trở lên (tiêu đề 44, dòng tối thiểu 52, đệm ô 10 và 16, mọi ô tiêu đề đều khai rõ là tiêu đề cột) và thẻ cho điện thoại (thẻ gọn cao 64 đến 76 hoặc thẻ nhiều thông tin cao 96 đến 120, khoảng cách 8, bo góc 12). Làm qua bảy đợt theo từng họ màn, đợt cuối là màn Đăng ký thi cùng hai màn Yêu cầu cập nhật thông tin và Thông tin cửa hàng. Nhân đó sửa luôn hai lỗi thật: nút chuyển trang ở màn Đăng ký thi và màn Công nợ vẫn hiện khi chỉ có đúng một trang, còn ở màn Thông tin cửa hàng thì nút chuyển trang là chữ vẽ cứng trong mã màn hình chứ danh sách thành viên chưa bao giờ được phân trang — nay chỉ hiện khi thật sự có nhiều hơn một trang, riêng ô chọn số dòng mỗi trang thì giữ vì đó là ô điều khiển"
  impact: "Toàn bộ danh sách trên Portal. Không đổi dữ liệu, không đổi quyền, không đổi luồng nghiệp vụ, không đổi chữ hiển thị. Mỗi đợt đều đo trước và sau trên bản sao cơ sở dữ liệu ở sáu khổ màn 1440, 1024, 992, 991, 390 và 360, và so từng ô với số của đợt liền trước để chắc là môi trường đúng trước khi kết luận. Các màn ngoài phạm vi mỗi đợt giữ nguyên từng số một. Nhịp tiêu đề sang thân thẻ giữ đúng 12 điểm ảnh, không màn nào cuộn ngang, không lỗi kịch bản nào trên trình duyệt. Bộ kiểm tra tự động 66 phép thử, và mỗi đợt đều chứng minh bộ kiểm tra có tác dụng bằng cách cố tình sửa sai từng chỗ rồi xác nhận đúng một phép thử đỏ lên, sau đó khôi phục nguyên vẹn theo mã kiểm tra tệp"
  retest: "Mở Trang chủ, Lịch sử mua hàng, Đổi trả, Giao hàng, Công nợ và Lịch sử thanh toán, Thông báo, Hỗ trợ, Kiến thức, Đăng ký thi cùng hai màn con Đăng ký mới và Chi tiết phiếu, Yêu cầu cập nhật thông tin, Thông tin cửa hàng, ở máy tính 1440 và điện thoại 390. Trên máy tính mọi bảng phải cùng một dáng: dòng tiêu đề cao đều nhau, đệm ô đều nhau, dòng không bị bó khi nội dung dài. Trên điện thoại mọi danh sách phải cách nhau đều và bo góc đều. Nút chuyển trang chỉ được hiện khi danh sách thật sự có nhiều hơn một trang: ở màn Đăng ký thi hãy chọn 50 dòng mỗi trang, nút chuyển trang phải biến mất còn dòng chữ đếm số bản ghi và ô chọn số dòng vẫn còn; ở màn Thông tin cửa hàng không được còn nút chuyển trang nào. Thu màn hình về 1024, 992 và 360: không cuộn ngang, không danh sách nào vỡ. Nếu vẫn thấy dáng cũ thì tải lại trang bỏ qua bộ nhớ đệm"
  limit: "Thứ nhất, bộ số của cả cụm vẫn là số tạm: bảy câu trong tài liệu câu hỏi gửi BA chưa có trả lời, nên xin BA xem bảy câu đó trước khi đóng, mỗi hướng trả lời đều đã có số đo kèm sẵn và lùi lại chỉ là sửa một khối giao diện. Thứ hai, hai danh sách của nhóm màn Khảo sát cố ý chưa đưa vào khuôn chung theo quyết định của chủ dự án ngày 08 tháng 09 vì nhóm màn đó viết theo lối khác, đây là hoãn có chủ đích chứ không phải bỏ sót. Thứ ba, ở màn Đăng ký thi trên máy tính khổ 1440, số phiếu nhìn thấy trong một màn giảm từ tám xuống bảy vì bỏ ép chiều cao dòng theo đúng bộ số BA; và ở điện thoại khổ 360 thẻ phiếu cao tới 135 điểm ảnh, vượt trần 120, do tiêu đề tự xuống dòng — muốn ép về trần thì phải bớt thông tin nên chờ BA chỉ định. Thứ tư, hàng người dự thi ở màn chi tiết phiếu nay sáng lên khi rê chuột dù chưa bấm mở được màn nào, giống hệt trường hợp hàng hoá đơn đã hỏi ở câu sáu, xin BA chốt một lần cho cả hai. Thứ năm, bảng nhập danh sách người dự thi trong biểu mẫu đăng ký không thuộc phạm vi vì đó là bảng nhập liệu chứ không phải danh sách bản ghi. Thứ sáu, màn Báo cáo đặt hàng đang lỗi 500 là lỗi có sẵn thuộc nhóm việc tối ưu, không thuộc đợt này. Thứ bảy, đo lại trên máy chủ kiểm thử ngày 08 tháng 09 phát hiện bảng Kết quả thi trên máy tính ở màn chi tiết phiếu chưa được đưa về khuôn chung, trong khi bản điện thoại của chính màn đó đã xong; bảng kiểm kê ban đầu bỏ sót chỗ này vì chưa ai mở màn con trên máy tính. Dev đã vá ngay trong ngày ở đợt D5h.1, đo được ô tiêu đề cột khai đủ bảy trên bảy, dòng tiêu đề từ 50 về 44, đệm ô từ 0 và 22 về 10 và 16, chiều cao dòng từ 58 cứng thành 56 mềm, đo lại toàn bộ mười lăm màn không lệch một ô nào; phần này CẦN DEPLOY LẠI mới retest được, mô đun Đăng ký thi phiên bản 19.0.5.13.0. Thứ tám, tiêu đề hai cột Số người và Trạng thái đăng ký của bảng Đăng ký thi bị đè chữ vì bảng khai chiều rộng cột cứng quá hẹp so với chữ tiếng Việt; đây là lỗi có sẵn và đợt này làm nhẹ đi chứ không gây ra, đo được ba cột tràn trước và hai cột sau. Thứ chín, trên dữ liệu thật của máy chủ, hàng thành viên cửa hàng ở điện thoại cao 143 đến 200 điểm ảnh do tên nhân viên kèm mã cửa hàng xuống ba bốn dòng, vượt trần 76 mà BA đặt; đây là cùng cơ chế đã hỏi ở câu 4b của tài liệu câu hỏi và xin BA chốt một lần. Thứ mười, sau khi khép cụm, ngày 09 tháng 09 chủ dự án phát hiện trên máy chủ kiểm thử rằng mười một danh sách đang hiện thẻ trắng lồng trong thẻ trắng: khuôn danh sách mới cho mỗi bản ghi một thẻ có viền, trong khi mười một chỗ đó vẫn nằm trong một thẻ có viền của đợt trước, thành hai khung lồng nhau. Đây là lỗi do đợt này gây ra và trái với chính yêu cầu của BA ở khuôn thẻ (không thẻ trắng lồng thẻ trắng), nên không phải chỗ chờ BA chốt mà là chỗ phải vá: bỏ viền của khung ngoài, giữ mỗi bản ghi một thẻ. Mười một chỗ gồm ba khối xem nhanh của Trang chủ trên máy tính, năm khối Trang chủ trên điện thoại, danh sách thành viên ở Thông tin cửa hàng, danh sách bài viết Kiến thức và danh sách phiếu Hỗ trợ. Các danh sách dạng bảng nằm trong khung là đúng chuẩn, không đụng. Đã vá ngay trong ngày ở đợt D5h.2: mười một chỗ chia làm hai dạng, sáu chỗ có tiêu đề nằm ngoài khung nên bỏ khung ngoài để mỗi bản ghi là một thẻ, năm chỗ có khung ôm cả tiêu đề nên giữ khung và trả các dòng bên trong về dáng dòng ngăn nhau bằng nét kẻ, đúng như trước khi đợt này bắt đầu. Đo lại bảy màn ở ba khổ màn hình: số chỗ thẻ lồng thẻ từ mười tám về không, không màn nào giảm số bản ghi nhìn thấy, không màn nào tràn ngang hay lỗi hiển thị, các bảng giữ nguyên từng con số, trang chỉ ngắn bớt đúng phần đệm thừa. Sáu mươi tám phép kiểm tự động đều đạt. Phần này CẦN DEPLOY LẠI mới retest được, mô đun giao diện chung phiên bản 19.0.46.0.0"
