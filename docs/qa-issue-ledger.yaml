  build_override: "ĐÃ DEPLOY UAT http://113.161.187.126:8019 ngày 19/09/2026 — sẵn sàng retest | Sprint 2026-09-19-E5c (khép cụm E5: E5a + E5b1 + E5b2 + E5c, cả bốn lượt lên cùng một lần) | wujia_portal_layout 19.0.55.1.0 · wujia_portal_base 19.0.7.19.1 · wujia_portal_notification 19.0.2.18.0, nâng cấp kèm tám mô đun có tệp màn hình bị sửa: công nợ, giao hàng, thi, kiến thức, thông báo, lịch sử mua hàng, đổi trả, hỗ trợ | đã nghiệm thu lại chỉ-đọc trên chính máy chủ sau khi cài: mười bốn màn nhân năm khổ màn hình 320, 390, 430, 991 và 1440, bốn mươi hai ô đo đều đạt và không ô nào lệch, hai mươi tám ô còn lại là danh sách rỗng vì tài khoản quản trị không gắn cửa hàng nên không kết luận; khoảng cách thanh lọc xuống nội dung đúng mười sáu ở mọi màn có thanh lọc, lề hai bên đúng mười hai ở mọi màn có bản ghi, đệm trong thẻ đúng mười hai, khung trang của các màn Đặt hàng, Lịch sử mua hàng, Thông báo và cả màn Giám sát cửa hàng đều đúng mười hai hai bên, không màn nào cuộn ngang, không lỗi kịch bản trình duyệt nào; chấm báo thông báo chưa đọc đã lên máy chủ đúng bản vá (đo trong bảng kiểu dáng của máy chủ) | nếu thấy dáng cũ xin tải lại trang bỏ qua bộ nhớ đệm một lần (tệp thành phần 1314, tệp biến 1295, tệp chủ đề 1221)"
  url: "Cổng cửa hàng trên điện thoại — toàn bộ các màn danh sách: Trang chủ, Lịch sử mua hàng, Giao hàng, Thông báo, Hỗ trợ, Đổi trả, Kiến thức, Đăng ký thi và hai màn con, Công nợ và Lịch sử thanh toán, Thông tin cửa hàng, Đặt hàng, Báo cáo đặt hàng"
  odoo_fit: "Custom"
  fix: "Đây là lượt cuối của việc chuẩn hoá thẻ danh sách. Bốn lượt trước đã đưa toàn bộ hai mươi hai chỗ hiển thị danh sách về chung một khuôn thẻ; lượt này trả nốt ba món thuộc về trang chứ không thuộc về ruột thẻ. Món thứ nhất là nhịp giữa thanh lọc và phần nội dung ngay dưới nó: tám màn đang cách hai mươi bốn điểm ảnh trong khi BA chốt mười sáu, nguyên nhân là thanh lọc tự đặt khoảng cách riêng rồi cộng thêm khoảng cách sẵn có của khung trang; nay thanh lọc lấy đúng khoảng cách của khung trang nên hai cộng lại vừa đúng mười sáu, và về sau đổi nhịp trang thì thanh lọc đổi theo, không còn hai con số nằm hai nơi. Món thứ hai là đệm bên trong mỗi thẻ: đang là mười hai dọc nhưng mười bốn ngang, nay về mười hai đều bốn phía đúng chuẩn thành phần. Món thứ ba là lề trái phải của trang danh sách: đang mười sáu, BA chốt mười hai, nay đổi ở đúng một nơi là bộ biến chung nên mọi màn đổi cùng lúc. Khi đo lại phát hiện thêm một chỗ lệch có sẵn: các màn dựng theo khung của bộ giao diện nền giữ lề mười sáu phẩy tám của bộ đó, trong khi các màn dựng theo khung riêng đã lấy lề từ bộ biến chung, nên hai họ màn lệch nhau năm điểm ảnh mà không ai để ý; nay khung nền cũng lấy lề từ cùng một nguồn, và từ đây mọi màn trên điện thoại kể cả màn Giám sát cửa hàng đều đo đúng mười hai hai bên. Cuối cùng, phép kiểm tám khổ màn hình bắt được nút Chọn ở bước một màn đăng ký thi chỉ cao hai mươi mốt và rộng ba mươi bảy điểm ảnh, nhỏ hơn mức bốn mươi tư mà chuẩn chạm tay đòi hỏi; đây là lỗi đã có từ lượt trước chứ không phải do lượt này gây ra, và đã nới vùng chạm lên bốn mươi lăm mà chiều cao thẻ không tăng một điểm ảnh nào. Cuối phiên, lượt soi mã đối kháng còn tìm ra một lỗi thật của đợt trước: chấm tròn báo thông báo chưa đọc được khai tám nhân tám điểm ảnh nhưng nằm trong một ô không phải dạng hàng ngang nên trình duyệt bỏ qua kích thước, đo trên trình duyệt ra bề rộng bằng không, tức là chấm đó chưa bao giờ hiện lên kể từ khi đưa màn Thông báo về khuôn chung; nay đã sửa và đo lại đúng tám nhân tám. Thanh dọc màu ở mép trái thẻ chưa đọc vẫn còn từ trước nên người dùng không mất hẳn dấu hiệu, nhưng dấu chấm nay mới thật sự hiện"
  impact: "Toàn bộ danh sách trên điện thoại của Cổng cửa hàng, cộng thêm lề trang của mọi màn điện thoại vì lề là số dùng chung. Không đổi dữ liệu, không đổi quyền, không đổi ngày, không đổi tiền, không đổi trạng thái, không đổi bộ lọc, không đổi phân trang, không đổi luồng nghiệp vụ, không đổi chữ hiển thị. Đo trước và sau trên bản sao cơ sở dữ liệu tại tám khổ màn hình 320, 360, 390, 430, 991, 992, 1024 và 1440 trên mười hai màn danh sách, tổng cộng chín mươi sáu ô đo, không ô nào vi phạm quy tắc hình thể thẻ và không chỗ nào cắt mã đơn, số tiền hay nhãn trạng thái. Bảng kiểm kê từng trường trên mười sáu màn nhân hai khổ đếm được một trăm chín mươi tư bản ghi, không trường nào mất và không màn nào lệch số bản ghi. Những màn cố ý không đụng tới, gồm Trang chủ, bảng trên máy tính và màn Đặt hàng, được đóng băng và so từng ký tự trước sau: giống hệt nhau. Riêng màn Đặt hàng trước đây bị đóng băng rỗng vì màn đó không có danh sách nào để so, nay đã đổi sang so chữ ký của cả trang nên phép kiểm có giá trị thật. Không màn nào cuộn ngang, không lỗi kịch bản trình duyệt, không chuyển hướng ngầm. Bộ kiểm tra tự động sáu trăm tám mươi sáu phép thử đều đạt, và đã chứng minh bộ kiểm có tác dụng bằng cách cố tình phá từng luật một rồi xác nhận đúng một phép thử tương ứng đỏ lên, mười trên mười lần, sau đó khôi phục nguyên vẹn"
  retest: "Mở trên điện thoại ở khổ 390 điểm ảnh các màn Lịch sử mua hàng, Thông báo, Hỗ trợ, Đổi trả, Kiến thức, Giao hàng và Đăng ký thi. Ở mỗi màn, khoảng cách từ thanh lọc xuống phần nội dung ngay dưới phải là mười sáu điểm ảnh, gọn hơn trước một nhịp, nhìn thấy rõ bằng mắt là danh sách nhích lên gần thanh lọc hơn. Tiếp theo xem lề hai bên: mọi màn danh sách phải cách mép màn hình đúng mười hai điểm ảnh và quan trọng là phải bằng nhau giữa mọi màn, trước đây màn Lịch sử mua hàng và màn Đặt hàng hở rộng hơn các màn khác nên xin so chính hai màn đó với màn Thông báo. Mở màn Đăng ký thi ở bước chọn khoá thi và bấm thử chữ Chọn bằng ngón tay: vùng bấm nay rộng hơn hẳn, dễ trúng, trong khi thẻ khoá thi không cao thêm. Sau đó lướt qua Trang chủ, màn Đặt hàng và các bảng trên máy tính ở khổ 1440: những màn này phải giống hệt như trước, không được đổi gì. Cuối cùng thu màn hình về 320 điểm ảnh rồi kéo lên 1440: không màn nào cuộn ngang, không danh sách nào vỡ. Nếu vẫn thấy dáng cũ thì tải lại trang bỏ qua bộ nhớ đệm và kiểm giúp là hai mô đun đã được nâng cấp chứ không chỉ kéo mã"
  limit: "Thứ nhất, hai câu hỏi còn treo từ lượt trước đã được chủ dự án uỷ quyền cho Dev tự quyết và xin báo lại để BA biết. Câu một: giữ ô biểu tượng ba mươi hai nhân ba mươi hai ở các màn Thông báo, Kiến thức và danh sách nhân sự màn Thi, dù đặc tả thành phần ghi là không đặt biểu tượng trang trí lớn trước tên; lý do là ô đó không phải trang trí mà là tín hiệu màu theo loại, bỏ đi thì màn Thông báo mất cách phân biệt loại thông báo bằng màu. Câu hai: dải chiều cao khai cho hai dáng thẻ được nới theo số đo thật của chín mươi sáu ô chứ không theo con số đề xuất ở lượt trước, thẻ gọn nay là sáu mươi tư đến một trăm mười hai và thẻ nhiều thông tin là chín mươi sáu đến một trăm năm mươi sáu; lý do là thực tế có thẻ cao hơn dự kiến khi địa chỉ thư điện tử hoặc ghi chú kết quả thi tự xuống dòng, mà đặc tả đòi thẻ tự co giãn theo nội dung nên không được ép cứng chiều cao để lấy con số đẹp. Hệ quả cần BA biết: hai dải nay chồng lên nhau trong đoạn từ chín mươi sáu đến một trăm mười hai, nên chiều cao không còn là dấu hiệu để phân biệt hai dáng thẻ, việc phân biệt dựa vào khai báo dáng chứ không dựa vào số đo. Thứ hai, màn Thông tin cửa hàng đo được lề hai mươi bảy chứ không phải mười hai, vì danh sách ở màn đó nằm lồng trong một thẻ nền: mười hai của trang cộng mười bốn đệm trong của thẻ nền cộng một nét viền. Đây thuộc phạm vi phiếu chuẩn hoá thẻ nền chứ không thuộc phiếu này, chỉ ghi nhận, không sửa. Thứ ba, màn Công nợ còn một dấu hiệu có sẵn từ trước: thẻ cuối cùng chạm sát mép thanh cố định dưới đáy; đã đo đối chứng trên cùng một cây mã cho thấy con số trước và sau lượt này giống hệt nhau nên không phải do lượt này gây ra, và trang vẫn còn một trăm hai mươi lăm điểm ảnh khoảng trống cuối nên thanh không che mất bản ghi; xin xếp vào nhóm việc về thanh cố định. Thứ tư, ba mục cố ý nằm ngoài phạm vi theo quyết định trước đó: nhóm màn Khảo sát hoãn vô thời hạn vì thuộc phần mã của bộ phận khác, khối xem nhanh ở Trang chủ giữ nguyên lối hiển thị gộp hàng đúng như chính phiếu này yêu cầu, và một điểm lệch giữa đặc tả với thực tế chỉ ghi nhận chứ không sửa. Thứ năm, mã đã đẩy lên nhánh chính nhưng CHƯA lên máy chủ kiểm thử, xin deploy rồi mới retest"

