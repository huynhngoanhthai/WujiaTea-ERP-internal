# I6 (09/10/2026) — 159 WJ-NOTI-001 (BA dùng lại ID; entry 08/2026 về giờ hiển thị đã Done, thay bằng entry này).
#   Chủ dự án chốt: 4 dấu đọc thiếu cửa hàng của thông báo chỉ định trên UAT ⇒ xoá (không tự gán);
#   thống kê backend của thông báo toàn hệ đếm theo người dùng.
WJ-NOTI-001:
  stt: 159
  sprint: "2026-10-09-I6"
  build_override: "ĐÃ DEPLOY UAT 09/10/2026 — sẵn sàng retest | Sprint 2026-10-09-I6 | commit: 76f5671d | Deploy: -u wujia_notification,wujia_portal_notification rồi khởi động lại (CÓ bước cập nhật dữ liệu: gộp/xoá dấu đã đọc cũ, ghi log từng dòng xoá) | URL: /portal, /portal/notification, /portal/notification/<id>, chuông đầu trang | Đo lại chỉ đọc trên UAT 09/10: em.hcm tại HCM-01: số chưa đọc ở chuông = ô Trang chủ = lọc Chưa đọc = 1"
  url: "/portal (ô Thông báo), chuông đầu trang + hộp chuông, /portal/notification (lọc Chưa đọc / Đã đọc, nút Đánh dấu tất cả là đã đọc), /portal/notification/<id>; backend Thông báo (cột Đã đọc / Người nhận / Chưa đọc) — máy tính và điện thoại"
  odoo_fit: "Custom"
  fix: "Nguyên nhân: dấu đã đọc luôn ghi theo người dùng + thông báo + cửa hàng, nên thông báo gửi tất cả cửa hàng phải đọc lại ở từng cửa hàng, và khi chưa chọn cửa hàng thì không ghi được (mở chi tiết không tính, Đánh dấu tất cả báo phải chọn cửa hàng). Số chưa đọc lấy tổng thông báo trừ số dòng đã đọc, nên một thông báo đọc ở nhiều cửa hàng bị trừ nhiều lần; bộ lọc Chưa đọc của danh sách lại dựng điều kiện riêng. Nay: thông báo gửi tất cả cửa hàng chỉ cần đọc một lần theo người dùng, có hiệu lực ở mọi cửa hàng và cả khi chưa chọn cửa hàng; thông báo chỉ định cửa hàng ghi riêng theo đúng cửa hàng nhận đang chọn, đọc ở A không tính cho B, cửa hàng không nhận thì không ghi. Chưa chọn cửa hàng: chỉ thấy thông báo toàn hệ, mở chi tiết vẫn ghi đã đọc, Đánh dấu tất cả chỉ áp dụng thông báo toàn hệ còn hiệu lực. Trang chủ, số trên chuông, hộp chuông, số cạnh tiêu đề, bộ lọc Chưa đọc và Đánh dấu tất cả dùng chung một điều kiện: đã gửi, đã tới giờ, đúng đối tượng, còn hiệu lực, chưa có dấu đọc đúng phạm vi. Lịch sử vẫn mở được thông báo hết hiệu lực nhưng không tính vào số chưa đọc. Nút đổi nhãn thành Đánh dấu tất cả là đã đọc, rê chuột hiện phạm vi áp dụng (chưa chọn cửa hàng: chỉ thông báo toàn hệ; có cửa hàng: thêm thông báo của cửa hàng đó). Dữ liệu cũ khi cập nhật: thông báo toàn hệ đã đọc ở nhiều cửa hàng gộp thành một dấu theo người dùng (giữ ngày đọc sớm nhất, lần mở gần nhất); dấu của thông báo chỉ định mà thiếu cửa hàng hoặc sai cửa hàng nhận bị xoá, không đoán. Backend: thông báo toàn hệ đếm Người nhận và Đã đọc theo người dùng; thông báo chỉ định đếm theo cặp người dùng + cửa hàng nhận"
  impact: "Trang chủ (ô Thông báo), chuông và hộp chuông trên mọi trang, danh sách và chi tiết Thông báo, cột thống kê đọc ở backend. Không đổi nội dung, đối tượng nhận, quyền xem, thứ tự hay giờ hiển thị thông báo. Số chưa đọc của từng người có thể giảm (thông báo toàn hệ đã đọc ở cửa hàng khác nay được tính). Đo bản sao dữ liệu, tài khoản 3 cửa hàng, máy tính 1920 và điện thoại 391: trước thao tác chưa chọn 12, Cầu Giấy 41, TP HCM Quận 1 41 — Trang chủ, chuông, hộp chuông, số cạnh tiêu đề và số dòng lọc Chưa đọc trùng nhau ở mọi bước; chưa chọn cửa hàng mở một thông báo toàn hệ ⇒ cả ba nơi cùng giảm 1 (11 / 40 / 40); Đánh dấu tất cả khi chưa chọn đánh 11 thông báo ⇒ 0 / 29 / 29 (còn thông báo chỉ định); Đánh dấu tất cả ở Cầu Giấy ⇒ Cầu Giấy 0, TP HCM Quận 1 vẫn 29. Cập nhật dữ liệu trên bản sao dựng giống UAT: 18 dấu còn 11, gộp 6 cặp toàn hệ, xoá 5 dấu sai phạm vi. Không cuộn ngang, không lỗi trang. Đếm chưa đọc vẫn là một câu truy vấn có chỉ mục"
  retest: "Tài khoản thuộc cửa hàng A và B. (1) Chưa chọn cửa hàng: danh sách chỉ có thông báo toàn hệ; mở một thông báo chưa đọc ⇒ chuông giảm 1; chọn A rồi B ⇒ thông báo đó vẫn Đã đọc, chuông không tăng lại. (2) Chọn A, mở một thông báo chỉ gửi A và B ⇒ đã đọc ở A; chuyển sang B ⇒ thông báo đó vẫn Chưa đọc. (3) Chưa chọn cửa hàng, bấm Đánh dấu tất cả là đã đọc (rê chuột thấy câu chỉ áp dụng thông báo toàn hệ) ⇒ chuông về 0; chọn A ⇒ chỉ còn thông báo riêng của A chưa đọc. (4) Tạo ở backend một thông báo hẹn giờ ngày mai và một thông báo đã hết hạn ⇒ cả hai không làm tăng số chưa đọc ở bất kỳ đâu, không có trong lọc Chưa đọc; thông báo hết hạn vẫn mở được từ danh sách. (5) Ở mỗi bước so Trang chủ, số trên chuông, số trong hộp chuông, số cạnh tiêu đề trang Thông báo và số dòng khi lọc Chưa đọc: phải bằng nhau. Kiểm trên máy tính khổ 1440 và điện thoại 390"
  limit: "Thứ nhất, khi cập nhật trên UAT sẽ xoá 4 dấu đã đọc của Administrator cho thông báo ANN/2026/0012–0015 (gửi riêng 3 cửa hàng, dấu cũ không ghi cửa hàng) — không xác định được đọc ở đâu nên không gán; Administrator sẽ thấy lại 4 thông báo này là Chưa đọc. 2 dấu thiếu cửa hàng của thông báo toàn hệ (ANN/2026/0001, 0011) vẫn giữ vì đúng phạm vi mới. Thứ hai, nút Đánh dấu tất cả là đã đọc hiện chỉ có trên máy tính như trước; điện thoại chưa có nút này (không thuộc issue). Thứ ba, Trang chủ khi chưa chọn cửa hàng vẫn hiện khối nhắc chọn thay cho các ô số (luật WJ-PORTAL-SCOPE-001); số thông báo toàn hệ chưa đọc lúc đó xem ở chuông và trang Thông báo. Thứ tư, cột thống kê đọc ở backend đổi cách đếm cho thông báo toàn hệ (theo người dùng), nên số Người nhận / Đã đọc của các thông báo cũ sẽ khác trước"

