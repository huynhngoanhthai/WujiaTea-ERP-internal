  retest: "Điện thoại 390, lần lượt mở Giao hàng, Lịch sử đặt hàng, Công nợ, Đổi trả, Đăng ký thi, Kiến thức, Hỗ trợ, Thông báo: trong mỗi thẻ nhãn (vd Xuất phát (dự kiến), Đơn liên quan) nhỏ hơn và nhạt hơn giá trị bên cạnh; nhãn trạng thái và nhãn danh mục cùng cỡ chữ, chữ nằm giữa nhãn; thẻ không cao hơn trước, số thẻ thấy trên một màn như cũ. Thử 360 và 430: tên, tiền, nhãn không bị cắt. Máy tính 1440: bảng các màn trên và thẻ Kiến thức không đổi"
