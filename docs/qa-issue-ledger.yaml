  fix: "Trước đây mở một cửa hàng mới phải đi qua ba màn rời nhau: tạo hồ sơ cửa hàng, tự tìm rồi gắn đối tác, sang phần Người dùng tạo tài khoản và phải tự biết chọn đúng loại tài khoản, rồi quay lại cửa hàng gán thành viên. Nay có một màn duy nhất làm trọn cả bốn việc. Cửa hàng mới sinh ra ở trạng thái Nháp. Ở bước đối tác, người quản trị chọn tạo mới hoặc nối vào một đối tác sẵn có; nếu tạo mới mà hệ thống thấy đã có đối tác trùng tên, trùng tám số cuối điện thoại, trùng thư điện tử hoặc trùng mã số thuế thì hiện thẳng danh sách nghi trùng và dừng lại cho tới khi người quản trị xác nhận vẫn muốn tạo; nếu nối vào đối tác sẵn có mà đối tác đó đã là chủ thể của cửa hàng khác thì hiện cảnh báo ngay tại chỗ. Ở bước người dùng, mỗi dòng chọn tạo tài khoản mới hoặc dùng tài khoản sẵn có. Tạo mới thì hệ thống tự kiểm tên đăng nhập và thư điện tử, đã có ai dùng rồi thì báo và bắt chuyển sang dùng tài khoản sẵn có chứ không đẻ tài khoản thứ hai; tạo xong tài khoản chỉ mang quyền cổng thông tin, không hề có ô chọn loại tài khoản và không cần bật chế độ kỹ thuật. Dùng tài khoản sẵn có thì hệ thống chặn rõ ràng ba trường hợp: tài khoản thuộc nhóm nội bộ, tài khoản đã bị lưu trữ, và tài khoản đã là thành viên của chính cửa hàng này; cả ba trường hợp đều chỉ báo lỗi chứ tuyệt đối không tự sửa quyền của ai. Hồ sơ cá nhân của người dùng được tạo riêng, không bị gán nhầm thành hồ sơ đối tác của cửa hàng, nên công nợ của cửa hàng và giao dịch cá nhân không lẫn vào nhau. Toàn bộ việc kiểm tra chạy xong hết rồi mới bắt đầu ghi, nên hỏng ở bất kỳ bước nào cũng không để lại cửa hàng hay tài khoản mồ côi. Cuối cùng, nút Kích hoạt nay chỉ bấm được khi cửa hàng đã có đối tác và ít nhất một chủ tiệm còn hiệu lực; thiếu cái nào hệ thống nói thẳng thiếu cái đó và giữ cửa hàng ở Nháp."
  impact: "Chỉ phần quản trị nhượng quyền ở giao diện nội bộ. Cổng thông tin của cửa hàng không đổi một dòng nào. Không thêm bảng, không đổi cấu trúc dữ liệu, không có bước cập nhật dữ liệu cũ: cửa hàng đang có trên máy chủ giữ nguyên trạng thái, chỉ cửa hàng tạo mới từ nay mới sinh ra ở Nháp. Điều kiện kích hoạt đặt ở nút bấm chứ không phải ràng buộc dữ liệu, nên cửa hàng cũ đang hoạt động mà thiếu chủ tiệm vẫn sửa và vận hành bình thường, không bị khoá cứng. Đã đọc số liệu thật trên máy chủ trước khi làm: ba cửa hàng đều đang hoạt động, không cửa hàng nào thiếu đối tác, một cửa hàng mã HN-02 thiếu chủ tiệm hiệu lực. Kiểm tra chạy trên một bản sao cơ sở dữ liệu riêng ở cổng riêng, không đụng máy chủ đang chạy: 18 phép thử mới đều đạt và mỗi lớp kiểm tra đều được chứng minh có tác dụng bằng cách tạm gỡ ra thấy đúng phép thử tương ứng đỏ; chạy lại toàn bộ 13 phần mềm liên quan được 299 phép thử với 7 lỗi, và lượt đối chứng chạy đúng lệnh đó trên bản chưa sửa cũng ra đúng 7 lỗi ấy, nên bảy lỗi đó là vốn có của cơ sở dữ liệu kiểm thử chứ không phải do đợt sửa này."
  retest: "Vào Quản lý nhượng quyền, mục Vận hành, chọn Onboarding cửa hàng. Nhập mã và tên cửa hàng, ngày kết thúc hợp đồng, chọn Tạo đối tác mới với tên và số điện thoại giống một đối tác đã có: hệ thống phải hiện danh sách nghi trùng và không cho lưu cho tới khi tích ô xác nhận. Thêm một dòng người dùng, chọn Tạo tài khoản mới, đặt vai trò Chủ tiệm và tích Chủ tiệm chính, rồi xác nhận. Kết quả phải là: cửa hàng hiện ra ở trạng thái Nháp, đã gắn đối tác, tab Thành viên có đúng một dòng. Vào phần Người dùng kiểm tài khoản vừa tạo: chỉ có quyền cổng thông tin, và hồ sơ liên hệ của tài khoản KHÔNG phải hồ sơ đối tác của cửa hàng. Chạy lại đúng màn onboarding đó lần nữa cho cùng cửa hàng: không được sinh thêm đối tác thứ hai, và thêm lại đúng người dùng cũ phải báo lỗi trùng thành viên chứ không tạo dòng thứ hai. Thử dòng người dùng chọn Dùng tài khoản sẵn có và trỏ vào một tài khoản nhân viên nội bộ: phải báo lỗi nói rõ đó là tài khoản nội bộ, và sau khi báo lỗi thì quyền của tài khoản đó phải y nguyên. Cuối cùng bấm Kích hoạt trên một cửa hàng Nháp chưa có chủ tiệm: phải bị chặn, báo rõ còn thiếu chủ tiệm, và cửa hàng vẫn ở Nháp; gán chủ tiệm rồi bấm lại thì mới chuyển sang Đang hoạt động."
  limit: "Thứ nhất, cửa hàng ở trạng thái Nháp mới chỉ bị chặn ở cổng thông tin của cửa hàng, còn ở giao diện nội bộ thì vẫn tạo và xác nhận đơn hàng, ghi sổ hoá đơn cho cửa hàng Nháp được. Chỗ chặn đó nằm trong phần vừa nghiệm thu ở đợt sửa trước về gắn cửa hàng cho chứng từ, đụng vào là phải chạy lại toàn bộ kiểm tra của đợt ấy, nên đợt này cố ý không đụng. Nhờ BA cho biết có cần chặn cả ở giao diện nội bộ không, nếu có thì mở một mục riêng. Thứ hai, mật khẩu và thư mời vẫn nằm ngoài phạm vi đúng như BA ghi: hệ thống không gửi thư nào khi tạo tài khoản, người quản trị tự đặt mật khẩu ở phần Người dùng rồi báo cho cửa hàng. Thứ ba, việc dò trùng theo số điện thoại chỉ so tám chữ số cuối, và bản Odoo này đã bỏ hẳn ô Di động trên hồ sơ đối tác nên không dò được ô đó. Thứ tư, đợt này chưa thao tác thật trên máy chủ kiểm thử vì quy định không tạo cửa hàng hay tài khoản thật ở đó, nên nhờ BA chạy lại kịch bản trên sau khi cài đặt. Thứ năm, còn một chỗ khác cũng đang tự sinh tài khoản cổng thông tin theo cách cũ là màn phiếu giám sát cửa hàng: nó tìm người theo tên rồi tự đặt tên đăng nhập ngẫu nhiên, đúng kiểu sinh tài khoản trùng mà mục này muốn dẹp, nhưng nằm ở luồng giám sát nên đợt này không sửa, đề nghị BA mở một mục riêng. Thứ sáu, toàn bộ mười hai điểm Dev phải tự quyết vì spec không nói đã ghi thành một bản riêng để BA rà, trong đó đáng chú ý là việc cửa hàng tạo tay ngoài màn onboarding từ nay cũng sinh ra ở Nháp, và cửa hàng mã HN-02 trên máy chủ hiện thiếu chủ tiệm hiệu lực."

