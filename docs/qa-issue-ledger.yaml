  fix: "Lượt retest ngày 26 tháng 09 BA thấy hai chỗ chưa đạt ở màn Lịch sử thanh toán trên điện thoại: danh sách in đủ mọi giao dịch của kỳ mà không có nút chuyển trang, trong khi máy tính cùng dữ liệu chia 10 giao dịch một trang; và mỗi thẻ cao 124 điểm ảnh, vượt trần 120 của thẻ nhiều thông tin. Nguyên nhân: phần xử lý chỉ cắt trang cho bảng máy tính, còn danh sách điện thoại lặp trên toàn bộ kỳ; thẻ có ba hàng thông tin phụ (ngày giờ và phương thức, tham chiếu, số tiền). Nay hai kênh dùng chung một lát cắt trang duy nhất: điện thoại hiện đúng 10 giao dịch một trang như máy tính, cùng tham số trang nên mở trang 2 trên máy tính rồi thu màn hình vẫn thấy đúng trang 2, và nút chuyển trang lấy từ chính thành phần phân trang chung của cổng, tự ẩn khi chỉ có một trang. Thẻ rút còn hai dòng thông tin phụ, chỉ dùng các hàng chuẩn của thẻ chung: dòng đầu là phương thức rồi nội dung chuyển khoản, dòng hai là ngày giờ bên trái và số tiền in đậm bên phải; dòng tổng đã xác nhận vẫn là tổng cả kỳ lọc, nằm ngoài phần chia trang như máy tính. Đo trên bản sao dữ liệu với 47 giao dịch trong tháng: điện thoại khổ 390 và 360 đều từ 47 thẻ cao 124 xuống 10 thẻ cao 104, có nút Trang trước và Trang sau; máy tính khổ 1440 giữ nguyên từng byte"
  impact: "Chỉ danh sách trên điện thoại của màn Lịch sử thanh toán. Không đổi dữ liệu, quyền, luồng nghiệp vụ hay cách tính tổng; khối máy tính so từng byte trước và sau là giống hệt. Số giao dịch một trang và các bậc 10, 20, 50 dùng chung với máy tính. Hai phép thử tự động mới: một kiểm cấu trúc màn hình (danh sách điện thoại lặp trên lát cắt trang và gọi đúng thành phần phân trang chung, thẻ chỉ dùng hàng chuẩn của thẻ chung, không gắn lớp riêng của màn), một kiểm hành vi thật với 12 giao dịch (trang một 10 thẻ có nút trang ở cả hai kênh, trang hai còn 2 thẻ, chọn 50 một trang thì 12 thẻ và không còn nút trang). Toàn bộ 57 phép thử của mô đun công nợ đạt"
