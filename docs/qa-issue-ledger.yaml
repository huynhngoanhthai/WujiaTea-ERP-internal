  odoo_fit: "Custom"
  fix: "BA mở lại vì hai việc. Việc thứ nhất, nhấn Enter ở ô tìm của Giao hàng và Lịch sử thanh toán không gửi tìm kiếm. Dev thử lại bằng phím Enter thật trên máy chạy thử mới thì 15 trên 15 ô tìm đều gửi được, nên không tái hiện được đúng lỗi BA gặp; nhưng thử kỹ hơn thì tìm ra hai đường hỏng thật và đã sửa cả hai ở khuôn dùng chung chứ không vá từng màn. Một là khi lượt tìm trước chưa trả kết quả mà người dùng sửa từ khoá rồi nhấn Enter lần nữa thì lượt sau bị bỏ qua im lặng, ô tìm còn bị ghi đè về từ khoá cũ; nay lượt gõ sau cùng luôn thắng. Hai là khi phím Enter đến từ công cụ kiểm thử tự động hoặc bàn phím ảo gửi phím không kèm ký tự thì trình duyệt không tự gửi biểu mẫu; nay ô lọc tự gửi khi nhận Enter, riêng lúc đang gõ dấu tiếng Việt thì Enter vẫn là chốt chữ chứ không gửi. Việc thứ hai, gõ Từ ngày lớn hơn Đến ngày thì có dòng cảnh báo nhưng thân trang vẫn hiện 0 chuyến kèm khối Không có dữ liệu, dễ hiểu nhầm là cửa hàng không có dữ liệu. Nay cả sáu màn có ô ngày dùng chung một trạng thái riêng: dòng đỏ Từ ngày không được lớn hơn Đến ngày giữ nguyên ở thanh lọc, hai ô ngày giữ nguyên giá trị vừa gõ, còn thân trang chỉ hiện một khối nhắc trung tính Khoảng ngày chưa hợp lệ, Sửa Từ ngày hoặc Đến ngày để xem danh sách; không số đếm, không khối Không có dữ liệu, không phân trang. Màn Báo cáo khi ngày ngược không còn hiện bốn ô số 0 và biểu đồ rỗng mà hiện khối nhắc này"
  impact: "Chỉ phần tìm kiếm và lọc theo ngày của cổng cửa hàng. Không đổi dữ liệu, điều kiện lọc, tên tham số trên đường dẫn, thẻ danh sách, trường, quy trình, quyền hay phạm vi cửa hàng. Thanh lọc giữ nguyên hình dạng: đo 13 màn nhân 2 khổ, chiều cao thanh lọc trước và sau giống nhau ở 26 trên 26 ô. Điện thoại không thêm nút Xóa lọc. Khoá chống bấm gửi hai lần vẫn giữ nguyên cho các biểu mẫu tạo và sửa (gửi đơn, tạo yêu cầu); chỉ biểu mẫu tìm lọc mới được gửi lại. Chip, ô chọn trạng thái và phân trang không sửa trong lượt này. Kiểm tự động: 1.017 phép kiểm của chín mô đun bị đụng và 144 phép kiểm của bốn mô đun cổng còn lại đều xanh"
  retest: "Máy tính 1440 rồi điện thoại 390, tài khoản chủ tiệm. Một: ở Giao hàng và Lịch sử thanh toán, gõ từ khoá vào ô tìm rồi nhấn Enter, danh sách phải lọc và đường dẫn phải giống hệt khi bấm nút Tìm kiếm; thử thêm gõ từ khoá, nhấn Enter, sửa ngay từ khoá rồi nhấn Enter lần nữa, kết quả phải theo từ khoá sau và ô tìm giữ đúng chữ vừa gõ. Hai: lần lượt ở Giao hàng, Lịch sử đặt hàng, Thông báo, Đăng ký thi, Bù hàng và Báo cáo đặt hàng, chọn Từ ngày lớn hơn Đến ngày rồi tìm: thanh lọc hiện đúng một dòng đỏ, hai ô ngày còn nguyên, thân trang chỉ có khối Khoảng ngày chưa hợp lệ, không có 0 chuyến hay 0 đơn, không có khối Không có dữ liệu; sửa lại ngày cho đúng rồi tìm thì dòng đỏ và khối nhắc biến mất, danh sách trở lại. Nếu Enter vẫn không gửi, xin BA ghi giúp thiết bị, trình duyệt, cách gõ (bàn phím thật, bàn phím ảo hay công cụ tự động) và các bước ngay trước đó để Dev tái hiện đúng"
  limit: "Thứ nhất, lỗi Enter BA báo không tái hiện được bằng phím thật trên máy chạy thử mới, cả trước lẫn sau khi sửa; Dev đã sửa hai đường hỏng tìm thấy, BA kiểm lại giúp trên đúng thiết bị đã gặp lỗi. Thứ hai, chỉ đo trên trình duyệt Chromium; Safari và Firefox chưa đo. Thứ ba, câu chữ của khối nhắc do Dev đặt theo chốt của chủ dự án, xin BA duyệt hoặc cho câu khác. Thứ tư, màn Thông báo trên điện thoại vốn không có ô ngày; nếu mở bằng đường dẫn có ngày ngược thì thấy dòng đỏ và khối nhắc nhưng không có ô để sửa, thoát bằng chip Tất cả — xin BA cho biết có cần thêm ô ngày cho màn này trên điện thoại không. Thứ năm, chip, ô chọn và phân trang không đo lại riêng trong lượt này vì không sửa, chỉ dựa vào kiểm tự động"

