# Số đo: docs/a11y-batch-acceptance-matrix.md — 6/6 + 6/6 gạch acceptance, hồi quy 286/286.
WJ-PORTAL-UI-003:
  sprint: "2026-08-23-a11y"
  build_override: "Chờ deploy UAT | 23/08/2026 | Sprint 2026-08-23-a11y | commit: 36188e1 | wujia_portal_layout 19.0.32.2.0 — deploy: -u wujia_portal_layout, không cập nhật dữ liệu, không module mới | Đo trên bản dựng cô lập: đi phím Tab 40 lần ở khổ điện thoại không lần nào rơi vào thanh điều hướng đang ẩn, bản máy tính giữ nguyên thứ tự, lưới hồi quy 286/286 | URL: /portal"
  url: "/portal — mọi trang Portal ở khổ điện thoại và máy tính bảng"
  odoo_fit: "Custom"
  fix: "Ở khổ điện thoại, thanh điều hướng bên trái của bản máy tính vốn chỉ bị đẩy ra ngoài mép màn hình chứ chưa bị gỡ khỏi luồng bàn phím, nên người dùng nhấn Tab vẫn bị đưa lần lượt qua logo và các mục menu vô hình trước khi tới nội dung thật. Nay khi thanh này đang đóng thì toàn bộ phần tử bên trong được gỡ hẳn khỏi luồng Tab và khỏi cây trợ năng, nghĩa là trình đọc màn hình cũng không còn đọc nhầm các mục vô hình. Khi thanh được mở chủ động, ví dụ bằng nút ba gạch trên máy tính bảng, các mục bên trong lập tức nhận focus trở lại; đóng thanh thì chúng lại biến khỏi luồng Tab. Cách sửa chỉ dùng một luật giao diện duy nhất, không thêm mã chạy nào"
  impact: "Mọi trang Portal ở khổ dưới 1200 điểm ảnh, vì thanh điều hướng này dựng chung cho toàn bộ Portal. Bản máy tính từ 1200 điểm ảnh trở lên không đổi một điểm dừng Tab nào, đã đo đối chứng. Chuột và chạm không liên quan vì thanh vốn không bấm được khi ẩn"
  retest: "Mở Portal trên điện thoại hoặc thu trình duyệt dưới 1200 điểm ảnh, nhấn Tab liên tục từ đầu trang: focus phải đi thẳng vào các nút đang nhìn thấy, không có nhịp nào focus biến mất khỏi màn hình hay viền chỉ dấu nằm ngoài mép trái. Nhấn Shift+Tab đi ngược cũng vậy. Trên máy tính bảng ngang, bấm nút ba gạch mở thanh điều hướng rồi nhấn Tab: phải vào được các mục menu; bấm ra ngoài đóng thanh rồi Tab tiếp: không được rơi vào menu nữa. Mở bản máy tính: thứ tự Tab qua logo và menu trái phải y như trước"
  limit: "Không có"

WJ-PORTAL-UI-004:
  sprint: "2026-08-23-a11y"
  build_override: "Chờ deploy UAT | 23/08/2026 | Sprint 2026-08-23-a11y | commit: 36188e1 | wujia_portal_layout 19.0.32.2.0 — deploy: -u wujia_portal_layout, không cập nhật dữ liệu, không module mới | Đo trên bản dựng cô lập: mở bằng Enter và bằng Space đều đưa focus vào nút đóng, 15 lần Tab đều ở trong khay, Esc và chạm nền đều đóng và trả focus về nút Thêm | URL: /portal"
  url: "/portal — khay Thêm chức năng mở từ thanh điều hướng dưới cùng (điện thoại)"
  odoo_fit: "Custom"
  fix: "Nút Thêm ở thanh dưới cùng nay là nút bấm thật thay vì liên kết giả, nên nhấn phím Space cũng mở được khay chứ không chỉ Enter như trước. Khi khay mở ra, focus tự chuyển vào nút đóng bên trong khay thay vì đứng yên ở nút Thêm phía sau lớp nền mờ; từ đó nhấn Tab hay Shift+Tab chỉ quay vòng trong các mục của khay, không lọt ra nội dung nền phía sau. Đóng khay bằng bất cứ cách nào, phím Esc, nút đóng, chạm nền mờ hay bấm lại nút Thêm, focus đều trở về đúng nút Thêm để người dùng đi tiếp từ chỗ cũ. Khay cũng được đánh dấu là hộp thoại đúng chuẩn trợ năng nên trình đọc màn hình thông báo đúng ngữ cảnh. Thao tác chạm giữ nguyên như cũ"
  impact: "Chỉ khay Thêm chức năng trên bản điện thoại. Các liên kết bên trong khay, danh sách chức năng và hành vi chạm không đổi. Có một chỉnh nhỏ về hiệu ứng: lúc mở khay hiện ra tức thời thay vì mờ dần, để focus vào được ngay; hiệu ứng trượt lên vẫn giữ"
  retest: "Trên điện thoại hoặc trình duyệt thu hẹp, nhấn Tab tới nút Thêm ở thanh dưới cùng rồi nhấn Enter: khay mở và viền chỉ dấu phải nằm ở nút đóng trong khay. Nhấn Tab liên tục hơn một vòng: focus chỉ chạy quanh nút đóng và các mục trong khay, không được rơi ra nội dung phía sau. Nhấn Esc: khay đóng, focus về nút Thêm. Làm lại từ đầu nhưng mở bằng phím Space: phải mở được y hệt. Mở khay rồi chạm vào nền mờ: khay đóng, trang cuộn lại bình thường. Chạm mở khay và chạm từng mục bên trong: vẫn điều hướng đúng như trước"
  limit: "Không có"

