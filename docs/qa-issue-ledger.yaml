UI-PAGINATION-001:
  sprint: "2026-09-16-E3c"
  build_override: "ĐÃ DEPLOY UAT 16/09/2026 — sẵn sàng retest | 16/09/2026 | Sprint 2026-09-16-E3c | gộp cả ba lượt E3a, E3b và E3c vì hai lượt đầu chưa lên máy chạy thử | deploy: git pull rồi NÂNG CẤP mười ba mô đun wujia_portal_layout,wujia_portal_base,wujia_portal_purchase_history,wujia_portal_support,wujia_portal_notification,wujia_portal_delivery,wujia_portal_knowledge,wujia_portal_return,wujia_portal_info_request,wujia_portal_exam,wujia_portal_debt,wujia_portal_sale,wujia_portal_inspection — bắt buộc nâng cấp mô đun chứ không chỉ kéo mã, vì phần lớn thay đổi nằm trong tệp màn hình và tệp giao diện; sau khi lên xong xin tải lại trang bỏ qua bộ nhớ đệm một lần | Đã lên máy chạy thử ngày 16/09/2026 và đã đo lại chỉ đọc ngay trên đó, không tạo sửa xoá dữ liệu nào: mười ba mô đun đúng bản đích, mẫu hiển thị chuyển trang đã có trên máy chủ và được mười bốn màn gọi tới; đo mười màn nhân sáu khổ cho ra ba mươi sáu nút chuyển trang đều đúng kích thước 36, bo góc 10, khoảng cách 8, chữ 14 đậm 600 và mũi tên 16, vùng chạm trên điện thoại đủ 44 mà nút nhìn thấy vẫn 36; bốn mươi tám ô của tám màn chỉ có một trang đều ẩn hẳn khối chuyển trang đúng yêu cầu; thử các màn đang bật bộ lọc gồm cả lọc theo khoảng ngày thì đường dẫn sang trang giữ nguyên toàn bộ điều kiện; hồi quy mười ba màn nhân năm khổ không lỗi kịch bản, không cuộn ngang, không màn nào mất bản ghi. Bảng đo: docs/e3-uat-measure.md"
  url: "Cổng cửa hàng — toàn bộ các màn có phân trang: Lịch sử đặt hàng, Hỗ trợ, Thông báo, Giao hàng, Kiến thức, Đổi trả, Yêu cầu cập nhật, Thông tin cửa hàng, Đăng ký thi, Công nợ, Lịch sử thanh toán, Đặt hàng"
  odoo_fit: "Custom"
  fix: "BA nêu mỗi màn tự dựng một kiểu chuyển trang nên bố cục, ký hiệu, bo góc, dòng đếm và ô số dòng mỗi nơi một khác, kèm rủi ro là màn tự ghép đường dẫn thì sang trang có thể mất bộ lọc. Kiểm kê bằng máy đếm ra hai mươi mốt khối chuyển trang nằm ở mười bốn tệp, năm hình dạng khác nhau và sáu cách ghép đường dẫn khác nhau; gốc rễ là hàm phân trang dùng chung đã có sẵn trong mã nhưng KHÔNG màn nào gọi, nên bảy màn chép tay lại cùng một phép tính số trang. Nay toàn bộ về MỘT nguồn tính trang duy nhất và MỘT mẫu hiển thị duy nhất: trên máy tính có dòng đếm, ô chọn số dòng mỗi trang và dãy số trang; trên điện thoại gọn lại còn nút lùi, chữ Trang mấy trên mấy và nút tiến; chỉ một bản mã, khác nhau giữa hai loại màn hình là do quy tắc hiển thị chứ không phải hai bản riêng. Đường dẫn sang trang nay lấy nguyên các điều kiện lọc đang có trên màn nên không thể rơi bộ lọc nữa. Lượt cuối này chuyển nốt bốn màn Đăng ký thi, Công nợ, Lịch sử thanh toán và Đặt hàng, xoá mười họ kiểu cũ khỏi tám tệp giao diện, và vá ba lỗi thật: một là Lịch sử thanh toán trước đây sang trang thì mất khoảng ngày đang lọc, người dùng đang xem tháng chín mà bấm trang hai lại ra dữ liệu ngoài kỳ; hai và ba là màn Đăng ký thi và màn Đặt hàng trên điện thoại vốn đã cắt trang phía máy chủ nhưng giao diện KHÔNG có nút sang trang nào, tức người dùng điện thoại không bao giờ xem được trang hai. Ngoài ra ô mười dòng một trang ở Công nợ trước đây chỉ là chữ tĩnh bấm không được, nay là ô chọn thật mười, hai mươi hoặc năm mươi; màn Đặt hàng được thêm ô chọn hai mươi tư, bốn mươi tám hoặc chín mươi sáu, lấy bội của hai mươi tư để không vỡ hàng cuối của lưới ba cột"
  impact: "Chỉ phần hiển thị và điều hướng chuyển trang trên cổng cửa hàng. Không đổi dữ liệu, không thêm hay xoá trường nào, không đổi quyền, không đổi cách tính toán, không đụng đơn hàng, giao hàng, hoá đơn hay công nợ, không đụng nhóm màn Khảo sát. Tên tham số trên đường dẫn của từng màn được giữ y nguyên nên các đường dẫn đã lưu sẵn vẫn chạy đúng. Thay đổi người dùng nhìn thấy: dáng nút chuyển trang nay đồng nhất ở mọi màn; màn Đăng ký thi và Đặt hàng trên điện thoại có thêm khối chuyển trang nên trang dài thêm đúng chiều cao khối đó; màn Công nợ và Đặt hàng có thêm ô chọn số dòng mỗi trang. Riêng dòng Tổng thanh toán trong thời gian lọc được tách ra khỏi khối chuyển trang để vẫn hiện khi kỳ lọc chỉ có một trang, và sửa luôn lỗi cũ là chữ dính liền số tiền. Về tốc độ với một nghìn năm trăm người dùng: đường dẫn chỉ được dựng cho những số trang thực sự hiện chứ không dựng cho toàn bộ số trang, và ô chọn số dòng chỉ nhận đúng các mức có trong danh sách nên không ai gọi được một trang vài trăm dòng. Đo trên bản sao cơ sở dữ liệu có cài đủ nhóm Khảo sát giống máy chạy thử, tài khoản chủ tiệm chứ không phải quản trị, dữ liệu mẫu đủ để mọi màn có nhiều hơn năm trang: hai trăm lẻ một nút chuyển trang ở mười màn nhân sáu khổ màn đều đúng kích thước, bo góc, khoảng cách và chữ, không lỗi nào; thêm bốn mươi bốn nút đo trên các màn đang bật bộ lọc cũng không lỗi nào, tức sang trang không rơi bộ lọc. Hồi quy đo hai lượt bằng hai cây mã để đối chứng, mười ba màn nhân năm khổ: không lỗi kịch bản trình duyệt, không màn nào mất bản ghi, không màn nào cuộn ngang, chỉ mười ba ô đổi chiều cao và đều nằm đúng ba màn vừa sửa. Bốn trăm chín mươi ba phép kiểm tự động đều xanh, cây mã đối chứng là bốn trăm tám mươi tám, chênh nhau đúng năm phép kiểm mới thêm; mười phép phá hoại có chủ đích đều làm đỏ đúng phép kiểm tương ứng, sau đó chạy lại bộ kiểm sạch vẫn xanh đủ bốn trăm chín mươi ba"
  retest: "Mở cổng cửa hàng bằng tài khoản chủ tiệm, xem trên máy tính khổ 1440 và trên điện thoại khổ 390. Việc chính là ba lỗi thật: một là vào Công nợ rồi sang tab Lịch sử thanh toán, chọn một khoảng ngày rồi bấm sang trang hai, dữ liệu phải vẫn nằm trong đúng khoảng ngày đó và ô lọc ngày vẫn còn nguyên; hai là mở màn Đăng ký thi trên điện thoại, phải thấy nút lùi, chữ Trang một trên mấy và nút tiến, bấm tiến phải sang được trang hai; ba là làm y như vậy với màn Đặt hàng. Việc thứ hai là xem dáng đã đồng nhất chưa: đi hết các màn có phân trang, trên máy tính chỗ nào cũng phải có dòng đếm bên trái, ô số dòng mỗi trang và dãy số trang bên phải, cùng một dáng nút; trên điện thoại chỗ nào cũng chỉ còn ba phần lùi, Trang mấy trên mấy, tiến. Việc thứ ba là thử ô số dòng mỗi trang ở Công nợ chọn hai mươi rồi năm mươi, và ở Đặt hàng chọn bốn mươi tám rồi chín mươi sáu, số dòng phải đổi thật chứ không phải chữ trang trí. Việc thứ tư là kiểm màn nào chỉ có một trang thì KHÔNG được hiện dãy số trang và không để lại khoảng trống. Cuối cùng xin kiểm chéo nhóm màn Khảo sát phải y như trước, không đổi một nét. Nếu chưa thấy gì đổi thì tải lại trang bỏ qua bộ nhớ đệm và kiểm giúp mười ba mô đun đã được nâng cấp chứ không chỉ kéo mã nguồn"
  limit: "Thứ nhất, nhóm màn Khảo sát còn một khối chuyển trang kiểu cũ và sáu nút kiểu cũ. Đây là nhóm mô đun của anh Thái, theo luật đã chốt ngày tám tháng chín thì mọi lượt chỉnh giao diện đều bỏ qua nhóm này và ghi lại lý do thay vì sửa, nên lượt này KHÔNG đụng tới; xin BA cho biết có muốn mở phiếu riêng cho nhóm Khảo sát không. Vì hai họ kiểu cũ đó vẫn đang được nhóm Khảo sát dùng nên không xoá được, đã thu hẹp lại để chỉ còn tác dụng bên trong màn Khảo sát và đã kiểm chứng màn đó không đổi dáng; nền đã sẵn nên khi BA mở khoá thì việc còn lại chỉ là đổi một khối. Thứ hai, ô Kết quả mong muốn không nêu số dòng mỗi trang cho từng màn nên Dev tự chốt theo tính chất màn và ghi lại: mười, hai mươi, năm mươi cho các bảng thường; mười hai, hai mươi tư, bốn mươi tám cho Kiến thức vì lưới ba cột; hai mươi tư, bốn mươi tám, chín mươi sáu cho Đặt hàng cũng vì lưới ba cột; nếu BA muốn khác xin cho biết con số. Thứ ba, ba lỗi nghiệp vụ vá trong lượt này không nằm trong ô Kết quả mong muốn của phiếu mà là lỗi lộ ra khi kiểm kê, đã được chủ dự án đồng ý cho vá luôn trong lượt để tránh mở thêm phiếu; xin BA nghiệm thu kèm. Thứ tư, dòng Tổng thanh toán trong thời gian lọc trước đây bị dính liền số tiền, đã đối chứng trên cây mã cũ để xác nhận đó là lỗi có sẵn chứ không phải do lượt này gây ra, và đã sửa luôn. Thứ năm, trong nhật ký nâng cấp có mười dòng báo lỗi về một bảng dữ liệu chưa tồn tại thuộc nhóm mô đun khác; lỗi này có trước lượt này và không liên quan phân trang. Thứ sáu, số đo trong phiếu lấy trên bản sao cơ sở dữ liệu có cài đủ nhóm mô đun giống máy chạy thử chứ chưa phải trên chính máy chạy thử, vì lúc làm thì mã chưa được đưa lên đó; sau khi deploy sẽ đo lại một lượt chỉ đọc rồi mới đánh dấu đã lên máy chạy thử"

