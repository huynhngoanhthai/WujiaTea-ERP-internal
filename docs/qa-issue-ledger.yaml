  fix: "Nút 'Thêm vào giỏ' ở trang chi tiết sản phẩm nay dùng màu CTA đậm #0F7CA8 thay vì màu thương hiệu #28A9DF, đạt 4,7:1 với chữ trắng. Lần sửa trước đã viết đúng ý định nhưng bị luật màu chung của nút Bootstrap đè mất nên trên màn hình vẫn ra màu cũ — nay tách hẳn thành một lớp trang trí riêng nên không còn bị đè, và luật màu nút Bootstrap dùng chung toàn cổng thông tin KHÔNG bị đụng tới. Rà thêm thì còn 3 nút nữa cùng lỗi này mà BA chưa mở phiếu (nút xác nhận trong ô chọn cửa hàng và 2 nút 'Vào cửa hàng') — đã sửa luôn trong lần này. Trạng thái nút bị khoá trước đây bị làm mờ còn ~2,5:1, nay bỏ mờ và phân biệt bằng màu xám đậm, đạt 4,83:1"
  impact: "Chi tiết sản phẩm (nút Thêm vào giỏ) · ô chọn cửa hàng (nút Xác nhận/Đổi cửa hàng) · danh sách cửa hàng (nút Vào cửa hàng). Màu nhấn, biểu tượng, viền, huy hiệu vẫn giữ #28A9DF, nhận diện không đổi"
  retest: "Đo độ tương phản 4 nút trên ở cả máy tính lẫn điện thoại, đủ 4 trạng thái bình thường / rê chuột / đang chọn / bị khoá: tất cả phải ≥4,5:1. Kiểm chéo: các nút Bootstrap khác trong cổng thông tin vẫn giữ nguyên màu #28A9DF như trước"
  limit: "Bản thiết kế Figma của BA vẽ nút CTA màu #28A9DF chữ trắng — màu đó chỉ đạt 2,68:1, tức chính là lỗi tương phản BA mở ở Sprint 38: không thể vừa giữ đúng màu Figma vừa hết lỗi. Dev dùng #0F7CA8 theo quyết định của chủ dự án ngày 03/08. Nếu BA muốn giữ đúng màu Figma thì phải đổi màu CHỮ trên nút, và đó là quyết định của BA — không chặn phần còn lại"
