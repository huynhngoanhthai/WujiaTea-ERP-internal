  impact: "Chỉ trang chi tiết đơn của Lịch sử đặt hàng. Không đổi danh sách, giỏ hàng, nơi nhập ghi chú. Đo bản sao dữ liệu, 5 khổ 1920 / 1440 / 430 / 390 / 360: đơn có ghi chú 2 dòng + một chuỗi liền 200 ký tự ⇒ máy tính và điện thoại cùng nội dung, xuống dòng giữ nguyên, chữ nằm gọn trong thẻ, trang không cuộn ngang; đơn không ghi chú ⇒ Không có ghi chú ở cả hai kênh, không lấy nhầm ghi chú giao hàng. Mốc UAT trước khi cập nhật: S00077 trên máy tính không có chữ QA-RETEST-ISSUE-148 nào"
