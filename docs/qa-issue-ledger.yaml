# UI-SECTIONHEADER-001 (STT 83) — C8a 22/08 (13/18 call site, giữ Ready for Dev)
# + C8b 23/08 (6 chỗ còn lại ⇒ 19/19) ⇒ NAY MỚI đẩy sang Ready for Retest.
# Số đo đầy đủ: docs/c8-acceptance-matrix.md (§1–§5 C8a, §6 C8b) — 17/17 gạch đầu dòng đạt.
UI-SECTIONHEADER-001:
  sprint: "2026-08-23-C8b"
  build_override: "Đã lên UAT 23/08/2026 (merge aa26e0e) | 23/08/2026 | Sprint 2026-08-23-C8b | commit: 02f77ca (C8b) nối tiếp 59299f1 (C8a) | wujia_portal_layout 19.0.32.1.0 + wujia_portal_debt 19.0.4.2.0 + wujia_portal_exam 19.0.5.7.0 + wujia_portal_return 19.0.2.5.0 + wujia_portal_base + wujia_portal_sale + wujia_portal_purchase_history + wujia_portal_delivery | Đo lại trên UAT sau deploy: acceptance C8b 58/60 (2 ô không đo được vì UAT không có hoá đơn đến hạn), acceptance C8a 46/46, lưới hồi quy 286/286, đi phím Tab 448/448 | Lưu ý cho tester: trong 14 cửa hàng chỉ cửa hàng thứ 3 có hoá đơn và có đăng ký thi | URL: /portal, /portal/order, /portal/order/cart, /portal/purchase-history, /portal/delivery, /portal/debt, /portal/debt/payment-history, /portal/debt/pay, /portal/exam, /portal/return"
  url: "Portal toàn hệ thống — tiêu đề khối danh sách trên máy tính và điện thoại"
  odoo_fit: "Custom"
  fix: "Tiêu đề của các khối danh sách trong Portal nay dùng chung một khuôn duy nhất thay vì mỗi màn tự viết một kiểu. Trước đây cùng một khối Danh sách sản phẩm mà bản máy tính là tiêu đề cỡ 18 còn bản điện thoại chỉ là chữ thường cỡ 15, các màn khác thì rải rác 17, 18, 22 và cấp tiêu đề lộn xộn. Nay bản máy tính thống nhất cỡ 22 dòng cao 30, bản điện thoại cỡ 20 dòng cao 28, khoảng cách phía trên và phía dưới cũng cố định 20 và 12 trên máy tính, 16 và 8 trên điện thoại. Chữ tiêu đề là tiêu đề thật chứ không còn là chữ thường giả dạng, và mỗi màn tự chọn cấp tiêu đề cho đúng thứ bậc nội dung. Bên phải tiêu đề chỉ được có đúng một thứ: hoặc con số đếm, hoặc liên kết Xem tất cả, hoặc ô chọn nhanh, không bao giờ hai thứ cùng lúc. Con số đếm nay ghi bằng từ đầy đủ 5 sản phẩm thay vì 5 SP, và vẫn hiện khi bằng 0 chứ không biến mất như trước. Liên kết Xem tất cả có vùng chạm đủ 44 điểm ảnh mà không làm cao thêm hàng tiêu đề. Khi màn hình hẹp tới 360 điểm ảnh, tiêu đề xuống dòng chứ không bị cắt bằng ba chấm, và phần bên phải không tự ẩn đi. Các kiểu tiêu đề rời cũ đã được dọn hẳn khỏi mã nguồn, kèm một phép thử tự động quét toàn bộ giao diện để sau này không màn nào dựng lại kiểu riêng."
  impact: "Đã áp cho toàn bộ 19 chỗ trên 10 màn: trang chủ, đặt hàng, giỏ hàng, lịch sử đặt hàng, danh sách chuyến giao (13 chỗ, đợt trước) và công nợ, lịch sử thanh toán, trang chuyển khoản, đăng ký thi, đổi trả (6 chỗ, đợt này). Không đụng dữ liệu, quyền xem hay luồng nghiệp vụ. Hai điểm BA cần biết. Thứ nhất, ở trang lịch sử thanh toán, khoảng cách quanh tiêu đề trước đây được chỉnh riêng cho màn đó là 24 phía trên và 12 phía dưới; nay bỏ luật riêng để dùng đúng khoảng cách chung của bảng thành phần, nên nhìn thành 28 phía trên và 20 phía dưới. Đây là chủ ý để mọi màn cùng một cách tính, xin BA ghi nhận khi nghiệm thu. Thứ hai, phần Thông tin chuyển khoản ở trang thanh toán nay cũng đi qua khuôn chung nhưng vẫn giữ dáng nhãn nhỏ như cũ, vì khối đó là thẻ có chiều cao cố định. Đã đo 17 màn ở hai khổ màn hình: không màn nào lỗi tải, không màn nào trượt ngang, không lỗi trình duyệt. Đi phím Tab qua 9 màn thì 447 trên 447 điểm dừng vẫn thấy viền chỉ dấu bàn phím. Bộ kiểm tra tự động 64 phép thử chạy lại đúng hết, trong đó phần đo của đợt trước vẫn nguyên 46 trên 46 dù đã xoá phần giao diện cũ."
  retest: "Mở lần lượt trang chủ, đặt hàng, giỏ hàng, lịch sử đặt hàng, danh sách chuyến giao, công nợ, lịch sử thanh toán, đăng ký thi và đổi trả, trên máy tính rồi trên điện thoại. Mọi tiêu đề khối danh sách phải cùng một cỡ chữ trong cùng một khổ màn hình, không còn chỗ nào chữ thường giả làm tiêu đề. Ở trang đặt hàng, so bản máy tính với bản điện thoại: hai bên phải cùng một kiểu tiêu đề, không còn lệch 18 với 15 như trước. Ở trang đăng ký thi, so dòng Danh sách nhân sự ở bước 3 của phần tạo đăng ký với dòng cùng tên ở màn chi tiết đăng ký: trước đây hai chỗ lệch cỡ chữ, nay phải bằng nhau. Ở trang công nợ, khi còn hoá đơn bị ẩn bớt thì bên phải tiêu đề là liên kết Xem thêm, còn khi hiện đủ thì là dòng đếm số hoá đơn, không bao giờ có cả hai. Ở trang đổi trả, dòng Lịch sử yêu cầu phải là tiêu đề thật kèm dòng đếm số yêu cầu. Lọc cho ra không có sản phẩm nào ở trang đặt hàng: dòng đếm phải hiện 0 sản phẩm chứ không được biến mất. Ở màn danh sách chuyến giao trên máy tính, bên phải tiêu đề phải là dòng đếm số chuyến, còn các thẻ lọc vẫn nằm nguyên chỗ cũ. Thu màn hình còn 360 điểm ảnh: tiêu đề dài phải xuống dòng, tối đa hai dòng, không chỗ nào có ba chấm, và phần bên phải vẫn phải nhìn thấy. Nhấn Tab tới liên kết Xem tất cả: phải thấy viền chỉ dấu và vùng chạm rộng rãi."
  limit: "Thứ nhất, bảng thành phần ghi độ đậm tiêu đề là 800 nhưng một yêu cầu trước đó của BA ở đợt Sprint 35 lại chốt tiêu đề đậm tối đa 700 và đang được ép cứng cho toàn bộ Portal, nên hai yêu cầu mâu thuẫn nhau. Dev giữ 700 cho khớp với yêu cầu đang chạy và với thành phần tiêu đề trang đã duyệt trước đó, nhờ BA chốt lại chọn con số nào. Thứ hai, bảng thành phần nói tiêu đề nằm trong khung thì không tính là tiêu đề khối, nhưng chính BA lại chỉ đích danh Danh sách chuyến giao và Danh sách sản phẩm là tiêu đề khối trong khi cả hai đều nằm trong khung; Dev hiểu là khung đóng vai hộp chứa danh sách thì vẫn tính. Câu này vẫn chờ BA, và nó đang chặn đúng một chỗ: dòng Danh sách phiếu khảo sát ở màn Khảo sát và Đánh giá có cấu trúc giống hệt Danh sách chuyến giao, nên Dev cố ý chưa đổi, chờ BA trả lời rồi mới áp. Thứ ba, ở trang đặt hàng còn một dòng đếm nữa nằm trên tiêu đề trang, dòng này thuộc thành phần tiêu đề trang chứ không phải tiêu đề khối nên vẫn ghi tắt 5 SP và vẫn ẩn khi bằng 0; nhờ BA cho biết có áp cùng quy tắc đếm không. Thứ tư, phần Thông tin chuyển khoản ở trang thanh toán nằm trong một thẻ có chiều cao cố định và bản thân nó là nhãn chữ nhỏ viết hoa, nên Dev cho nó đi qua khuôn chung nhưng giữ nguyên dáng nhãn để không vỡ thẻ; nhờ BA xác nhận đây là tiêu đề của thẻ hay tiêu đề khối. Thứ năm, màn Phản hồi khắc phục của phần giám sát đã bị gỡ khỏi hệ thống nên không nằm trong đợt này."
