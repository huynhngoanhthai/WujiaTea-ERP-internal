# E7a/E7b (24/09/2026) — cụm E7 PageContainer CMP-PC-001 (STT 129, dòng sheet 122).
# Bảng đo: docs/e7a-acceptance-matrix.md · docs/e7b-acceptance-matrix.md (mục UAT cuối file).
UI-PAGECONTAINER-001:
  sprint: "2026-09-24-E7b"
  commit: "419f9c9"
  build_override: "ĐÃ DEPLOY UAT đêm 24/09/2026 — sẵn sàng retest | 25/09/2026 | Sprint 2026-09-24-E7b | bản mã 419f9c9, gộp cả hai lượt E7a (8ef3081) và E7b; 14 mô đun cổng cửa hàng trên máy chạy thử đã khớp phiên bản mã (wujia_portal_layout 19.0.56.5.0, wujia_portal_base 19.0.7.22.0, tệp giao diện số hiệu 1319) | Đo lại CHỈ ĐỌC trên máy chạy thử bằng trình duyệt thật, mọi lệnh gửi dữ liệu bị chặn và không có lệnh nào phải chặn: 31 màn nhân 7 khổ màn hình 360, 390, 991, 992, 1024, 1440 và 1920 là 217 ô đo, không ô nào vi phạm lề, bề rộng, trục thẳng hàng, cuộn ngang hay che đáy, không lỗi kịch bản; thu gọn menu trái ở 4 khổ máy tính 128 ô đạt hết; phóng to 200 phần trăm 29 màn đạt hết; Khảo sát chi tiết và Khắc phục (phiếu KS/D3REVIEW/001 cửa hàng HCM-01, trước đây máy local không có phiếu nên chưa đo được) nay đo được 14 ô, 0 vi phạm, bề rộng đúng loại chuẩn 1440 ở khổ 1920; bốn màn loại hẹp (Giỏ hàng, Tạo bù hàng, Tạo yêu cầu hỗ trợ, Tạo yêu cầu cập nhật thông tin) đúng 960 căn giữa ở khổ 1440 và 1920; đáy điện thoại khổ 390 của Đặt hàng và Giỏ hàng: dòng cuối nằm trọn trên thanh cố định, không bị che."
  url: "Cổng cửa hàng toàn hệ thống — khung trang của mọi màn (31 màn), máy tính khổ 992 đến 1920 và điện thoại khổ 360, 390; trọng tâm: Giỏ hàng, Tạo bù hàng, Tạo yêu cầu hỗ trợ, Tạo yêu cầu cập nhật thông tin, Bù hàng, Tài khoản, các màn chi tiết, Khảo sát chi tiết"
  odoo_fit: "Custom"
  fix: "Trước đây mỗi màn tự đặt lề trang của mình: có màn lề 30,8 điểm ảnh ở máy tính bảng, có màn 14 hay 16 trên điện thoại, tiêu đề lệch với nội dung 16 điểm ảnh vì một quy tắc giao diện của màn Khảo sát rò ra đè tiêu đề của mọi màn; bề rộng trang thì màn nào cũng trải hết hoặc tự đặt số riêng (giỏ hàng 760, Khảo sát 900 hoặc 1100); hai màn có thanh cố định ở đáy điện thoại (Đặt hàng, Giỏ hàng) tự chừa khoảng trống cộng chồng lên khoảng trống chung. Nay toàn cổng cửa hàng có MỘT khung trang duy nhất giữ lề: 24 điểm ảnh ở máy tính và máy tính bảng, 16 ở điện thoại, riêng màn danh sách trên điện thoại 12 theo quyết định BA trước đó; đáy điện thoại 96 cộng vùng an toàn của máy. Khung có ba bề rộng đúng đặc tả: trải hết (mặc định cho màn dữ liệu dày như Trang chủ, Đặt hàng, Lịch sử, Giao hàng, Công nợ, Thông báo, Kiến thức, Hỗ trợ, Đăng ký thi, Khảo sát, Báo cáo), chuẩn tối đa 1440 (Bù hàng, Tài khoản, Đổi mật khẩu, Thông tin cửa hàng, mọi màn chi tiết, Thanh toán công nợ, kết quả gửi đơn), hẹp tối đa 960 (Giỏ hàng, Tạo bù hàng, Tạo yêu cầu hỗ trợ, Tạo yêu cầu cập nhật thông tin). Tiêu đề trang nằm trong khung nên luôn cùng bề rộng và cùng mép với nội dung. Màn có thanh hành động cố định ở đáy điện thoại bật chế độ chừa đáy của khung, không tự cộng nữa."
  impact: "Khung trang của toàn bộ cổng cửa hàng, máy tính và điện thoại. Không đổi dữ liệu, quyền, luồng nghiệp vụ hay xử lý phía máy chủ; chỉ đổi giao diện. Đo trước và sau trên cùng dữ liệu 31 màn nhân 7 khổ 360, 390, 991, 992, 1024, 1440, 1920: không màn nào mất bản ghi hay giảm số cột, không màn nào trượt ngang, không lỗi kịch bản. Những chỗ người dùng sẽ thấy khác: một, Giỏ hàng trên máy tính rộng ra từ 760 lên 960 và nằm giữa vùng nội dung thay vì dính trái; hai, Tạo bù hàng, Tạo yêu cầu hỗ trợ và Tạo yêu cầu cập nhật thông tin ở máy tính khổ từ 1024 trở lên thu về 960 căn giữa, trước trải hết bề ngang; ba, trên màn rất rộng từ 1788 trở lên (ví dụ 1920) các màn loại chuẩn thu về 1440 căn giữa, còn ở khổ 1440 thông thường không đổi gì; bốn, máy tính bảng 992 đến 1199 lề từ 30,8 về 24, rộng thêm mỗi bên 13,6; năm, điện thoại các màn không phải danh sách lề từ 12 lên 16 đúng đặc tả; sáu, Đặt hàng trên điện thoại bớt 79 điểm ảnh khoảng trắng cuối trang; bảy, tiêu đề mọi màn không còn thụt vào 16 điểm ảnh so với nội dung."
  retest: "Mở Portal bằng tài khoản chủ tiệm. Trên máy tính khổ 1440: mở Trang chủ, Lịch sử đặt hàng, Bù hàng, Tài khoản; tiêu đề trang phải thẳng mép trái với thẻ đầu tiên ngay dưới, lề trái và phải 24 điểm ảnh, không cuộn ngang. Mở Giỏ hàng, Tạo bù hàng, Tạo yêu cầu hỗ trợ, Tạo yêu cầu cập nhật thông tin: vùng nội dung rộng 960 và nằm giữa, hai bên để trống bằng nhau, tiêu đề và nút quay lại nằm cùng khối với form. Nếu có màn hình 1920: Bù hàng, Tài khoản và Khảo sát chi tiết thu về 1440 nằm giữa; Trang chủ, Lịch sử, Giao hàng vẫn trải hết. Thu gọn thanh menu trái: các khung trên vẫn đúng. Trên điện thoại khổ 390: màn danh sách lề 12, màn chi tiết và form lề 16; kéo hết đáy màn Đặt hàng và Giỏ hàng, sản phẩm cuối và ô ghi chú phải nằm trọn phía trên thanh giỏ hàng hoặc thanh tổng tiền, không bị che; các màn còn lại dòng cuối nằm trên thanh menu đáy. Mở Khảo sát, vào chi tiết phiếu và màn khắc phục: lề đúng như trên."
  limit: "Thứ nhất, đệm đỉnh trên điện thoại giữ 10 điểm ảnh theo nhịp dọc chủ dự án đã duyệt ngày 18/09, không phải 16 như đặc tả; nếu BA muốn 16 chỉ cần đổi một con số chung. Thứ hai, chiều cao thanh cố định ở đáy điện thoại là số khai báo (68 cho thanh giỏ ở màn Đặt hàng, 200 cho thanh tổng tiền ở Giỏ hàng) chứ không tự đo; nếu sau này thêm dòng vào thanh tổng tiền phải chỉnh số này; trình duyệt rất cũ (trước Chrome 105, Safari 15.4) dòng cuối Giỏ hàng có thể nằm dưới thanh. Thứ ba, nút tròn nổi Đăng ký thi ở màn Lịch thi nằm góc phải, không phải thanh ngang, nên giữ đáy mặc định. Thứ tư, màn Khảo sát chi tiết đang hiện HAI tiêu đề Chi tiết giám sát và hai nút Quay lại ở máy tính: có từ bản giao diện ngày 08/08 của module Khảo sát, không do lượt này, thuộc thành phần Tiêu đề trang chứ không thuộc khung trang; đã báo anh Thái. Thứ năm, thanh menu trái ở khổ 992 đến 1199 phủ lên nội dung là cách Vuexy hoạt động từ trước, thuộc issue thanh menu UI-SIDEBAR-001 (cụm E8)."
UI-SIDEBAR-001:
  sprint: "2026-09-25-E8c"
  commit: "078dfeb"
  build_override: "ĐÃ DEPLOY UAT 25/09/2026 — sẵn sàng retest | 25/09/2026 | Sprint 2026-09-25-E8 | bản mã 078dfeb, gộp ba lượt E8a (6bf64f7, đo hiện trạng), E8b (d354e2a, thanh menu trái máy tính) và E8c (menu avatar, menu Thêm trên điện thoại, chuông); 13 mô đun cổng cửa hàng trên máy chạy thử đã khớp phiên bản mã (wujia_portal_layout 19.0.58.0.0, wujia_portal_base 19.0.7.24.0, tệp giao diện số hiệu 1323) | Đo lại CHỈ ĐỌC trên máy chạy thử bằng trình duyệt thật với tài khoản chủ tiệm em.hcm, mọi lệnh gửi dữ liệu bị chặn và không có lệnh nào phải chặn, không lỗi kịch bản: thanh menu trái rộng 264 ở khổ 1200 trở lên (trước 300), vùng logo cao 88, ba nhóm Chức năng chính, Tài chính và xử lý, Hỗ trợ vận hành đúng thứ tự; ở khổ 992 đến 1199 menu đóng sẵn khi mở trang, mở bằng nút ba gạch, đóng được bằng nút Đóng, phím Escape hoặc bấm ra ngoài; dưới 992 không hiện menu máy tính; 28 màn thử đều sáng đúng một mục cha, kể cả Bù hàng và màn con; menu avatar máy tính và điện thoại cùng thứ tự Thông tin tài khoản, Đổi mật khẩu, Ngôn ngữ, Cửa hàng hiện tại HCM-01 kèm vai trò Owner, Hồ sơ cửa hàng, Đăng xuất; menu Thêm trên điện thoại còn Công nợ và thanh toán, Đổi trả Bù hàng, Đăng ký thi, Kiến thức, Hỗ trợ, Báo cáo, Khảo sát, không còn Hồ sơ cửa hàng và Tài khoản Cài đặt; chuông mở và đóng đúng, phím Escape đóng và trả con trỏ về chuông; avatar mở bằng Enter, đóng bằng Escape ở cả hai khổ; không cuộn ngang ở 9 khổ. Hồi quy khung trang 28 màn nhân 3 khổ và nút bấm 29 màn nhân 5 khổ không phát sinh vi phạm mới. Ba vai trò còn lại (nhân viên, quản lý, người nhiều cửa hàng) đã đo đủ trên máy local cùng mã: 0 vi phạm. Bảng đo: docs/e8c-acceptance-matrix.md"
  url: "Cổng cửa hàng toàn hệ thống — thanh menu trái máy tính (khổ 992 đến 1920), menu avatar góc trên phải (máy tính và điện thoại), chuông thông báo máy tính, menu Thêm ở thanh đáy điện thoại, màn Hồ sơ cửa hàng"
  odoo_fit: "Custom"
  fix: "Thanh menu trái máy tính: rộng 300 xuống 264 (nội dung rộng thêm 36), vùng logo gọn 88, xếp lại thành ba nhóm theo BA là Chức năng chính (Trang chủ, Đặt hàng, Giao hàng, Lịch sử đặt hàng), Tài chính và xử lý (Công nợ và thanh toán, Đổi trả Bù hàng mới thêm), Hỗ trợ vận hành (Đăng ký thi, Kiến thức, Hỗ trợ, Báo cáo mới thêm, Khảo sát); bỏ Thông báo (đã có chuông), Tài khoản và Hồ sơ cửa hàng (đã có avatar) khỏi menu trái; mục có dáng thống nhất cao 44, bo góc 10 ở mọi trạng thái, mục đang mở đậm, nền xanh nhạt, vạch trái 3; trình đọc màn hình biết mục đang mở. Khổ 992 đến 1199 menu thành ngăn kéo đóng sẵn, có nút Đóng, nền mờ, phím Escape, trả con trỏ về nút ba gạch. Menu avatar máy tính và điện thoại dùng chung một bộ mục theo đúng thứ tự BA: Thông tin tài khoản, Đổi mật khẩu, Ngôn ngữ, cửa hàng và vai trò hiện tại, Đổi cửa hàng (chỉ khi có từ hai cửa hàng), Hồ sơ cửa hàng, Đăng xuất. Nút cờ ngôn ngữ trên đầu trang vẫn giữ theo thành phần đầu trang chung. Menu Thêm trên điện thoại bỏ Hồ sơ cửa hàng và Tài khoản Cài đặt để không trùng avatar; Công nợ và Báo cáo hiện theo đúng quyền như menu máy tính. Đổi tên Thông tin cửa hàng thành Hồ sơ cửa hàng ở menu và tiêu đề trang. Chuông báo cho trình đọc màn hình biết đang mở hay đóng."
  impact: "Chỉ giao diện điều hướng của cổng cửa hàng: menu trái, menu avatar, menu Thêm, chuông, tiêu đề màn Hồ sơ cửa hàng. Không đổi dữ liệu, quyền truy cập màn, luồng nghiệp vụ hay xử lý phía máy chủ. Người dùng sẽ thấy khác: một, nội dung máy tính rộng thêm 36 điểm ảnh; hai, thứ tự menu trái đổi (Giao hàng lên trước Lịch sử, Khảo sát xuống cuối) và có thêm Đổi trả Bù hàng, Báo cáo; ba, Thông báo, Tài khoản, Hồ sơ cửa hàng không còn ở menu trái mà ở chuông và avatar; bốn, máy tính bảng ngang 992 đến 1199 menu không còn che nội dung khi mở trang; năm, nhân viên không còn thấy Công nợ và Báo cáo (trước bấm vào bị chặn), người vừa là nhân viên cửa hàng này vừa quản lý cửa hàng khác thấy Báo cáo nhưng không thấy Công nợ khi đang chọn cửa hàng mình là nhân viên; sáu, menu Thêm trên điện thoại ít đi hai dòng; bảy, tên Thông tin cửa hàng đổi thành Hồ sơ cửa hàng."
  retest: "Mở Portal bằng tài khoản chủ tiệm trên máy tính khổ 1440: menu trái rộng khoảng 264, ba nhóm đúng thứ tự BA, mở Bù hàng và một phiếu bù hàng thì mục Đổi trả Bù hàng sáng. Bấm avatar góc trên phải: thấy lần lượt Thông tin tài khoản, Đổi mật khẩu, nhóm Ngôn ngữ, Cửa hàng hiện tại kèm vai trò, Hồ sơ cửa hàng, Đăng xuất; vào Hồ sơ cửa hàng thì tiêu đề trang là Hồ sơ cửa hàng và mục này sáng trong avatar. Bấm chuông: danh sách nhanh mở, có nút Xem tất cả thông báo, bấm Escape thì đóng. Thu cửa sổ về khoảng 1024: menu trái đóng sẵn, bấm nút ba gạch để mở, đóng bằng nút Đóng, Escape hoặc bấm ra ngoài. Trên điện thoại khổ 390: bấm avatar thấy cùng các mục như máy tính; bấm Thêm ở thanh đáy không còn Hồ sơ cửa hàng và Tài khoản Cài đặt. Nếu có tài khoản nhân viên: menu trái và menu Thêm không có Công nợ và Báo cáo. Nếu có tài khoản nhiều cửa hàng: avatar có thêm Đổi cửa hàng, bấm vào mở hộp chọn cửa hàng."
  limit: "Thứ nhất, ngôn ngữ có ở hai chỗ (cờ trên đầu trang và nhóm trong avatar) theo chốt của chủ dự án: đầu trang theo thành phần đầu trang chung, avatar đủ bảy mục theo issue. Thứ hai, thẻ Thông tin cửa hàng trên Trang chủ và đường dẫn phía trên màn hồ sơ chi tiết cửa hàng giữ tên cũ, ngoài phạm vi menu và tiêu đề trang đã chốt. Thứ ba, màn Yêu cầu cập nhật thông tin chưa có lối vào trong giao diện (chỉ vào bằng đường dẫn; khi vào thì Hồ sơ cửa hàng sáng) — cần BA quyết định đặt lối vào ở đâu. Thứ tư, ẩn tiêu đề nhóm menu khi nhóm không còn mục cần trình duyệt Safari từ 15.4; trình duyệt cũ hơn tiêu đề nhóm rỗng vẫn hiện nhưng không vỡ giao diện. Thứ năm, trên máy chạy thử chỉ đo được tài khoản chủ tiệm vì các tài khoản nhân viên và nhiều cửa hàng không dùng mật khẩu mẫu; ba vai trò này đã đo trên máy local cùng mã."

