  fix: "Nguyên nhân: cổng chọn đơn theo ngày đặt (10 ngày gần nhất) và mặc định tạo phiếu ở trạng thái Nháp khi không gửi kèm lệnh Gửi. Nay mỗi đơn có Ngày giao hoàn tất = ngày xác nhận phiếu xuất cuối cùng, chỉ có khi mọi phiếu xuất của đơn đã xong hoặc đã huỷ (giao nhiều lần hoặc còn phần giao sau thì chờ phần cuối; phần giao sau bị huỷ thì tính theo lần giao đã xong; huỷ toàn bộ thì không có mốc; phiếu trả hàng không tính). Ô Đơn hàng gốc chỉ liệt kê đơn giao hoàn tất trong 10 ngày, hiện kèm ngày giao xong. Khi gửi, hệ thống kiểm lại và báo đúng lý do: Đơn hàng chưa giao hoàn tất, chưa thể tạo yêu cầu / Đã quá 10 ngày kể từ khi đơn hàng giao hoàn tất (ngày). Bỏ nút Lưu nháp trên máy tính (điện thoại vốn không có); mọi yêu cầu tạo từ cổng, kể cả gọi thẳng đường gửi với lệnh Nháp, đều thành đúng một phiếu Đã gửi, thiếu ảnh hoặc lỗi lưu minh chứng thì không tạo gì. Giữ nguyên: một sản phẩm một yêu cầu, sản phẩm phải thuộc đơn gốc của cửa hàng đang chọn, sản phẩm chưa cấu hình chính sách bù bị chặn"
  impact: "Phân hệ Đổi trả / Bù hàng trên cổng và đơn bán ở backend (thêm một trường ngày được lưu và đánh chỉ mục, tự tính khi lên bản). Phiếu Nháp cũ không bị xoá, vẫn xem được ở danh sách. Danh sách, chi tiết, bộ lọc phiếu không đổi. Đo bản sao dữ liệu máy tính 1920 và điện thoại 391: form chỉ còn Hủy và Gửi yêu cầu; đơn đặt 05/09 giao xong 06/10 có trong danh sách, đơn chưa giao và đơn giao xong 26/09 không có; gửi thật ra phiếu Đã gửi; gọi thẳng đường gửi với đơn chưa giao / quá hạn bị chặn đúng câu báo, với lệnh Nháp vẫn ra Đã gửi; 2 phiếu Nháp cũ còn nguyên. Trang chủ, Đổi trả, Lịch sử đặt hàng mở bình thường, không cuộn ngang, không lỗi trang"
  retest: "Cần một đơn đã giao xong: ở backend xác nhận phiếu xuất (Validate) của một đơn của cửa hàng đang chọn. Cổng, máy tính khổ 1440, Đổi trả → Tạo yêu cầu: không còn nút Lưu nháp; ô Đơn hàng gốc có đơn vừa giao, hiện ngày giao xong, kể cả khi ngày đặt đã quá 10 ngày; đơn chưa xác nhận phiếu xuất không có. Gửi đủ 3 ảnh: chuyển sang chi tiết, trạng thái Đã gửi, danh sách thêm đúng một phiếu. Đơn giao một phần (xác nhận phiếu xuất một phần, giữ phần giao sau): chưa có trong danh sách cho tới khi phần giao sau được xác nhận. Lặp lại trên điện thoại khổ 390"
  limit: "Thứ nhất, dữ liệu máy chạy thử: 15 đơn đã xác nhận nhưng chưa đơn nào được xác nhận phiếu xuất, nên sau khi lên bản ô Đơn hàng gốc sẽ trống cho tới khi kho xác nhận phiếu xuất; đơn S00035 (HCM-01) có chuyến BATCH/OUT/00002 ở trạng thái Hoàn tất nhưng phiếu xuất chưa xác nhận, theo luật đã chốt vẫn chưa tạo yêu cầu được. Thứ hai, máy chạy thử đang có 3 phiếu Nháp cũ, giữ nguyên để vận hành xử lý riêng (backend vẫn gửi hoặc huỷ được). Thứ ba, hạn 10 ngày tính đến từng giờ kể từ lúc xác nhận phiếu xuất cuối cùng"

