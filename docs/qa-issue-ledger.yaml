  build_override: "ĐÃ DEPLOY UAT 16/09/2026 — sẵn sàng retest | 13/09/2026 | Sprint 2026-09-12-E9a | wujia_sale 19.0.4.5.0 đã chạy trên máy chạy thử, đã đo lại chỉ-đọc ngày 13/09: màn Đơn hàng Ngô Gia hiện đúng 13 cột theo thứ tự BA, màn Đơn bán hàng chuẩn của Odoo đã về đúng 7 cột và không còn lẫn cột hay bộ lọc của Ngô Gia, tên menu và toàn bộ bộ lọc đã ra tiếng Việt. Còn MỘT nhãn sót: tiêu đề cột Ngày đặt hàng vẫn hiện chữ Anh, đã vá trong bản 19.0.4.6.0 — xin nâng cấp lại mô đun bán hàng một lần nữa để nhãn này ra tiếng Việt. Bản cũ 19.0.4.5.0 — deploy: git pull rồi -u wujia_sale. Không có tệp giao diện nào đổi nên không cần xoá bộ nhớ đệm trình duyệt, nhưng BẮT BUỘC nâng cấp mô đun vì toàn bộ thay đổi nằm trong tệp màn hình và tệp dịch | Đã xác nhận trên chính máy chạy thử ngày 16/09/2026 bằng cách đọc số phiên bản trực tiếp từ hệ thống: mô đun bán hàng đang ở bản 19.0.4.6.0, đúng bản đã vá nhãn tiêu đề cột Ngày đặt hàng"
  url: "Odoo Backend — Bán hàng, menu Đơn hàng Ngô Gia (nằm cùng nhóm với Đơn bán hàng chuẩn)"
  odoo_fit: "Custom"
  fix: "Danh sách Đơn hàng Ngô Gia trước đây không phải một màn riêng. Mã hiện có sửa thẳng vào bản danh sách gốc của Odoo, nên sáu cột riêng của Ngô Gia là Cửa hàng, Khu vực, Đơn Portal, Đơn bù, Khối lượng dự kiến và Batch giao hàng cùng toàn bộ bộ lọc riêng đã tràn sang mọi màn Đơn bán hàng chuẩn của hệ thống, đúng điều ô Đề xuất điều chỉnh dặn không được làm. Nay màn Ngô Gia là một bản riêng: vẫn thừa hưởng bản gốc của Odoo để khỏi chép tay những thứ vô hình mà cần thiết như đơn vị tiền của cột Tổng tiền hay kiểu chữ mờ của đơn đã huỷ, nhưng khai ở chế độ bản riêng nên bản gốc không bị đụng tới một dòng. Đo lại sau khi sửa, màn Đơn bán hàng chuẩn trở về đúng bảy cột nguyên bản của Odoo và bộ lọc chuẩn không còn mục nào của Ngô Gia. Trên màn Ngô Gia, mười ba cột hiện ra đúng thứ tự BA chốt: Mã đơn, Ngày đặt hàng, Ngày xác nhận, Cửa hàng, Khu vực, Khách hàng, Đơn Portal, Đơn bù, Kho nguồn, Khối lượng dự kiến, Batch giao hàng, Tổng tiền, Trạng thái. Thêm mới so với trước: cột Kho nguồn, hai nhãn ngày theo đúng quy ước BA là Ngày đặt hàng cho thời điểm tạo phiếu và Ngày xác nhận cho ngày đơn, cả hai hiện ngày kèm giờ theo múi giờ người dùng và cột Ngày đặt hàng không sửa được. Bốn cột của Odoo mà BA không cần là Nhân viên kinh doanh, Hoạt động, Đội ngũ bán hàng và Thẻ nay không hiện mặc định, ba cột Tình trạng hoá đơn, Ngày cam kết và Ngày dự kiến để ở dạng ẩn sẵn; không cột nào bị xoá khỏi dữ liệu, người dùng vẫn bật lại được bằng nút chọn cột ở góc phải. Bộ lọc riêng của màn này nay có đủ ba nguồn đơn là Đơn từ Portal, Đơn bù hàng và Đơn thủ công, bốn trạng thái Đơn nháp, Đơn đã gửi, Đơn đã xác nhận, Đơn đã huỷ, hai mục Chưa có batch và Đã có batch, tìm kiếm thêm theo Kho nguồn, và nhóm theo Cửa hàng, Khu vực, Trạng thái, Kho, Batch. Cuối cùng, phần dịch tiếng Việt của mô đun này trước nay chỉ ăn một nửa: tên menu Đơn hàng Ngô Gia tuy đã có dòng dịch từ lâu nhưng vẫn hiện tiếng Anh, vì tệp mẫu dịch của mô đun đã cũ từ ngày 11 tháng 8 mà bộ đọc của Odoo lại bỏ qua im lặng mọi dòng dịch không có trong tệp mẫu đó. Đã xuất lại tệp mẫu, nên từ bản này menu, tên màn, tên cột và tên bộ lọc đều ra tiếng Việt"
  impact: "Chỉ màn danh sách Đơn hàng Ngô Gia trong phần quản trị, và màn Đơn bán hàng chuẩn được trả lại nguyên trạng. Không đổi dữ liệu, không thêm hay xoá trường nào, không đổi quyền, không đổi cách tạo, xác nhận hay huỷ đơn, không đụng hoá đơn, phiếu xuất kho, batch giao hàng hay phần đặt hàng của cửa hàng trên portal. Kiểm với một tài khoản bị giới hạn công ty: tài khoản đó thấy không bản ghi nào trong tổng số hai mươi chín, tức luật phân quyền nhiều công ty của Odoo giữ nguyên. Mọi bộ lọc được bấm thật trên trang rồi đối chiếu với số đếm bằng câu lệnh dữ liệu, tám phép đều khớp từng con số: đơn nháp mười ba, đã gửi một, đã xác nhận sáu, đã huỷ chín, đơn Portal mười bốn, đơn bù một, đơn thủ công mười bốn, chưa có batch mười tám và không phiếu nào trong đó dính batch. Không lỗi kịch bản trình duyệt ở cả hai màn. Hồi quy đo hai lượt bằng hai cây mã để đối chứng, cùng một cơ sở dữ liệu gốc và cùng bộ lệnh sáu nhóm mô đun: bản cũ hai trăm ba mươi ba phép kiểm với ba mươi bảy chỗ đỏ, bản mới hai trăm ba mươi lăm phép kiểm với ba mươi sáu chỗ đỏ, so tên từng phép thì không có chỗ đỏ mới nào và đúng một chỗ đỏ cũ được vá. Riêng nhóm phép kiểm của mô đun bán hàng: mười bốn phép, không chỗ nào đỏ, trong khi trước lượt này đang có một phép đỏ sẵn. Năm phép phá hoại có chủ đích đều làm đỏ đúng phép kiểm tương ứng"
  retest: "Vào phần Bán hàng, mở menu Đơn hàng Ngô Gia. Tên menu và tiêu đề màn phải ra tiếng Việt. Đếm đủ mười ba cột đúng thứ tự Mã đơn, Ngày đặt hàng, Ngày xác nhận, Cửa hàng, Khu vực, Khách hàng, Đơn Portal, Đơn bù, Kho nguồn, Khối lượng dự kiến, Batch giao hàng, Tổng tiền, Trạng thái; không được thấy cột Nhân viên kinh doanh, Hoạt động, Đội ngũ bán hàng, Thẻ hay Tình trạng hoá đơn. Bấm nút chọn cột ở góc phải bảng, bật thử Tình trạng hoá đơn rồi tắt đi, các cột bắt buộc phải còn nguyên. Mở ô tìm kiếm, thử lần lượt Đơn từ Portal, Đơn bù hàng, Đơn thủ công, bốn mục trạng thái và mục Chưa có batch, mỗi lần xem số phiếu trả về có hợp lý không; riêng Chưa có batch thì mọi dòng phải có ô Batch giao hàng trống. Thử nhóm theo Cửa hàng, Khu vực, Trạng thái, Kho và Batch. Việc quan trọng nhất của phiếu này là kiểm chéo: mở menu Đơn bán hàng chuẩn của Odoo ở ngay bên cạnh, màn đó phải trở lại đúng bảy cột nguyên bản Mã đơn, Ngày đặt hàng, Khách hàng, Nhân viên kinh doanh, Hoạt động, Tổng tiền, Tình trạng hoá đơn, và bộ lọc của nó không được còn mục nào của Ngô Gia. Cuối cùng mở thử một đơn ra xem, tạo và huỷ một đơn nháp để chắc phần nhập liệu không đổi. Nếu chưa thấy gì thay đổi thì kiểm giúp mô đun wujia_sale đã lên 19.0.4.5.0 chứ không chỉ kéo mã nguồn về"
  limit: "Thứ nhất, ô Kết quả mong muốn ghi mười bốn cột nhưng phần liệt kê chỉ có mười ba; cột còn lại là Tuyến cung ứng. Trường này hiện KHÔNG tồn tại trong hệ thống, tìm toàn bộ mã nguồn không có một chỗ nào khai. Theo đúng chỉ dẫn của chính BA là Dev báo blocker chứ không tự tạo, lượt này bỏ cột Tuyến cung ứng và bộ lọc cùng tên; xin BA khai trường này ở tab 1. Model Field rồi mở phiếu phụ, khi đó thêm vào chỉ là một dòng. Thứ hai, hai cột Đơn Portal và Đơn bù là cột đánh dấu có hoặc không nên Odoo tự thu hẹp bề ngang, tiêu đề cột vì thế bị cắt còn một hai chữ; tên đầy đủ vẫn hiện khi rê chuột và trong bảng chọn cột. Đây là cách Odoo tự tính bề rộng cho cột đánh dấu, không phải nhãn đặt sai. Thứ ba, cột Công ty của Odoo chỉ hiện khi hệ thống bật nhiều công ty, khi đó nó nằm xen giữa nhóm cột giữa và cột Tổng tiền; cột này không nằm trong danh sách BA liệt kê nên giữ nguyên hành vi chuẩn của Odoo. Thứ tư, số đo trong phiếu này lấy trên bản sao cơ sở dữ liệu có cài đủ nhóm mô đun giống máy chạy thử chứ chưa phải trên chính máy chạy thử, vì lúc làm thì mã chưa được đưa lên đó; sau khi deploy sẽ đo lại một lượt chỉ đọc rồi mới đánh dấu đã lên máy chạy thử"


