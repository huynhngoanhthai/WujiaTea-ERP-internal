UI-MOB-HOME-004:
  sprint: "2026-09-12-E1"
  build_override: "UAT | 12/09/2026 | Sprint 2026-09-12-E1 | commit: 9354618 | wujia_portal_layout 19.0.47.1.0 · wujia_portal_debt 19.0.4.6.0 — ĐÃ DEPLOY VÀ ĐÃ NÂNG CẤP MÔ ĐUN trên máy chạy thử, xác nhận bằng phiên bản mô đun đọc trực tiếp từ hệ thống và tệp giao diện đã mang số hiệu 1282 | Đo lại chỉ đọc ngay trên máy chạy thử sau khi nâng cấp, cửa hàng [HCM-01] TP HCM Quận 1 đang âm 72.449 đúng như ảnh BA: ô CÔNG NỢ trước khi sửa hiện thành -7244 và 9 kèm ký hiệu tiền ở hai dòng, sau khi sửa hiện là -72k trên một dòng, ở cả ba khổ màn 360, 390 và 391; thẻ tổng quan thấp đi 22 đến 24 điểm ảnh; bốn chỉ số vẫn một hàng, cùng cỡ chữ; không cuộn ngang; không lỗi kịch bản trình duyệt | URL: /portal"
  url: "/portal — Trang tổng quan bản điện thoại, hàng bốn chỉ số ĐƠN HÀNG / THÔNG BÁO / ĐỔI TRẢ / CÔNG NỢ"
  odoo_fit: "Custom"
  fix: "Số tiền ở ô CÔNG NỢ trên Trang tổng quan bản điện thoại trước đây bị ngắt xuống hai đến ba dòng, ngắt ngay giữa con số, đúng như ảnh BA gửi. Soi ra hai nguyên nhân chứ không phải một. Nguyên nhân thứ nhất nằm ở phần rút gọn số tiền cho vừa ô hẹp. Phần rút gọn này đã có từ trước, mười hai triệu sáu trăm năm mươi nghìn được ghi thành 12,7tr, nhưng cách chọn bậc rút gọn lại bỏ sót toàn bộ số âm: hễ công nợ âm là in nguyên bảy chữ số kèm ký hiệu tiền, trong khi cùng độ lớn ấy mà số dương thì chỉ in ba ký tự. Nay bậc rút gọn được tính theo độ lớn của số rồi gắn dấu trừ trở lại, và thêm một bậc tỷ cho số từ một tỷ trở lên, nên âm 72.449 hiện ra là -72k còn âm 999.999.999 hiện ra là -1tỷ. Nguyên nhân thứ hai nằm ở một luật giao diện thêm từ đợt trước, cho phép ngắt chữ ở bất kỳ điểm nào kể cả giữa hai chữ số liền nhau; nay đổi thành không cho ngắt dòng, và dùng kiểu chữ số đều bề ngang cho dễ đọc. Cỡ chữ của cả bốn chỉ số giữ nguyên một giá trị dùng chung theo khổ màn, không hạ riêng ô Công nợ, vì đo thực tế thấy chuỗi dài nhất chỉ chiếm 48,6 trên 63 điểm ảnh bề ngang ô nên không cần hạ. Nhãn, thứ tự và số liệu của cả bốn chỉ số không đổi một chữ"
  impact: "Chỉ hàng bốn chỉ số trên Trang tổng quan bản điện thoại. Hàm rút gọn tiền còn được gọi ở chỗ dọn số liệu cho khay Thêm của thanh dưới, nhưng khay đó chỉ in số hoá đơn quá hạn chứ không in tiền, nên trên màn hình không có bề mặt thứ hai nào đổi; đã soi lại trên máy chạy thử để chắc điều này. Không đổi cách tính công nợ, không đổi dữ liệu, không đổi quyền, không đổi kế toán, không đổi luồng nghiệp vụ, không đổi gì trên bản máy tính. Đo trước và sau trên bản sao cơ sở dữ liệu có cài đủ nhóm Khảo sát giống máy chạy thử, ba khổ màn 360, 390 và 391 điểm ảnh nhân ba bộ số liệu là công nợ dương thường, công nợ âm đúng như ảnh BA và công nợ âm dài nhất BA yêu cầu retest. Kết quả đáng chú ý nhất là chiều cao thẻ: với công nợ âm dài, thẻ tổng quan trước đây cao thêm hai mươi hai đến bốn mươi bốn điểm ảnh so với thẻ của cửa hàng bình thường, nay trả về đúng bằng mức bình thường. Bốn chỉ số đọc ra cùng một cỡ chữ, cùng độ đậm, cùng chiều cao dòng ở cả ba khổ. Không ô nào tràn ra khỏi cột của nó, không màn nào cuộn ngang, không lỗi kịch bản trình duyệt. Hồi quy bốn màn nhân hai khổ, đo hai lượt bằng hai cây mã để đối chứng: không màn nào đổi chiều cao trang, không màn nào giảm số bản ghi nhìn thấy. Bốn phép kiểm tự động mới cho phần giao diện và bốn cho phần rút gọn tiền, đã chứng minh chúng có tác dụng bằng cách cố tình phá mười một chỗ rồi xác nhận đúng phép kiểm tương ứng đỏ lên. Toàn bộ ba trăm ba mươi chín phép kiểm của sáu nhóm mô đun đều xanh"
  retest: "Mở Trang tổng quan trên điện thoại bằng tài khoản của cửa hàng đang có công nợ, ở ba khổ màn 360, 390 và 391 điểm ảnh. Bốn chỉ số ĐƠN HÀNG, THÔNG BÁO, ĐỔI TRẢ, CÔNG NỢ phải nằm trên cùng một hàng như cũ, đúng thứ tự đó, và số của cả bốn phải trông cùng một cỡ chữ. Số tiền ở ô CÔNG NỢ phải nằm trọn trên một dòng, không được ngắt giữa con số và không được đè sang cột ĐỔI TRẢ bên cạnh. Ca BA nêu retest thẳng được trên máy chạy thử: cửa hàng [HCM-01] TP HCM Quận 1 đang có số dư âm 72.449, chính là cửa hàng trong ảnh BA gửi; sau khi lên bản mới ô này phải hiện là -72k và nằm trọn một dòng. Muốn thử thêm số dài hơn thì nhờ anh Ban kỹ thuật cho một cửa hàng âm cỡ vài trăm triệu tới một tỷ, ô phải hiện dạng như -1tỷ và vẫn trọn một dòng. So thêm chiều cao thẻ tổng quan giữa cửa hàng công nợ âm dài và cửa hàng bình thường, hai thẻ phải cao bằng nhau. Cuối cùng thu màn về 360 điểm ảnh, trang không được cuộn ngang. Nếu vẫn thấy số tiền hai dòng thì tải lại trang bỏ qua bộ nhớ đệm, và kiểm giúp là hai mô đun đã được nâng cấp lên 19.0.47.1.0 và 19.0.4.6.0 chứ không chỉ kéo mã nguồn"
  limit: "Thứ nhất, ô Đề xuất điều chỉnh có câu không cắt, không làm tròn, không đổi giá trị dữ liệu. Xin BA lưu ý ô Công nợ trên Trang tổng quan vẫn đang hiển thị dạng rút gọn từ đợt việc số mười một, ví dụ 12,7tr thay cho 12.650.000, vì ô chỉ rộng khoảng sáu mươi bốn điểm ảnh trên máy 360. Nếu in đủ số thì số tỷ cần mười bốn ký tự, không cách nào vừa một dòng ở cỡ chữ đọc được, mà hạ cỡ chữ riêng ô Công nợ thì lại trái chính ô Kết quả mong muốn vốn đòi bốn chỉ số cùng cỡ chữ. Vì vậy đợt này giữ cách rút gọn đã có, chỉ làm cho số âm được rút gọn giống số dương; số đầy đủ xem ở màn Công nợ khi bấm vào ô này. Thứ hai, ở bậc rút gọn thì ký hiệu tiền không hiện cạnh số, đây là quy ước có sẵn từ đợt việc số mười một chứ không phải thay đổi của đợt này, và áp cho cả bốn ô; nếu BA muốn luôn hiện ký hiệu tiền thì xin mở phiếu riêng vì sẽ phải hạ cỡ chữ của cả bốn chỉ số. Thứ ba, riêng ca BA yêu cầu retest là âm 999.999.999 nay hiện ra là -1tỷ, tức làm tròn lên bậc tỷ, đó là hệ quả của cách rút gọn một chữ số thập phân. Thứ tư, số đo trong phiếu này lấy trên bản sao cơ sở dữ liệu có cài đủ nhóm mô đun giống máy chạy thử, không phải trên chính máy chạy thử, vì lúc làm thì mã chưa được đưa lên đó. Sau đó có soi lại máy chạy thử một lượt chỉ đọc và xác nhận được hai điều. Một là lỗi tái hiện đúng nguyên trạng trên cửa hàng [HCM-01] TP HCM Quận 1, số dư âm 72.449 đang hiện thành -7244 ở dòng trên và 9 kèm ký hiệu tiền ở dòng dưới, trùng khớp từng ký tự với ảnh BA gửi, nên BA cứ retest thẳng trên cửa hàng đó. Hai là lúc soi lần đầu, máy chạy thử vẫn chạy bản cũ; sau khi nâng cấp hai mô đun thì đã đo lại ngay trên máy chạy thử và ô CÔNG NỢ của cửa hàng đó hiện là -72k trên một dòng, nên phiếu này retest được ngay"


