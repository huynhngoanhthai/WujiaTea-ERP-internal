# G2 (29/09/2026) — shell: 141 UI-MOB-STORE-SWITCHER-001 (dải cửa hàng mobile) · 140 UI-PC-TOPBAR-REG-001
#   (giỏ/chuông + khối Cửa hàng hiện tại PC ≥1200). Chủ dự án chốt đầu phiên: (a) 1 cửa hàng ⇒ không
#   chevron · (b) nhãn vai trò một nguồn tiếng Việt ở mọi chỗ in vai trò · (d) dải hiện cả trên Home ·
#   (e) chip vai trò trong khối theo 140 (mockup V4 vẽ tách — FYI BA). Bảng đo: docs/g2-acceptance-matrix.md.
# Đo trên DB sao chép wujia_g1 (= wujia_frp + replay deploy, mã HEAD trước G2): probe hình học 3 route ×
#   1440/1280/1200 × badge 0/4/12; dải mobile 27 route × 360/390/430 × user nhiều/1 cửa hàng × tên dài;
#   vân tay PC 81 so trước/sau chỉ lệch nền khối, nền pill, chữ vai trò dưới avatar.
