  sprint: "2026-09-10-D6c"
  build_override: "ĐÃ DEPLOY UAT 10/09/2026 — sẵn sàng retest | 10/09/2026 | Sprint 2026-09-10-D6b + D6c | wujia_portal_return 19.0.3.1.0 · wujia_portal_layout 19.0.47.0.0 — deploy: git pull rồi -u wujia_portal_layout,wujia_portal_return,wujia_portal_support,wujia_portal_info_request. Phiếu này gồm HAI nửa: nửa thẻ danh sách làm ở đợt D6b, nửa ô chọn sản phẩm ở đợt D6c, cả hai cùng lên trong một lần deploy"
  url: "/portal/return và /portal/return/new — thẻ danh sách trên điện thoại và ô chọn sản phẩm trên biểu mẫu"
  odoo_fit: "Custom"
  fix: "Tên sản phẩm dài, nhất là tên song ngữ có tiếng Hoa, trước đây bị cắt ở hai chỗ. Chỗ thứ nhất là thẻ trong danh sách bù hàng: tên bị ép trên một dòng rồi cắt bằng dấu ba chấm ngay giữa phần tiếng Hoa, đo được tám trên hai mươi thẻ bị cắt ngay dòng đầu ở khổ điện thoại. Nay tên được phép chạy tối đa hai dòng và chỉ cắt ở cuối dòng thứ hai, riêng tên tiếng Hoa vốn không có dấu cách thì được phép ngắt giữa chữ để thẻ không bị đẩy tràn ngang; phần này đã làm ở đợt trước. Chỗ thứ hai là ô chọn sản phẩm trên biểu mẫu tạo yêu cầu: ô chọn của trình duyệt luôn cắt tên theo bề ngang của ô, người dùng chọn xong không có cách nào xem lại tên đầy đủ. Nay ngay dưới ô chọn có thêm một dòng in nguyên văn tên sản phẩm vừa chọn, tự xuống dòng cho hết chữ, không cắt; dòng này cũng được nối với ô chọn để trình đọc màn hình đọc trọn tên, và tên đầy đủ được gắn thêm vào chú thích hiện khi rê chuột. Tên sản phẩm trong Odoo không bị đổi một chữ nào, và bộ phông chữ cũng không khai lại lần nữa vì bộ phông dùng chung đã có sẵn phần chữ Hoa từ đợt sửa phông trước đó, chính việc khai lại mới là nguyên nhân gây cảm giác phông rời rạc"
  impact: "Thẻ danh sách bù hàng trên điện thoại và ô chọn sản phẩm trên biểu mẫu ở cả máy tính lẫn điện thoại. Không đổi dữ liệu, không đổi tên sản phẩm, không đổi quyền, không đổi luồng nghiệp vụ. Đo với ba tên mốc dài mười bảy, ba mươi chín và chín mươi mốt ký tự có chữ Hoa: ở cả ba khổ màn 1440, 390 và 360, dòng tên đầy đủ hiện đủ bảy mươi ba trên bảy mươi ba ký tự, chạy hai đến ba dòng, không chỗ nào bị cắt, không màn nào cuộn ngang. Thẻ danh sách giữ nguyên kết quả của đợt trước là không thẻ nào còn cắt ngay dòng đầu. Việc đo được làm mà không tạo hay xác nhận đơn hàng thật, đúng quy định kiểm thử"
  retest: "Mở Bù hàng trên điện thoại khổ 390 và 360: tên sản phẩm dài trong thẻ phải chạy tối đa hai dòng và chỉ có dấu ba chấm ở cuối dòng thứ hai, không được cắt giữa dòng thứ nhất, phần chữ Hoa phải đọc liền mạch cùng phông với phần tiếng Việt. Sau đó bấm Tạo mới, chọn một đơn hàng gốc rồi chọn sản phẩm có tên dài song ngữ: ngay dưới ô chọn phải hiện một dòng in đủ tên sản phẩm, tự xuống dòng cho hết chữ, không có dấu ba chấm; rê chuột lên ô chọn cũng phải thấy chú thích là tên đầy đủ. Làm lại trên máy tính khổ 1440. Lưu ý ô chọn ở trạng thái đóng vẫn cắt tên theo bề ngang ô, đó là hành vi của ô chọn chuẩn trình duyệt và chính là lý do có thêm dòng tên đầy đủ bên dưới"
  limit: "Thứ nhất, phần ô Đề xuất điều chỉnh nói người dùng phải xem được đầy đủ lựa chọn khi mở ô chọn. Chủ dự án chốt ngày 10 tháng 09 là giữ ô chọn chuẩn của trình duyệt và chỉ bổ sung vùng xem tên đầy đủ sau khi chọn, không dựng một ô chọn tự vẽ. Lý do là ô chọn tự vẽ là dựng một thành phần giao diện mới, chồng lấn hai chuẩn thanh lọc và nút bấm mà BA chưa viết spec, làm bây giờ nhiều khả năng phải làm lại. Trên điện thoại thật, khi mở ô chọn thì danh sách lựa chọn là màn hình do hệ điều hành vẽ nên vốn không cắt chữ; chỗ cắt thật là lúc ô đã đóng, và chỗ đó nay đã có dòng tên đầy đủ bù lại. Xin BA xác nhận cách giải quyết này khi retest, nếu BA vẫn muốn ô chọn tự vẽ thì mở phiếu riêng cho lứa sau. Thứ hai, thẻ trong danh sách cố ý giữ khuôn danh sách chung thay vì bọc thêm khuôn thẻ nền như chữ trong phiếu, vì bọc thêm sẽ dựng lại lỗi thẻ trắng lồng thẻ trắng vừa vá hôm 09 tháng 09; đây là điều đã ghi ở phiếu bù hàng thứ tám và nhắc lại ở đây cho trọn"


