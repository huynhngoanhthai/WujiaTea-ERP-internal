  fix: "Trước đây mỗi màn Portal tự vẽ khung thẻ theo một kiểu riêng: hơn hai mươi họ thẻ khác nhau, bo góc từ 12 đến 24 điểm ảnh, có thẻ đổ bóng có thẻ không, đệm lệch nhau, và một phần lớn còn dùng thẳng thẻ mặc định của Odoo nên viền và nền do Odoo quyết chứ không do Wujia. Nay toàn bộ khung thẻ dùng chung một khuôn duy nhất: nền trắng, viền mỏng một điểm ảnh, bo góc 16 trên máy tính và 14 trên điện thoại, đệm gọn 16 hoặc 12, không đổ bóng, và chỉ một tệp giao diện được phép khai dáng khung. Các họ thẻ cũ giữ lại tên riêng để phần nội dung bên trong không đổi. Việc làm qua bảy đợt: dựng khuôn và bốn họ thẻ đầu, rồi thẻ máy tính, thẻ điện thoại, thẻ số liệu, thẻ báo cáo, gỡ hẳn thẻ mặc định của Odoo khỏi Portal, và đợt cuối là nhóm màn Khảo sát vốn chưa đo được vì phần mềm đó chưa cài trên máy dev. Ở nhóm Khảo sát phát hiện bốn hộp trên màn khắc phục khai dáng ngay trong mã màn hình chứ không qua tệp giao diện, chỉ đếm lúc chạy mới lộ, nay cũng đã đưa về khuôn chung"
  impact: "Toàn bộ Portal. Không đổi dữ liệu, không đổi quyền, không đổi luồng nghiệp vụ, không đổi chữ. Mỗi đợt đều đo trước và sau trên bản sao ở năm khổ màn 1440, 1024, 992, 390 và 360: chiều cao trang và số bản ghi nhìn thấy trong một màn không giảm ở bất kỳ ô nào, nhịp tiêu đề sang thân thẻ giữ đúng 12 điểm ảnh, ảnh chụp các màn ngoài phạm vi giống hệt từng điểm ảnh. Sau khi cài lên máy chủ kiểm thử đã đo lại chỉ-đọc trên chính máy chủ ở 25 màn và năm khổ: không còn thẻ mặc định nào của Odoo, 86 trên 86 khung đúng viền, bo góc và không bóng, và không có luật giao diện nào từ phần bán hàng trực tuyến của Odoo chen vào. Bộ kiểm tra tự động 83 phép thử, mỗi đợt đều chứng minh có tác dụng bằng cách cố tình sửa sai rồi thấy đúng phép thử đỏ"
  retest: "Mở lần lượt Trang chủ, Đặt hàng, Giỏ hàng, Lịch sử mua hàng, Đổi trả và Tạo yêu cầu đổi trả, Giao hàng, Công nợ, Thông báo, Hỗ trợ, Kiến thức, Đăng ký thi, Khảo sát và chi tiết một phiếu, Hồ sơ, Thông tin cửa hàng, Báo cáo đặt hàng, ở máy tính 1440 và điện thoại 390. Mọi thẻ nội dung phải cùng một dáng: nền trắng, viền mỏng, bo góc đều nhau, không đổ bóng, đệm gọn; các thẻ trên cùng một hàng cao bằng nhau. Không thẻ trắng nào nằm lọt trong thẻ trắng khác, trừ ô tổng điểm ở chi tiết Khảo sát đang chờ chốt thiết kế. Thu màn hình về 1024, 992 và 360: không cuộn ngang, không thẻ nào vỡ. Với màn Khảo sát chỉ nghiệm thu khung thẻ, phần nội dung trường dữ liệu để đợt có dữ liệu mẫu như BA đã ghi. Nếu vẫn thấy dáng cũ thì tải lại trang bỏ qua bộ nhớ đệm"
  limit: "Thứ nhất, màn đăng nhập và quên mật khẩu cố ý giữ dáng riêng có bóng theo thiết kế đã duyệt S39, chủ dự án chốt ngày 06/09; các màn này cũng không nằm trong mười bốn màn BA nêu. Thứ hai, hai hộp thoại thông báo trên màn khắc phục Khảo sát và ô chỉ báo điểm nhỏ 60 điểm ảnh không được coi là thẻ nội dung nên giữ nguyên; nếu BA muốn chúng cùng khuôn thì báo để mở đợt riêng. Thứ ba, ở chi tiết Khảo sát trên máy tính, ô tổng điểm là hộp trắng nằm trong thẻ trắng từ trước; đưa về nền xám nhạt sẽ mất viền xanh nhấn nên chờ BA chốt. Thứ tư, đợt Khảo sát mới chỉ kiểm trên bản sao, chưa lên máy chủ kiểm thử; cột Build/Deploy sẽ được cập nhật sau khi cài. Thứ năm, trang chi tiết cửa hàng theo đường dẫn /my/franchises chạy trên bộ giao diện mặc định của Odoo, không nạp giao diện Wujia, nên để nguyên. Thứ sáu, mười hai chỗ dùng thẻ trong các phần mềm bên thứ ba ở giao diện nội bộ không thuộc Portal, không đụng"
