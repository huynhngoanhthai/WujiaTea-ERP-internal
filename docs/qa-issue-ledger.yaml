  fix: "Mọi block danh sách trên trang chủ nay hiển thị đúng hai bản ghi mới nhất. Trước đây Đơn hàng gần đây hiện năm dòng còn Thông báo, Đổi trả, Kiến thức hiện ba dòng nên trang bị kéo dài và các block cuối bị đẩy xuống sâu. Số lượng này nay là một con số duy nhất dùng chung cho cả năm nguồn dữ liệu, sửa một chỗ là mọi block đổi theo, không còn cảnh mỗi block một kiểu. Thứ tự vẫn từ mới đến cũ theo ngày nghiệp vụ của từng block, và liên kết Xem tất cả vẫn mở danh sách đầy đủ. Việc cắt bớt làm ở tầng dữ liệu chứ không phải giấu bằng giao diện, nên trang cũng nhẹ hơn"
  impact: "Trang chủ ở cả bản điện thoại lẫn bản máy tính, vì hai bản dùng chung một nguồn dữ liệu. Bản máy tính trước đây hiện năm đơn nay cũng còn hai đơn kèm liên kết Xem tất cả, đây là quyết định của chủ dự án để tránh tách đôi nguồn dữ liệu. Bốn con số ở khối KPI vẫn đếm trên toàn bộ dữ liệu chứ không bị giới hạn hai bản ghi. Các trang danh sách đầy đủ không đổi"
