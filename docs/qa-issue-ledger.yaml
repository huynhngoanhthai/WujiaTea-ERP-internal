  impact: "Toàn bộ chỗ có nút Quay lại trên portal, cả máy tính lẫn điện thoại. Màn Công nợ trước đây tự chỉnh riêng kích thước nút nay dùng chung khuôn chuẩn, vị trí và khoảng cách theo thiết kế Công nợ giữ nguyên. Dữ liệu, quyền xem và nghiệp vụ không đổi; không màn nào đổi tên hay đổi chiều cao tiêu đề"
