  limit: "Thứ nhất, để về trần 120 mà không đè thành phần thẻ chung, nội dung chuyển khoản không còn nhãn Tham chiếu riêng mà đứng sau phương thức trên dòng đầu; nếu BA muốn giữ ba hàng có nhãn thì phải hạ nhịp của thẻ chung cho cả cổng, đây là câu 4b trong tài liệu câu hỏi đã gửi. Thứ hai, thẻ chung không có kiểu cắt một dòng bằng dấu ba chấm, nên nội dung chuyển khoản dài hơn khoảng 40 ký tự ở khổ 360 sẽ xuống dòng và thẻ cao 122; với nội dung như trên máy chạy thử hiện nay (23 ký tự) thẻ cao 104 ở cả 390 và 360. Thứ ba, ô chọn số dòng mỗi trang chỉ có trên máy tính theo thiết kế của thành phần phân trang chung, điện thoại đi theo bậc đã chọn trên máy tính qua địa chỉ trang. Thứ tư, bản sửa mới nằm trong mã nguồn, chưa lên máy chạy thử; chủ dự án cần nâng cấp mô đun công nợ rồi BA mới retest được"

