  url: "/portal trên máy tính (từ 992 điểm ảnh) — Trang chủ; so với mockup Ngo-Gia-Portal-Home-PC-Mockup-V4-1440; thử bằng tài khoản có đơn, đổi trả, chuyến giao, thông báo và tài khoản cửa hàng mới chưa có chứng từ"
  odoo_fit: "Custom"
  fix: "Trang chủ trên máy tính dựng lại theo mockup V4. Hàng đầu chia đôi: bên trái khối Cửa hàng hiện tại (tên đậm, khu vực hoặc địa chỉ, nhãn vai trò tiếng Việt), bên phải khối Khung giờ đặt hàng với cùng ba trạng thái như điện thoại (Đang mở còn bao lâu kèm thanh tiến độ, Đã đóng và giờ mở lại, Đặt hàng 24/7). Bỏ khối xanh đậm lớn và Thao tác nhanh. Bốn ô số Đơn hàng, Thông báo, Đổi trả, Công nợ đúng thứ tự V4, cùng nhãn, cùng số và cùng liên kết như điện thoại; Công nợ là số thật (vd 17,8tr), cửa hàng chưa có chứng từ in dấu gạch thay vì 0đ; không còn mũi tên phải trên ô số. Bên dưới là bảy khối: Đơn hàng gần đây, Yêu cầu đổi trả gần đây, Giao hàng sắp tới (dòng phụ N đơn chưa giao), Thông báo nổi bật, Bài viết / Kiến thức mới, Hỗ trợ nhanh (Tạo yêu cầu, Gọi hotline, Chat), và Thông tin cửa hàng rộng cả hàng với ba ô Địa chỉ, Điện thoại, Người phụ trách. Năm khối có danh sách có nút Xem tất cả ở góc phải, không mũi tên. Mỗi dòng có ô icon theo loại chứng từ, số tiền, ngày giờ, nhãn màu trạng thái và liên kết chi tiết lấy đúng như Trang chủ điện thoại; chữ dài xuống dòng thay vì bị cắt. Không có dữ liệu thì hiện câu trống như điện thoại"
  impact: "Chỉ Trang chủ trên máy tính. Bỏ ô Đơn chờ xử lý và bảng Sản phẩm mua nhiều nhất vì V4 không có (xem đơn chờ ở Lịch sử mua hàng, lọc trạng thái; Top sản phẩm vẫn có ở Báo cáo). Không đổi thanh đầu trang, thanh bên, các trang máy tính khác, quyền hay dữ liệu; Trang chủ điện thoại giữ nguyên (so bố cục 360, 390, 430 trước và sau giống hệt, trừ chữ đếm lùi khung giờ chạy theo giờ). Số truy vấn khi mở Trang chủ giảm 7 so với trước (46 còn 39 với tài khoản nhiều cửa hàng), bảy khối mới không thêm truy vấn nào vì đọc chung dữ liệu với điện thoại. Đo 1440, 1280, 1200, 1199, 1024, 992 với ba tài khoản: không tràn ngang, không chữ bị cắt, nhãn không đè chữ, các khối cùng hàng cao bằng nhau; 991 trở xuống ra Trang chủ điện thoại"
  retest: "Mở /portal trên máy tính khổ 1440, đặt cạnh mockup V4: hàng đầu hai khối Cửa hàng hiện tại và Khung giờ đặt hàng bằng nhau; bốn ô số Đơn hàng, Thông báo, Đổi trả, Công nợ, bấm từng ô mở đúng trang; hàng dưới ba khối Đơn hàng gần đây, Yêu cầu đổi trả gần đây, Giao hàng sắp tới; tiếp theo Thông báo nổi bật, Bài viết / Kiến thức mới, Hỗ trợ nhanh; cuối cùng Thông tin cửa hàng rộng cả hàng. Bấm Xem tất cả ở năm khối và bấm từng dòng: mở đúng trang như trên điện thoại; số tiền ghi ₫ trùng với Trang chủ điện thoại. Thu hẹp cửa sổ xuống 1280, 1024, 992: các khối chuyển hai cột, không cuộn ngang, không chữ bị cắt; 991 ra giao diện điện thoại. Đăng nhập cửa hàng chưa có đơn: các khối hiện câu trống, Công nợ ghi dấu gạch. Mở Trang chủ trên điện thoại: giống như trước Tiền tệ: kiểm bằng đơn tạo sau khi bảng giá đã là VND."
  limit: "Phản hồi BA RETEST FAIL 08/10/2026 (tiền tệ): không phải lỗi hiển thị. Trang chủ in đúng tiền tệ của từng đơn, máy tính và điện thoại trùng nhau (kiểm lại trên UAT 10/10: S00078 0 ₫, S00077 9.200,00 $, S00031 72.450,00 $ ở cả 1440 và 390). Nguyên nhân là dữ liệu UAT: bảng giá duy nhất 'Default' đang là USD và gắn cho cửa hàng HCM-01, nên 76/77 đơn trên UAT là USD, trong khi công ty dùng VND. Nếu ép ký hiệu ₫ thì 9.200 USD sẽ hiện thành 9.200 ₫, sai số tiền. Để retest tiêu chí VNĐ: vào Bán hàng → Cấu hình → Bảng giá, đổi tiền tệ bảng giá Default sang VND (hoặc tạo bảng giá VND và gán cho cửa hàng), rồi đặt đơn mới; các đơn cũ đã tạo bằng USD vẫn hiện $. Ngoài ra: Thứ nhất, V4 chỉ vẽ khổ 1440: từ 1400 trở lên bảy khối xếp ba cột như V4, từ 992 đến 1399 xếp hai cột vì có thanh bên nên ba cột quá hẹp. Thứ hai, theo chốt chủ dự án: khối Giao hàng có thêm Xem tất cả và số đơn chưa giao là dòng phụ dưới tiêu đề (V4 để số ở góc phải, không có liên kết); dòng Thông báo dùng ô icon chuông như điện thoại thay cho chấm xanh của V4. Thứ ba, tiêu đề khối giữ cỡ chữ chuẩn của cổng nên hai tiêu đề dài xuống hai dòng ở 1440 (V4 vẽ chữ nhỏ hơn một dòng); không cắt chữ. Thứ tư, Tổng tiền yêu cầu đổi trả in dấu gạch vì chứng từ đổi trả chưa có số tiền (như điện thoại); Hotline lấy số điện thoại công ty, chưa khai thì dấu gạch; Chat chỉ là nút giao diện, chưa có kênh; Người phụ trách chỉ ghi tên chủ tiệm (V4 ghi kèm chức danh). Thứ năm, cổng chỉ có chữ giao diện tiếng Việt; chuỗi dài tiếng Việt, tiếng Anh, chữ Hán đã thử bằng dữ liệu. Thứ sáu, thanh tiến độ khung giờ dùng màu cam như điện thoại (V4 vẽ xanh) và nhãn vai trò là viên nền nhạt theo chuẩn cổng (V4 nền xanh đặc). Phát hiện riêng ngoài phạm vi: ở 992 đến 1199 thanh đầu trang chật và logo bị khối Cửa hàng che, có từ trước G3, báo BA tách issue"

