UAT-BH-001:
  sprint: "2026-08-25-D1"
  build_override: "Chờ deploy UAT | 25/08/2026 | Sprint 2026-08-25-D1 | commit: 8613813 | wujia_portal_return 19.0.2.7.0 — deploy: -u wujia_portal_return,wujia_sale (bắt buộc kèm wujia_sale), không cập nhật dữ liệu, không module mới | Đo trên bản dựng cô lập bằng trình duyệt thật: trước khi sửa bấm nút không ra đơn nào, sau khi sửa ra đúng một đơn bù giá trị 0 với hai dòng đúng sản phẩm và đúng đơn vị giao, hai phiếu được ghi nhận phân bổ, phần lẻ 5kg vẫn treo chờ đợt sau | URL: Bù hàng > Yêu cầu bù hàng > Thao tác > Xử lý bù hàng"
  url: "Backend — Yêu cầu bù hàng > Thao tác > Xử lý bù hàng"
  odoo_fit: "Custom"
  fix: "Bấm Tạo đơn bù trong bảng xử lý bù hàng trước đây luôn báo Dữ liệu đã thay đổi và không sinh đơn nào, dù phiếu đã được duyệt và bảng vẫn hiện đủ số liệu. Nguyên nhân là các ô chỉ để xem trong bảng đó bị khoá ở tầng sâu nhất, nên khi bấm nút, phần mềm chỉ nhận lại được ô số lượng giao mà mất hết thông tin cửa hàng, sản phẩm và đơn vị tính, rồi tự kết luận rằng dữ liệu đã bị người khác sửa. Nay các ô chỉ để xem vẫn khoá không cho gõ nhưng giá trị được gửi kèm đầy đủ, và quan trọng hơn, lúc bấm nút phần mềm tự tính lại toàn bộ nhóm bù và thứ tự ưu tiên trực tiếp từ các phiếu đang có trong hệ thống chứ không tin vào những gì màn hình gửi lên. Nhờ vậy dù người dùng không mở từng nhóm ra xem thì kết quả vẫn đúng. Cơ chế cảnh báo dữ liệu đã thay đổi vẫn giữ, nhưng nay chỉ bật khi quyền lợi thật sự thay đổi giữa lúc mở bảng và lúc bấm nút"
  impact: "Chỉ chức năng Xử lý bù hàng ở backend. Mỗi cửa hàng vẫn gom đúng một đơn bù cho một lần xử lý, giá trị 0 đồng, chia theo thứ tự phiếu duyệt trước được bù trước. Thao tác lại lần hai trên phiếu đã bù hết sẽ báo không có yêu cầu hợp lệ chứ không sinh đơn trùng. Không đổi dữ liệu cũ, không đổi quyền, không đụng phần Portal. Đã bổ sung sáu phép thử tự động chạy đúng đường mà màn hình thật đi, trong đó có một phép thử canh chừng để lỗi này không tái phát"
  retest: "Chọn vài phiếu bù hàng đã duyệt của cùng một cửa hàng, vào Thao tác chọn Xử lý bù hàng, KHÔNG mở từng nhóm ra xem, bấm thẳng Tạo đơn bù: phải sinh đúng một đơn bù giá trị 0 cho cửa hàng đó, các dòng đúng sản phẩm bù và đúng đơn vị giao. Mở phiếu gốc kiểm phần đã phân bổ và phần còn lại. Với phiếu có đơn vị quyền lợi khác đơn vị giao, ví dụ quyền lợi tính theo ki-lô-gam mà giao theo thùng, số lượng giao phải làm tròn xuống theo quy cách và phần lẻ vẫn treo lại chờ đợt sau. Chạy lại Xử lý bù hàng trên đúng những phiếu vừa bù hết: phải báo không có yêu cầu hợp lệ và không sinh thêm đơn nào. Thử mở bảng xử lý rồi để đó, nhờ người khác huỷ một phiếu trong danh sách, quay lại bấm Tạo đơn bù: phải báo dữ liệu đã thay đổi và không tạo đơn sai số"
  limit: "Không có"

UAT-BH-003:
  sprint: "2026-08-25-D1"
  build_override: "Chờ deploy UAT | 25/08/2026 | Sprint 2026-08-25-D1 | commit: 8613813 | wujia_portal_return 19.0.2.7.0 — deploy: -u wujia_portal_return,wujia_sale, không cập nhật dữ liệu, không module mới | Đo trên bản dựng cô lập: trước khi sửa màn hiện 10 dòng giả REF0001 đến REF0010 kèm dòng chữ chưa có dữ liệu, sau khi sửa hết sạch dòng giả; khi có đơn bù thật thì hiện đúng 3 trên tổng 35 đơn hàng trong hệ thống | URL: Bù hàng > Đơn bù hàng"
  url: "Backend — Bù hàng > Đơn bù hàng"
  odoo_fit: "Odoo standard (đổi cấu hình màn danh sách)"
  fix: "Màn Đơn bù hàng trước đây vừa hiện dòng chữ chưa có dữ liệu vừa hiện mười dòng đơn hàng lạ mang mã REF0001 đến REF0010. Đây không phải dữ liệu thật và cũng không phải lỗi lọc: mười dòng đó là dữ liệu mẫu do Odoo tự dựng ra để minh hoạ mỗi khi danh sách đơn hàng trống, một tính năng mặc định của màn đơn hàng gốc. Vì lỗi không tạo được đơn bù nên danh sách luôn trống, và lần nào mở màn cũng thấy dữ liệu mẫu. Nay màn Đơn bù hàng dùng bảng riêng đã tắt hẳn tính năng dựng dữ liệu mẫu, đồng thời chỉ còn sáu cột đúng nghiệp vụ bù hàng là mã đơn, cửa hàng, khách hàng, ngày đặt, tổng tiền và trạng thái, và không cho tạo đơn tay từ màn này"
  impact: "Chỉ màn Đơn bù hàng ở backend. Danh sách đơn hàng thường của Bán hàng không đổi vì đây là bảng riêng chỉ dùng cho màn này. Không đổi dữ liệu, không đổi quyền. Sau khi lỗi tạo đơn bù được sửa thì màn này bắt đầu có dữ liệu thật, đã kiểm đúng ba đơn bù trong khi hệ thống có ba mươi lăm đơn hàng các loại"
  retest: "Mở Bù hàng rồi vào Đơn bù hàng khi chưa có đơn bù nào: chỉ được thấy dòng chữ chưa có dữ liệu, tuyệt đối không còn dòng nào mang mã REF. Xử lý một phiếu bù để sinh đơn bù rồi mở lại màn: phải thấy đúng đơn bù vừa tạo, không lẫn đơn hàng bán thường. Đối chiếu số dòng với số đơn bù thật. Kiểm các cột hiện ra đúng sáu cột nghiệp vụ và màn này không có nút tạo mới"
  limit: "Không có"

UAT-BH-005:
  sprint: "2026-08-25-D1"
  build_override: "Chờ deploy UAT | 25/08/2026 | Sprint 2026-08-25-D1 | commit: 8613813 | wujia_portal_return 19.0.2.7.0 + wujia_portal_layout 19.0.32.3.0 — deploy: -u wujia_portal_return,wujia_sale,wujia_portal_layout, không cập nhật dữ liệu, không module mới | Đo hai khổ màn 1920 và 391: cả hai bản đều đủ bốn ô lọc và chín lựa chọn trạng thái y hệt nhau, tám lần lọc đều trả về đúng và giữ nguyên lựa chọn, không cuộn ngang, đi phím Tab tới được cả bốn ô | URL: /portal/return"
  url: "/portal/return — bộ lọc danh sách yêu cầu bù hàng (máy tính và điện thoại)"
  odoo_fit: "Custom"
  fix: "Bộ lọc của màn danh sách bù hàng trước đây lệch nhau giữa hai bản: bản máy tính có chọn trạng thái và khoảng ngày nhưng thiếu ô tìm theo từ khoá, bản điện thoại có ô từ khoá và khoảng ngày nhưng lại thiếu chọn trạng thái. Nay cả hai bản đều có đủ bốn thứ là từ khoá, trạng thái, từ ngày và đến ngày, dùng chung một cách xử lý ở máy chủ nên kết quả trả về giống hệt nhau. Phần xử lý vốn đã nhận đủ các điều kiện này từ trước, đợt này chỉ bổ sung ô nhập còn thiếu chứ không thêm luật lọc mới. Ô từ khoá ở hai bản nay ghi cùng một dòng gợi ý là mã yêu cầu, mã đơn hoặc sản phẩm, đúng với phạm vi tìm kiếm thật vì hệ thống còn tìm cả theo mã chuyến và mã sản phẩm"
  impact: "Chỉ màn danh sách yêu cầu bù hàng của Portal. Không đổi dữ liệu, không đổi quyền xem, không đổi cách phân trang. Ô chọn trạng thái trên bản điện thoại tự lọc ngay khi chọn nên không cần bấm thêm nút. Có thêm một kiểu ô chọn dùng chung mới cho Portal, đặt cạnh kiểu ô ngày sẵn có, không sửa kiểu cũ nào. Đã kiểm bằng bàn phím: đi phím Tab tới được đủ bốn ô ở cả hai khổ màn và không lọt vào ô của bản đang bị ẩn"
  retest: "Mở danh sách bù hàng trên máy tính: phải có đủ ô từ khoá, chọn trạng thái, từ ngày và đến ngày. Gõ một mã yêu cầu vào ô từ khoá rồi lọc, sau đó thử gõ tên sản phẩm: kết quả phải thu hẹp đúng. Mở cùng màn trên điện thoại: cũng phải có đủ bốn thứ đó, chọn trạng thái là danh sách tự lọc ngay. Lọc cùng một điều kiện ở hai bản và so kết quả: phải giống nhau. Sau khi lọc, ô chọn phải giữ nguyên lựa chọn vừa chọn. Thu màn hình còn 360 điểm ảnh: không được cuộn ngang. Nhấn Tab lần lượt: phải đi qua đủ bốn ô đang nhìn thấy"
  limit: "Các ô lọc trên bản điện thoại hiện cao 38 điểm ảnh, chưa đạt mức chạm 44 đến 48 điểm ảnh. Phần này thuộc đúng phạm vi issue UAT-BH-009 nên Dev cố ý chưa đụng ở đợt này để không trộn hai issue vào một lần sửa"

UAT-BH-006:
  sprint: "2026-08-25-D1"
  build_override: "Chờ deploy UAT | 25/08/2026 | Sprint 2026-08-25-D1 | commit: 8613813 | wujia_portal_return 19.0.2.7.0 — deploy: -u wujia_portal_return,wujia_sale, không cập nhật dữ liệu, không module mới | Đo trên bộ dữ liệu dựng đủ tám trạng thái: tám lần lọc cho ra các tập rời nhau và cộng lại đúng bằng tổng danh sách, mọi dòng trả về đều hiện đúng chữ của nhãn vừa lọc | URL: /portal/return"
  url: "/portal/return — nhãn và bộ lọc trạng thái yêu cầu bù hàng"
  odoo_fit: "Custom"
  fix: "Danh sách chọn trạng thái trước đây có hai dòng cùng ghi Đang xử lý vì hai trạng thái nghiệp vụ khác nhau bị đặt trùng tên, còn nhãn Đang bù một phần thì chỉ hiện được trên thẻ chứ không chọn lọc được vì nó không phải một trạng thái lưu trong hệ thống mà là kết hợp của đang xử lý và đã giao được một phần. Nay nhãn hiển thị và nhãn trong ô lọc dùng chung một danh sách duy nhất nên không thể lệch nhau nữa: mỗi nhãn chỉ xuất hiện một lần, nhãn Đang bù một phần lọc ra đúng những yêu cầu đã giao được một phần, và nhãn Đang xử lý gom cả giai đoạn đang xem xét lẫn đang xử lý nhưng loại ra phần đã bù một phần để hai nhãn không chồng lấn"
  impact: "Chỉ nhãn và bộ lọc trạng thái của màn danh sách bù hàng trên Portal, cả bản máy tính lẫn điện thoại. Không đổi trạng thái lưu trong hệ thống, không đổi luồng duyệt, không đổi dữ liệu cũ. Đã dựng dữ liệu đủ tám trạng thái để kiểm: cộng số dòng của tám nhãn lại đúng bằng tổng danh sách khi không lọc, nghĩa là các nhãn không trùng nhau và cũng không bỏ sót yêu cầu nào"
  retest: "Mở ô chọn trạng thái ở màn danh sách bù hàng: phải thấy đủ các nhãn Đã gửi, Đang xử lý, Đã duyệt, Đang bù một phần, Hoàn tất, Từ chối, Đã huỷ và không còn hai dòng trùng chữ Đang xử lý. Chọn Đang bù một phần: chỉ ra những yêu cầu đã được giao một phần. Chọn Đang xử lý: ra các yêu cầu đang xem xét hoặc đang xử lý nhưng KHÔNG lẫn yêu cầu đang bù một phần. Với mỗi nhãn, đối chiếu chữ trạng thái hiện trên từng dòng kết quả phải đúng bằng nhãn vừa chọn. Cộng số kết quả của tất cả các nhãn lại phải bằng tổng số yêu cầu khi không lọc"
  limit: "Dev có bổ sung thêm một nhãn ngoài bảy nhãn BA liệt kê là nhãn Nháp, vì Portal thực tế vẫn liệt kê các yêu cầu còn ở dạng nháp; nếu thiếu nhãn này thì cộng tất cả bộ lọc lại sẽ không phủ hết danh sách. Nhờ BA xác nhận khi nghiệm thu: giữ nhãn Nháp, hay ẩn hẳn yêu cầu nháp khỏi danh sách Portal — trường hợp sau là thay đổi nghiệp vụ chứ không phải sửa bộ lọc"
# =====================================================================================
# Cụm D2 26/08 — WJ-PORTAL-UI-002 (BA audit UAT 22/08, Related Feature UI-02).
# Số đo: docs/d2-acceptance-matrix.md — 14/14 gạch acceptance, 80 ô đo trên chính UAT,
# hồi quy B4 286/286 + tab-walk 331 stop. Kiểm kê gốc rễ: docs/d2-font-inventory.md.
WJ-PORTAL-UI-002:
  sprint: "2026-08-26-D2"
  build_override: "ĐÃ DEPLOY UAT 27/08/2026 — sẵn sàng retest | 26/08/2026 | Sprint 2026-08-26-D2 | commit: b70d26a | wujia_portal_layout 19.0.32.4.0 (đã đối chiếu trên máy chủ, đúng phiên bản) — deploy: -u wujia_portal_layout, không cập nhật dữ liệu, không module mới, số hiệu bộ giao diện 1177 đã có hiệu lực trên máy chủ | Đo lại ngay trên máy chủ UAT sau khi cài đặt, ở 16 màn và 5 khổ màn 360, 390, 430, 500 và 1440: số chỗ còn dùng font khác từ 145 lượt xuống 0, không một ô nào lệch về chiều cao trang, số dòng tiêu đề, độ tràn ngang, độ đậm chữ hay font biểu tượng; chữ Thái và chữ Trung nay ra đúng font dự phòng đã khai. Hồi quy trên chính máy chủ: bộ kiểm tiêu đề trang 286 trên 286 đạt, đi bằng phím Tab qua 346 điểm dừng không đổi | URL: /portal"
  url: "/portal — toàn bộ Portal, cả bản máy tính và điện thoại"
  odoo_fit: "Custom"
  fix: "Một số tiêu đề trên Portal vẫn hiện bằng font Inter Tight thay vì Inter, cụ thể là tiêu đề Danh sách phiếu khảo sát ở bản máy tính, và ở bản điện thoại là Hóa đơn trong tuần của Công nợ, tên kỳ thi của Đăng ký thi, Hồ sơ cá nhân của Hồ sơ. Nguyên nhân đã đo trực tiếp trên máy chủ: luật ép font Inter đặt từ đợt trước chỉ có hiệu lực bên trong khung nội dung chính, trong khi các màn dành cho điện thoại và khối danh sách của trang Khảo sát lại được dựng bên ngoài khung đó, nên chúng nhận font mặc định của Odoo. Đây không phải lỗi của riêng bốn màn BA nêu mà là một luật đặt hụt phạm vi, nên máy quét ra thêm ba chỗ nữa cùng bệnh mà BA chưa kịp thấy là Báo cáo đặt hàng, Thông tin cửa hàng và Đổi trả, cộng thêm tiêu đề trong khay thông báo của chuông vốn chỉ hiện khi bấm vào. Nay luật ép font được đặt lại ở phạm vi toàn trang nên mọi tiêu đề ở mọi màn đều là Inter, sửa một lần cho tất cả chứ không vá từng màn. Font biểu tượng giữ nguyên hoàn toàn. Kèm theo đó, Portal nay khai rõ font dự phòng cho chữ Thái và chữ Trung: bộ chữ Inter mà Portal tự cài chỉ có sẵn chữ Latinh và chữ Việt, nên trước đây chữ Thái và chữ Trung tuỳ máy người dùng mà hiện font gì cũng được, riêng chữ Trung còn bị chọn nhầm sang biến thể tiếng Nhật nên hình chữ sai kiểu vùng. Chữ Latinh và chữ Việt không đổi vì Inter vẫn được ưu tiên trước"
  impact: "Toàn bộ Portal, cả máy tính lẫn điện thoại, vì đây là một luật giao diện dùng chung. Đã đo trước và sau trên chính máy chủ UAT ở 16 màn và 5 khổ màn: chiều cao từng trang, số dòng của từng tiêu đề, độ tràn ngang, font biểu tượng và lỗi kịch bản đều giống hệt nhau, không một ô nào lệch. Để chắc chắn con số này không bị nhiễu bởi chính cách đo, đã chạy thêm một lượt đối chứng nạp lại bản chưa sửa theo đúng cách đo đó, và lượt đối chứng cho ra cùng những chênh lệch nhỏ về chiều cao, chứng tỏ chênh lệch ấy là do cách đo chứ không do bản sửa. Không đổi cỡ chữ, không đổi độ đậm nhạt, không đổi màu, không đổi dữ liệu, không đổi quyền. Riêng độ đậm của tiêu đề cố ý giữ nguyên như cũ để không phá quy cách tiêu đề mục đã được duyệt ở đợt trước"
  retest: "Mở lần lượt Trang chủ, Đặt hàng, Công nợ, Lịch sử thanh toán, Đăng ký thi, Hồ sơ, Giao hàng, Thông báo, Kiến thức, Hỗ trợ, Đổi trả, Lịch sử mua hàng, Báo cáo đặt hàng, Khảo sát, Yêu cầu thông tin và Thông tin cửa hàng, ở cả máy tính và điện thoại. Kiểm font của tiêu đề, nhãn, nội dung, bảng, thẻ, menu, biểu mẫu và nút: tất cả phải là Inter, không còn chỗ nào là Inter Tight. Chú ý bốn chỗ BA đã nêu là tiêu đề Danh sách phiếu khảo sát trên máy tính, Hóa đơn trong tuần ở Công nợ, tên kỳ thi ở Đăng ký thi và Hồ sơ cá nhân ở Hồ sơ. Bấm chuông thông báo và kiểm tiêu đề trong khay. Kiểm các biểu tượng mũi tên, chuông, tìm kiếm vẫn hiện đúng hình chứ không thành ô vuông. Thu màn hình lần lượt về 360, 390, 430 và 500 điểm ảnh: không được xuất hiện thêm chỗ nào bị xuống dòng khác trước, không cuộn ngang. Đổi ngôn ngữ sang tiếng Thái và xem lại vài màn: chữ Thái phải hiện đủ nét, không có ô vuông trống. Nếu vẫn thấy font cũ thì tải lại trang bỏ qua bộ nhớ đệm vì bộ giao diện đã tăng số hiệu"
  limit: "Font dự phòng cho chữ Thái và chữ Trung khai theo tên font có sẵn trên máy người dùng chứ Portal không tự tải font về, để không bắt 1500 người dùng tải thêm vài megabyte mỗi lần vào. Máy nào không có sẵn các font đó thì vẫn hiện như hiện nay, không tệ hơn, nhưng giữa các máy có thể hơi khác nét nhau. Chữ Latinh và chữ Việt thì chắc chắn giống nhau ở mọi máy vì Portal tự cài font. Ngoài ra tiếng Trung hiện chưa được bật trên máy chủ UAT nên phần chữ Trung mới chỉ kiểm được bằng chữ mẫu chứ chưa kiểm trên màn thật; bản dịch đã có sẵn, chỉ cần bật ngôn ngữ là dùng được. Cuối cùng, độ đậm của tiêu đề cố ý không đụng tới dù nó cũng đang bị đặt hụt phạm vi giống hệt phần font, vì sửa sẽ làm nhạt các tiêu đề mục đã được duyệt ở đợt trước; nếu BA muốn thống nhất cả độ đậm thì mở một issue riêng"
