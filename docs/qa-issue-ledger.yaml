  impact: "Các block danh sách trên trang chủ bản điện thoại. Không đổi đường dẫn, không đổi dữ liệu. Người dùng vẫn bấm vào dòng để mở chi tiết như trước, chỉ khác là không còn mũi tên trang trí"
  retest: "Mở trang chủ trên điện thoại và cuộn qua đủ sáu block. Không block nào còn mũi tên ở từng dòng hay từng thẻ. Tiêu đề mỗi block vẫn có liên kết Xem tất cả. Chạm vào bất kỳ chỗ nào trên một dòng, kể cả phần trống bên phải, phải mở được chi tiết. Chạm giữ một dòng: nền và viền đổi lúc chạm rồi trở lại khi nhả. Kiểm khoảng cách giữa các dòng: không có khoảng trống thừa ở mép phải"
  limit: "Trạng thái lúc chạm mới đo bằng trình duyệt giả lập điện thoại, chưa đo trên máy thật, nhờ BA kiểm hộ khi retest"

WJ-HOME-008:
  sprint: "2026-08-19-C7"
  build_override: "UAT | 19/08/2026 | Sprint 2026-08-19-C7 | commit: b33b46f | Đã deploy UAT — wujia_portal_base 19.0.7.4.0 + wujia_portal_layout 19.0.31.20.0 | Dev đo lại ngay trên UAT sau khi deploy ở bốn khổ điện thoại: mỗi block danh sách đúng một khung, tổng số khung trên trang giảm từ 8 xuống 6, không còn phần tử nào dùng kiểu khung rời cũ, không cuộn ngang | URL: /portal"
  url: "/portal — cấu trúc khung của các block danh sách (điện thoại)"
  odoo_fit: "Custom"
  fix: "Các block danh sách trên trang chủ nay dùng chung một kiểu: mỗi block là một khung, bên trong là các dòng ngăn nhau bằng một đường kẻ mảnh. Trước đây Giao hàng sắp tới và Yêu cầu đổi trả tách mỗi bản ghi thành một khung riêng, còn Thông báo nổi bật lại là các dải màu rời không nằm trong khung nào, nên ba block cùng loại mà trông khác hẳn nhau. Nay cả ba về đúng một mẫu với Đơn hàng và Kiến thức: cùng lề trong, cùng bo góc, cùng cỡ chữ, cùng kiểu biểu tượng và cùng nhãn trạng thái. Riêng Hành động nhanh và khối bốn KPI giữ bố cục riêng theo đúng yêu cầu. Phần giao diện của kiểu khung rời cũ đã được dọn khỏi mã nguồn để sau này không ai dùng nhầm lại"
  impact: "Ba block Giao hàng sắp tới, Yêu cầu đổi trả và Thông báo nổi bật trên trang chủ bản điện thoại. Nội dung từng dòng giữ nguyên, chỉ đổi cách đóng khung. Block Thông báo không còn dải màu bên trái phân biệt loại thông báo, thay vào đó vẫn có nhãn loại thông báo ở bên phải mỗi dòng như trước. Các trang khác dùng chung bộ khung này đã kiểm lại: Hỗ trợ, Đổi trả và Thông tin cửa hàng không đổi"
  retest: "Mở trang chủ trên điện thoại. Ba block Thông báo nổi bật, Giao hàng sắp tới và Yêu cầu đổi trả mỗi block phải là một khung duy nhất, các dòng bên trong ngăn nhau bằng một đường kẻ, không còn mỗi bản ghi một khung rời. So sánh với block Đơn hàng gần đây và Kiến thức: lề, bo góc, cỡ chữ và nhãn trạng thái phải giống nhau. Khối Hành động nhanh và bốn KPI phải giữ nguyên bố cục cũ. Kiểm ở các khổ 360, 391, 430 và 500 điểm ảnh: không cuộn ngang, không có khung lồng trong khung"
  limit: "Không có"

