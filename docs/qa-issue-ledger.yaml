UAT-BH-009:
  sprint: "2026-09-10-D6c"
  build_override: "ĐÃ DEPLOY UAT 10/09/2026 — sẵn sàng retest | 10/09/2026 | Sprint 2026-09-10-D6c | wujia_portal_layout 19.0.47.0.0 · wujia_portal_return 19.0.3.1.0 · wujia_portal_support 19.0.3.18.0 · wujia_portal_info_request 19.0.1.8.0 — deploy: git pull rồi -u wujia_portal_layout,wujia_portal_return,wujia_portal_support,wujia_portal_info_request. LƯU Ý số hiệu tệp giao diện chung đã đổi từ 1280 lên 1281 nên trình duyệt sẽ tự lấy bản mới, nhưng vẫn BẮT BUỘC nâng cấp bốn mô đun vì lớp mới nằm trong tệp màn hình"
  url: "/portal/return/new — biểu mẫu tạo yêu cầu bù hàng; kèm hai biểu mẫu cùng chuẩn /portal/support/new và /portal/info-request/new, và ô lọc của tám màn danh sách"
  odoo_fit: "Custom"
  fix: "Các ô nhập trên biểu mẫu điện thoại trước đây để nguyên dáng mặc định của thư viện giao diện: ô chọn cao khoảng ba mươi điểm ảnh, ô nhập khoảng ba mươi sáu, trong khi nút bấm ngay bên dưới cao bốn mươi tám và bo góc mười hai; ô nhập lại bo góc năm phẩy hai nên nhìn vào thấy rời rạc, ngón tay bấm cũng khó trúng. Nay mọi ô nhập của biểu mẫu cao đều bốn mươi tám điểm ảnh, ô nhập nhiều dòng cao chín mươi sáu, và bo góc lấy đúng con số dùng chung với thẻ và nút. Cách làm là gắn một dấu hiệu chung lên thẻ biểu mẫu rồi quy định một lần duy nhất, nên biểu mẫu mới sau này chỉ cần gắn dấu hiệu đó là tự đúng chuẩn; ba biểu mẫu hiện có gồm Tạo yêu cầu bù hàng, Tạo phiếu hỗ trợ và Yêu cầu cập nhật thông tin đều đã theo. Thứ hai, mỗi nhãn nay được nối đích danh với ô nhập tương ứng nên trình đọc màn hình gọi đúng tên trường, và bấm vào nhãn là con trỏ nhảy vào ô; hai ô chọn tệp không có nhãn nhìn thấy thì được đặt tên riêng cho trình đọc màn hình. Vì màn hình dựng hai bản, một cho máy tính một cho điện thoại, và cả hai cùng tồn tại trên trang, nên mã định danh của hai bản được đặt khác tiền tố để không giẫm lên nhau. Thứ ba, ở khổ màn ba trăm sáu mươi điểm ảnh, cặp ô Số lượng yêu cầu và Ngày sản xuất trước đây chia đôi bề ngang nên mỗi ô chỉ còn khoảng một trăm bốn mươi điểm ảnh và ô ngày tháng không co thêm được nữa; nay ở khổ đó hai ô xuống thành một cột. Thứ tư, nhân cùng một yêu cầu chạm dễ, các ô lọc và ô tìm kiếm của tám màn danh sách được nâng vùng chạm từ ba mươi tám lên bốn mươi bốn điểm ảnh, riêng hai ô lọc của màn Yêu cầu cập nhật thông tin từ hai mươi tám lên bốn mươi bốn"
  impact: "Ba biểu mẫu trên điện thoại và ô lọc của tám màn danh sách. Không đổi dữ liệu, không đổi quyền, không đổi luồng nghiệp vụ, không đổi chữ hiển thị. Trên máy tính không có ô nào đổi. Nhóm màn Khảo sát cố ý không đụng theo quyết định của chủ dự án. Đo trước và sau trên bản sao cơ sở dữ liệu, mười chín màn nhân hai khổ điện thoại: số ô nhập bấm khó từ sáu mươi tư về không, số ô nhập không nối được nhãn từ năm mươi tám về mười tám, trong đó mười tám ô còn lại là ô tìm kiếm và ô lọc của các màn danh sách, nằm ngoài phạm vi phiếu này. Hồi quy mười ba màn nhân sáu khổ là bảy mươi tám ô: mười sáu ô đổi chiều cao trang và đều là hệ quả trực tiếp của việc nâng ô lọc lên bốn mươi bốn, không ô nào trên máy tính đổi, không màn nào giảm số bản ghi nhìn thấy, không màn nào cuộn ngang, không lỗi kịch bản trình duyệt, thứ bậc tiêu đề giữ nguyên từng con số. Mười một phép kiểm tra tự động mới, và đã chứng minh chúng có tác dụng bằng cách cố tình phá từng chỗ rồi xác nhận đúng một phép kiểm đỏ lên"
  retest: "Mở Bù hàng rồi bấm Tạo mới trên điện thoại khổ 390 và 360 điểm ảnh. Mọi ô chọn và ô nhập phải cao bằng nhau và bằng nút Gửi yêu cầu ở cuối, bo góc cũng bằng nhau, nhìn thành một khối thống nhất. Bấm vào chữ nhãn phía trên mỗi ô, con trỏ phải nhảy vào đúng ô đó. Thu về khổ 360, cặp ô Số lượng yêu cầu và Ngày sản xuất phải nằm thành hai hàng chứ không còn chia đôi bề ngang. Làm lại đúng như vậy với Hỗ trợ bấm Tạo ticket và Yêu cầu cập nhật thông tin bấm Tạo yêu cầu. Sau đó mở các màn danh sách Bù hàng, Giao hàng, Lịch sử mua hàng, Thông báo, Kiến thức, Hỗ trợ, Đăng ký thi và Yêu cầu cập nhật thông tin, ô tìm kiếm và ô lọc phải cao hơn trước và bấm dễ hơn. Nếu vẫn thấy ô nhập thấp và bo góc nhỏ thì tải lại trang bỏ qua bộ nhớ đệm, và kiểm giúp là bốn mô đun đã được nâng cấp chứ không chỉ kéo mã nguồn về"
  limit: "Thứ nhất, ô lọc mới chỉ được nâng chiều cao lên bốn mươi bốn điểm ảnh cho dễ chạm, còn bo góc và cỡ chữ của nhóm ô lọc giữ nguyên vì chuẩn thanh lọc chưa được BA viết spec, sửa bây giờ là tự đoán con số. Thứ hai, còn mười tám ô tìm kiếm và ô lọc trên các màn danh sách chưa có tên cho trình đọc màn hình vì chúng chỉ có chữ mờ gợi ý bên trong; việc này nằm ngoài phạm vi phiếu vốn nói về biểu mẫu, xin BA mở phiếu riêng để làm một lượt cho cả tám màn. Thứ ba, hai mô đun của nhóm Khảo sát cố ý không đụng theo quyết định ngày 08 tháng 09, các ô nhập ở đó vốn đã cao bốn mươi bốn nên không lệch chuẩn. Thứ tư, màn Báo cáo đặt hàng trên máy chạy thử báo lỗi múi giờ ở tầng cơ sở dữ liệu, lỗi này có ở cả lượt đo trước lẫn lượt đo sau nên là lỗi môi trường máy chạy thử, không phải do đợt sửa này"

