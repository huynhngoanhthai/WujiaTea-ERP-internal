  impact: "Màn Đăng ký thi trên cổng (danh sách, chi tiết, bộ lọc trạng thái dùng cùng bảng nhãn). Không đổi dữ liệu phiếu, luồng đăng ký, quyền Chủ/Quản lý/Nhân viên, bộ lọc kết quả, phân trang. Đo bản sao dữ liệu với tài khoản 3 cửa hàng, máy tính 1920 và điện thoại 391: chưa chọn ⇒ khối nhắc chọn, không có chữ Chưa có đăng ký thi; HCM-01 ⇒ 45 phiếu, trang 1 hiện 10, nhãn trạng thái máy tính trùng điện thoại từng dòng; 3 phiếu Đã đăng ký có thêm nhãn Có kết quả, phiếu Từ chối/Đã hủy không có; HN-01 (không có phiếu) ⇒ Chưa có đăng ký thi. Không cuộn ngang, không lỗi trang"
  retest: "Tài khoản thuộc từ hai cửa hàng trở lên, chưa chọn cửa hàng: mở Đăng ký thi ở máy tính khổ 1440 và điện thoại 390 — thấy khối nhắc chọn cửa hàng, bấm nút trong khối mở bảng chọn; không có chữ Chưa có đăng ký thi và không có phiếu nào. Chọn HCM-01: một phiếu đang chờ hiện Chờ xác nhận ở cả máy tính và điện thoại (không còn Chờ duyệt). Một phiếu Đã đăng ký của kỳ đã công bố: điện thoại hiện Đã đăng ký và cạnh đó nhãn Có kết quả, mở chi tiết cũng thấy cả hai. Một phiếu Từ chối và một phiếu Đã hủy của kỳ đã công bố: chỉ thấy Từ chối / Đã hủy, không có Có kết quả. Thử bộ lọc Trạng thái = Chờ xác nhận và bộ lọc Kết quả, chuyển trang: chạy như cũ"
  limit: "Thứ nhất, bản máy tính vẫn giữ cột Kết quả riêng như trước (ghi Đã công bố theo kỳ thi, hoặc số đạt / không đạt khi có điểm), kể cả ở phiếu Từ chối hoặc Đã hủy; cột này không thay trạng thái phiếu, BA muốn để trống ở các phiếu đó thì báo thêm. Thứ hai, tiếng Trung và tiếng Thái hiện chữ tiếng Anh ở hai nhãn mới Awaiting confirmation và Registered cho tới đợt dịch riêng"

