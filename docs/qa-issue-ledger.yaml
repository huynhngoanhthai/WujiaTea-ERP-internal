WJ-FRANCHISE-004:
  sprint: "2026-09-13-E9b"
  build_override: "ĐÃ DEPLOY UAT 16/09/2026 — sẵn sàng retest | 13/09/2026 | Sprint 2026-09-13-E9b | đã đo lại chỉ-đọc trên máy chạy thử sau khi nâng cấp: bốn hợp đồng đều lên trạng thái đúng theo ngày, mỗi cửa hàng đúng một hợp đồng hiện hành, không cửa hàng nào bị khoá cổng hay bị chuyển sang trạng thái hết hạn, tác vụ tự động làm mới trạng thái đã có và đang bật, tác vụ cũ đã đổi thành chỉ cảnh báo, nút Xác nhận đã gỡ và nút Khôi phục đã có, quyền đọc thừa của tài khoản cổng đã gỡ | commit: c82d403 | wujia_franchise_contract 19.0.1.0.0 -> 19.0.2.0.0 · wujia_franchise 19.0.5.0.0 -> 19.0.6.0.0 — deploy: git pull rồi NÂNG CẤP hai mô đun wujia_franchise_contract,wujia_franchise. Lưu ý mô đun hợp đồng ĐÃ được cài sẵn trên máy chạy thử từ trước nên đây là lệnh nâng cấp chứ không phải cài mới; phải nâng cấp thì hai bước chuyển dữ liệu đi kèm mới chạy. Không tệp giao diện nào đổi nên không cần xoá bộ nhớ đệm trình duyệt | Đã xác nhận trên chính máy chạy thử ngày 16/09/2026: mô đun hợp đồng ở bản 19.0.2.0.0 và mô đun nhượng quyền ở bản 19.0.6.0.0, đúng hai bản đích, nghĩa là hai bước chuyển dữ liệu đi kèm đã chạy"
  url: "Odoo Backend — Vận hành, menu Hợp đồng nhượng quyền; và tab Hợp đồng trên màn Cửa hàng"
  odoo_fit: "Custom"
  fix: "Trước đây ngày bắt đầu và ngày kết thúc hợp đồng nằm thẳng trên hồ sơ Cửa hàng, nên mỗi cửa hàng chỉ giữ được đúng một kỳ hợp đồng, gia hạn là ghi đè mất lịch sử. Nay hợp đồng là một hồ sơ riêng, một cửa hàng có bao nhiêu kỳ cũng được, nối tiếp nhau theo thời gian. Mỗi hợp đồng gồm cửa hàng, số hợp đồng, ngày bắt đầu, ngày kết thúc, ghi chú và tệp đính kèm; để trống số hợp đồng thì hệ thống tự đánh số dạng FC kèm năm và số thứ tự. Trên hồ sơ Cửa hàng có thêm nút tắt Hợp đồng hiện số lượng, bấm vào ra ngay danh sách hợp đồng của đúng cửa hàng đó, và một tab Hợp đồng cho xem hợp đồng đang hiệu lực cùng số ngày còn lại ở dạng chỉ đọc. Hai ô ngày cũ trên Cửa hàng nay lấy tự động từ hợp đồng đang hiệu lực và không sửa được nữa, nên chỉ còn đúng một nơi nhập ngày, đúng yêu cầu của ô Kết quả mong muốn. Trạng thái hợp đồng nay TỰ TÍNH theo ngày chứ không phải bấm nút phê duyệt: chưa tới ngày bắt đầu là Nháp, đang trong khoảng là Hiệu lực, qua ngày kết thúc là Hết hạn; người dùng chỉ còn một thao tác tay là Huỷ hợp đồng và Khôi phục lại. Sửa ba lỗi nặng của bản cũ. Thứ nhất và quan trọng nhất: bản cũ có một tác vụ chạy hằng đêm tự đổi trạng thái Cửa hàng sang Hết hạn khi qua ngày kết thúc hợp đồng, mà cổng đặt hàng của cửa hàng lại chặn cứng mọi cửa hàng không ở trạng thái Đang hoạt động, tức là hết hạn hợp đồng là cửa hàng không vào đặt hàng được nữa, đúng điều ô Đề xuất điều chỉnh dặn không được làm. Nay tác vụ đó chỉ ghi một dòng cảnh báo vào lịch sử trao đổi của cửa hàng, tuyệt đối không đụng tới trạng thái cửa hàng, không bật khoá cổng, không chặn đặt hàng. Thứ hai: bản cũ có viết sẵn phần tự chuyển hợp đồng sang Hết hạn nhưng chưa bao giờ khai lịch chạy cho nó, nên phần đó chưa từng chạy lần nào và không hợp đồng nào tự hết hạn được; nay đã khai lịch chạy hằng ngày. Thứ ba: bản cũ khoá không cho sửa hợp đồng đang hiệu lực, kể cả sửa nhầm ngày hay gia hạn, trong khi ô Đề xuất điều chỉnh chỉ cấm XOÁ chứ không cấm sửa; nay sửa được, còn xoá thì vẫn chặn như cũ, muốn bỏ thì Huỷ hoặc lưu trữ để giữ lịch sử. Ràng buộc dữ liệu giữ đủ: ngày kết thúc không được nhỏ hơn ngày bắt đầu, và hai hợp đồng chưa huỷ của cùng một cửa hàng không được chồng lấn khoảng ngày dù chỉ một ngày; hợp đồng đã huỷ thì nhường lại khoảng ngày cho hợp đồng mới. Phần chuyển dữ liệu cũ: mỗi cửa hàng đang có ngày hợp đồng trên hồ sơ được tạo đúng một hợp đồng tương ứng, chạy lại bao nhiêu lần cũng không sinh bản trùng"
  impact: "Chỉ phần quản trị nhượng quyền. Không đổi giao diện cổng của cửa hàng, không đổi đơn hàng, giao hàng, công nợ, bù hàng hay khảo sát. Thay đổi đáng chú ý nhất về hành vi là việc hết hạn hợp đồng KHÔNG còn tự đổi trạng thái cửa hàng nữa, đây là sửa theo đúng chữ của ô Đề xuất điều chỉnh và có ảnh hưởng ngược lại phiếu WJ-FRANCHISE-003 đã nghiệm thu trước đó. Thay đổi thứ hai cũng thuộc phiếu WJ-FRANCHISE-003: màn hướng dẫn mở cửa hàng vẫn giữ nguyên hai ô nhập ngày như BA đã duyệt, nhìn không khác gì, nhưng bên trong nay sinh ra hợp đồng đầu tiên thay vì ghi ngày lên hồ sơ cửa hàng. Phần nạp dữ liệu cửa hàng từ tệp cũng đi theo đường đó. Đo trước và sau trên bản sao cơ sở dữ liệu có cài đủ nhóm Khảo sát giống máy chạy thử. Bản mốc chưa sửa cho năm trăm lẻ một phép kiểm với năm chỗ đỏ, bản sau khi sửa cho năm trăm hai mươi sáu phép kiểm với sáu chỗ đỏ; so tên từng phép thì năm chỗ đỏ cũ giữ nguyên, còn chỗ đỏ thứ sáu là một phép kiểm phụ thuộc giờ trong ngày, đã chứng minh bằng cách chạy đúng phép đó trên chính bản mốc chưa sửa cùng thời điểm và cũng ra đỏ y hệt. Tức là không chỗ đỏ mới nào, và thêm hai mươi lăm phép kiểm. Mười tám phép kiểm của phần mở cửa hàng vẫn xanh nguyên. Đã chứng minh các phép kiểm có tác dụng bằng cách cố tình phá mười lăm chỗ, cả mười lăm lần đều đỏ đúng phép kiểm tương ứng. Ngoài ra có diễn tập riêng một lượt nâng cấp dựng lại đúng hình dạng dữ liệu đang có trên máy chạy thử, kết quả hợp đồng đã huỷ vẫn giữ được trạng thái huỷ, cửa hàng chỉ còn hợp đồng huỷ thì hai ô ngày về trống, và trạng thái cùng khoá cổng của cả ba cửa hàng không đổi"
  retest: "Vào phần Vận hành, mở menu Hợp đồng nhượng quyền, phải thấy bốn hợp đồng đã được chuyển sang từ dữ liệu cũ của bốn cửa hàng, ngày bắt đầu và kết thúc đúng như đang ghi trên hồ sơ cửa hàng trước đây. Mở hồ sơ một cửa hàng, phải thấy nút tắt Hợp đồng có con số ở đầu màn, bấm vào ra đúng danh sách hợp đồng của cửa hàng đó; mở tab Hợp đồng xem hợp đồng hiện hành, ngày bắt đầu, ngày kết thúc và số ngày còn lại, cả ba ô này phải ở dạng chỉ đọc không gõ vào được. Thử tạo một hợp đồng mới cho cùng cửa hàng đó với khoảng ngày trùng lên hợp đồng đang có, hệ thống phải báo lỗi không cho lưu; đổi sang một khoảng ngày nằm hoàn toàn sau ngày kết thúc của hợp đồng cũ thì phải lưu được và trạng thái hiện là Nháp vì chưa tới ngày. Thử tạo một hợp đồng có ngày kết thúc nhỏ hơn ngày bắt đầu, hệ thống phải báo lỗi. Thử để trống ô số hợp đồng, hệ thống phải tự điền dạng FC kèm năm. Thử bấm Huỷ hợp đồng rồi Khôi phục lại. Thử xoá một hợp đồng đang hiệu lực, hệ thống phải chặn và nhắc dùng Huỷ hoặc lưu trữ; còn hợp đồng ở trạng thái Nháp thì xoá được. Phép kiểm quan trọng nhất của phiếu này là chuyện khoá cổng: nhờ anh Ban kỹ thuật sửa ngày kết thúc hợp đồng của một cửa hàng thử về hôm qua rồi chạy tác vụ ban đêm, sau đó xem lại hồ sơ cửa hàng đó, trạng thái phải vẫn là Đang hoạt động, ô khoá cổng phải vẫn tắt, và đăng nhập cổng bằng tài khoản của chính cửa hàng đó phải vào và đặt hàng được bình thường; trên hợp đồng thì trạng thái chuyển sang Hết hạn và lịch sử trao đổi của cửa hàng có một dòng cảnh báo. Cuối cùng chạy thử màn hướng dẫn mở cửa hàng như lần nghiệm thu phiếu WJ-FRANCHISE-003, vẫn nhập hai ô ngày như cũ, xong thì cửa hàng mới phải có sẵn đúng một hợp đồng với đúng hai ngày vừa nhập. Nếu chưa thấy gì đổi thì kiểm giúp hai mô đun đã lên 19.0.2.0.0 và 19.0.6.0.0 chứ không chỉ kéo mã nguồn"
  limit: "Thứ nhất, bốn hợp đồng đã chuyển sang từ dữ liệu cũ mang số dạng HD kèm mã cửa hàng vì chúng được sinh bởi bản cũ đang chạy trên máy chạy thử; từ bản này trở đi hợp đồng mới sẽ mang số dạng FC kèm năm. Hai cách đánh số cùng tồn tại là cố ý, đổi số của hợp đồng cũ sẽ làm lệch giấy tờ đã in; nếu BA muốn đánh số lại toàn bộ thì xin mở phiếu riêng. Thứ hai, phiếu này KHÔNG làm phê duyệt nhiều bước, ký điện tử, phụ lục, phí nhượng quyền, gia hạn tự động hay nhắc hạn nhiều cấp, đúng theo phần Ngoài phạm vi MVP; hợp đồng hết hạn chỉ ghi một dòng cảnh báo vào lịch sử trao đổi của cửa hàng chứ chưa gửi thư hay thông báo. Thứ ba, khi tác vụ ban đêm phát hiện hợp đồng vừa hết hạn thì nó chỉ báo đúng một lần vào đúng ngày hôm sau ngày kết thúc, cố ý không báo lại mỗi đêm để khỏi phiền. Thứ tư, trạng thái hợp đồng tự tính theo ngày nên giữa hai lần chạy tác vụ ban đêm có thể lệch tối đa một ngày nếu xem bằng bộ lọc; mở thẳng hợp đồng ra thì luôn đúng. Thứ năm, số đo trong phiếu này lấy trên bản sao cơ sở dữ liệu có cài đủ nhóm mô đun giống máy chạy thử chứ chưa phải trên chính máy chạy thử, vì lúc làm thì mã chưa được đưa lên đó; có soi máy chạy thử một lượt chỉ đọc và xác nhận được ba điều, là mô đun hợp đồng đã cài sẵn bản cũ nên deploy lần này là nâng cấp, là bốn hợp đồng đã chuyển dữ liệu xong và bốn cửa hàng đều đang Đang hoạt động không cửa hàng nào bị khoá oan, và là tác vụ tự khoá cửa hàng của bản cũ vẫn đang bật nên nếu không lên bản này thì tới ngày 15 tháng 5 năm 2028 sẽ có ba cửa hàng bị khoá cổng"

UI-STATUSBADGE-001:
  sprint: "2026-09-13-E2"
  build_override: "ĐÃ DEPLOY UAT 16/09/2026 — sẵn sàng retest | 13/09/2026 | Sprint 2026-09-13-E2 | gộp cả hai lượt E2a và E2b vì lượt trước chưa lên máy chạy thử | deploy: git pull rồi NÂNG CẤP mười một mô đun wujia_portal_layout,wujia_portal_base,wujia_portal_purchase_history,wujia_portal_delivery,wujia_portal_sale,wujia_portal_support,wujia_portal_notification,wujia_portal_exam,wujia_portal_return,wujia_portal_debt,wujia_portal_info_request — bắt buộc nâng cấp mô đun chứ không chỉ kéo mã, vì phần lớn thay đổi nằm trong tệp màn hình; sau khi lên xong xin tải lại trang bỏ qua bộ nhớ đệm một lần vì tệp giao diện có đổi | Đã lên máy chạy thử ngày 16/09/2026 và đã đo lại chỉ đọc: mười một mô đun đều đúng bản đích, tệp giao diện trên máy chủ mang số hiệu 1292 và có đủ các kiểu thẻ trạng thái mới"
  url: "Cổng cửa hàng — toàn bộ các màn có nhãn trạng thái: Trang tổng quan, Lịch sử đặt hàng, Giao hàng, Thông báo, Đăng ký thi, Đổi trả, Công nợ, Yêu cầu cập nhật, Hỗ trợ, Hồ sơ nhượng quyền, Tài khoản"
  odoo_fit: "Custom"
  fix: "BA bắt lỗi cùng một trạng thái Đã xác nhận mà trên điện thoại ra màu xanh lá còn trên máy tính ra màu xanh dương, tức nhãn trạng thái không dùng chung một mẫu. Soi ra gốc rễ không nằm ở phần trang trí mà nằm ở phần mã sinh nhãn: bảng quy đổi trạng thái sang màu được chép lại ở nhiều nơi, mỗi nơi một kiểu, và riêng dòng Đã xác nhận thì bị gán nhầm màu của nhóm hoàn tất. Nay toàn bộ quy đổi trạng thái sang màu được gom về MỘT bảng duy nhất dùng chung cho cả bản máy tính lẫn bản điện thoại, bảy bậc ý nghĩa đúng như BA chốt là trung tính, thông tin, chờ, đang xử lý, thành công, cảnh báo và phản hồi. Nhãn trạng thái cũng về một mẫu duy nhất: cao hai mươi tám điểm ảnh, rộng tối thiểu tám mươi tư, bo góc mười bốn, chữ mười ba đậm vừa, không viền, không đổ bóng, không xuống dòng; không còn bản riêng theo từng màn hay theo khổ màn. Lượt này làm nốt các màn còn lại là Thông báo, Đăng ký thi, Đổi trả, Công nợ, Yêu cầu cập nhật và Hỗ trợ, đồng thời gỡ bảy chỗ ép nhãn nhỏ đi lệch chuẩn ở màn Đăng ký thi và màn Công nợ theo đúng chỉ đạo lấy số của BA làm chuẩn. Về màu chữ: bảy cặp màu BA đưa thì năm cặp đo ra dưới ngưỡng tương phản dễ đọc mà chính BA cũng đòi đạt, nên giữ nguyên bảy màu nền của BA và chỉ làm đậm màu chữ ở mức tối thiểu, cùng tông, để vừa giữ nhận diện vừa đạt ngưỡng; màu gốc của BA được ghi lại ngay cạnh từng màu mới để đối chiếu"
  impact: "Chỉ phần hiển thị nhãn trạng thái trên cổng cửa hàng. Không đổi dữ liệu, không thêm hay xoá trường nào, không đổi quyền, không đổi cách tính toán, không đụng đơn hàng, giao hàng, hoá đơn hay công nợ, không đụng nhóm màn Khảo sát. Những loại nhãn BA đã nói rõ là không thuộc phạm vi thì giữ nguyên không đổi một nét: nhãn vai trò chủ tiệm và nhân viên, nhãn khu vực, mã cửa hàng, số thông báo chưa đọc, nhãn chủ đề của Kiến thức, nhãn mức độ ưu tiên, nhãn loại thông báo, nhãn có tệp đính kèm và nhãn phương án xử lý của phiếu đổi trả; điều này được kiểm chéo bằng máy, đo lại toàn bộ các nhãn ngoài phạm vi trước và sau khi sửa, không nhãn nào đổi. Thay đổi nhìn thấy được: nhãn trạng thái trong hàng thông báo và trong ô thông báo trên máy tính trước đây bị ép nhỏ mười một điểm ảnh, nay về đúng hai mươi tám như các màn khác, nên trang Thông báo trên điện thoại cao thêm khoảng bốn đến năm điểm ảnh; trang Đổi trả trên điện thoại cao thêm hai mươi lăm điểm ảnh ở khổ 390 và tám mươi sáu ở khổ 360 vì mỗi phiếu có thêm một nhãn tiến độ bù cao hai mươi tám; nhãn ở bảng Đăng ký thi trên máy tính hết bị ép rộng một trăm mười tám nên cột trông hẹp lại, và tiện thể sửa luôn một lỗi cũ là ô bảng đó vẫn cắt mất tám điểm ảnh của nhãn mà không ai thấy. Đo trên bản sao cơ sở dữ liệu có cài đủ nhóm Khảo sát giống máy chạy thử: ba trăm hai mươi mốt nhãn ở mười hai màn nhân sáu khổ màn đều đúng cả kích thước lẫn màu, không nhãn nào xuống dòng, không nhãn nào bị cắt chữ, không màn nào cuộn ngang, toàn bộ đạt ngưỡng tương phản dễ đọc. Hồi quy đo hai lượt bằng hai cây mã để đối chứng, mười ba màn nhân năm khổ: không lỗi kịch bản trình duyệt, không màn nào mất bản ghi, không màn nào đổi số lần chuyển hướng, và chỉ đúng bốn ô đổi chiều cao đúng như đã nêu ở trên. Bốn trăm năm mươi bảy phép kiểm tự động của tám nhóm mô đun đều xanh, trong khi cây mã đối chứng là bốn trăm năm mươi phép, chênh nhau đúng bảy phép kiểm mới thêm; chín phép phá hoại có chủ đích đều làm đỏ đúng một phép kiểm tương ứng"
  retest: "Mở cổng cửa hàng bằng tài khoản chủ tiệm, xem lần lượt trên máy tính khổ 1440 và trên điện thoại khổ 390. Việc chính là so cùng một trạng thái giữa hai loại màn hình: mở Trang tổng quan và Lịch sử đặt hàng, đơn Đã xác nhận phải ra MÀU XANH DƯƠNG ở cả hai, không còn cảnh điện thoại xanh lá máy tính xanh dương như ảnh BA gửi. Sau đó xem các màn lượt này làm nốt: Thông báo thì nhãn Chưa đọc màu xanh dương, Đã đọc màu xám, Đã hết hiệu lực màu xám; Đăng ký thi thì nhãn trạng thái đăng ký và nhãn công bố kết quả phải cùng một dáng với các màn khác và bảng trên máy tính không được cắt chữ; Đổi trả, Công nợ, Yêu cầu cập nhật và Hỗ trợ thì cùng trạng thái phải cùng màu, cùng dáng. Việc quan trọng thứ hai là kiểm chéo những thứ KHÔNG được đổi: nhãn vai trò chủ tiệm và nhân viên, nhãn khu vực, mã cửa hàng, số thông báo chưa đọc trên chuông, nhãn chủ đề ở Kiến thức, nhãn mức độ ưu tiên và nhãn có tệp ở Thông báo, nhãn phương án xử lý ở Đổi trả — tất cả phải y như trước. Xin BA xác nhận giúp hai điểm: một là trang Thông báo trên điện thoại cao thêm bốn đến năm điểm ảnh và trang Đổi trả cao thêm hai mươi lăm đến tám mươi sáu điểm ảnh, đây là hệ quả trực tiếp của việc lấy số hai mươi tám của BA làm chuẩn; hai là năm màu chữ được làm đậm cho đạt ngưỡng dễ đọc có chấp nhận được về nhận diện không. Nếu chưa thấy gì đổi thì tải lại trang bỏ qua bộ nhớ đệm và kiểm giúp mười một mô đun đã được nâng cấp chứ không chỉ kéo mã nguồn"
  limit: "Thứ nhất, nhóm màn Khảo sát còn chín chỗ dùng nhãn kiểu cũ. Đây là nhóm mô đun của anh Thái, theo luật đã chốt ngày tám tháng chín thì mọi lượt chỉnh giao diện đều bỏ qua nhóm này và ghi lại lý do thay vì sửa, nên lượt này KHÔNG đụng tới; xin BA cho biết có muốn mở phiếu riêng cho nhóm Khảo sát không. Thứ hai, ngoài chín chỗ đó còn hai mươi chín chỗ mang tên gọi kiểu cũ nhưng đều là những loại nhãn BA đã nói rõ là không thuộc phạm vi, giữ nguyên mới là đúng chứ không phải việc còn dở. Thứ ba, ô Kết quả mong muốn vừa đòi đạt ngưỡng tương phản dễ đọc vừa đưa bảy cặp màu mà năm cặp đo ra không đạt; đã chọn cách giữ nền của BA và làm đậm chữ tối thiểu, nếu BA muốn giữ nguyên màu chữ cũ thì phải bỏ ràng buộc tương phản khỏi ô Kết quả mong muốn, hai điều đó không cùng tồn tại được. Thứ tư, có những trạng thái nằm cạnh nhau mà BA xếp cùng một bậc ý nghĩa nên ra cùng màu, ví dụ Sắp giao với Đang giao, hay Đã lên đơn bù với Đang bù một phần; theo đúng luật của chính BA là không truyền đạt trạng thái chỉ bằng màu, người dùng phân biệt bằng chữ trên nhãn. Thứ năm, ô Kết quả mong muốn đòi chữ đọc đủ ở ba thứ tiếng Việt, Anh và Trung, nhưng hệ thống hiện chỉ bật tiếng Việt và tiếng Anh, không có gói tiếng Trung, nên chỉ đo được hai thứ tiếng: tiếng Việt ba trăm hai mươi mốt nhãn và tiếng Anh sáu mươi mốt nhãn, đều không lỗi. Nhãn không cho xuống dòng và tự nới bề ngang theo nội dung nên chuỗi tiếng Trung vốn ngắn hơn tiếng Việt sẽ không tràn, nhưng đó là suy luận chứ chưa phải số đo; xin BA cho bật gói tiếng Trung nếu muốn nghiệm thu đủ ba thứ tiếng. Thứ sáu, số đo trong phiếu này lấy trên bản sao cơ sở dữ liệu có cài đủ nhóm mô đun giống máy chạy thử chứ chưa phải trên chính máy chạy thử, vì lúc làm thì mã chưa được đưa lên đó; sau khi deploy sẽ đo lại một lượt chỉ đọc rồi mới đánh dấu đã lên máy chạy thử"

