UI-MOB-STORE-SWITCHER-001:
  sprint: "2026-09-29-G2"
  commit: "6745671"
  build_override: "ĐÃ DEPLOY UAT 30/09/2026 — sẵn sàng retest | 30/09/2026 | Sprint 2026-09-29-G2 | bản mã 6745671 | Đo lại CHỈ ĐỌC trên máy chạy thử bằng trình duyệt thật với tài khoản chủ tiệm em.hcm (1 cửa hàng), mọi lệnh gửi dữ liệu bị chặn trừ đăng nhập và hai bộ đếm số trên chuông và giỏ, không lệnh nào phải chặn: 26 màn nhân 3 khổ điện thoại 360, 390, 430 kể cả Trang chủ đều có dải cửa hàng cao 48, vai trò ghi Chủ tiệm, không mũi tên (đúng với tài khoản 1 cửa hàng), không tràn ngang. Máy chạy thử chưa có tài khoản nhiều cửa hàng để thử bấm đổi cửa hàng — phần này đã thử trên bản sao dữ liệu (bấm mã, tên, vai trò, mũi tên đều mở ô chọn). Bảng đo: docs/g2-acceptance-matrix.md"
  url: "Cổng cửa hàng trên điện thoại (dưới 992 điểm ảnh) — dải cửa hàng ngay dưới thanh xanh ở mọi màn, kể cả Trang chủ; thử bằng tài khoản có từ hai cửa hàng trở lên và tài khoản chỉ một cửa hàng"
  odoo_fit: "Custom"
  fix: "Dải cửa hàng dưới thanh xanh trước đây chỉ có mã, tên và vai trò (chữ tiếng Anh Manager, Owner, Staff) nên không thấy là bấm được. Nay theo đúng mockup BA chốt 19/09: chip mã bên trái, tên cửa hàng đậm, vai trò dạng viên viền nền trắng bằng tiếng Việt (Chủ tiệm, Quản lý, Nhân viên), và mũi tên xuống màu xanh sát mép phải. Cả dải vẫn là một vùng bấm duy nhất mở hộp chọn cửa hàng, bấm vào mã, tên, vai trò hay mũi tên đều mở; nhấn có nền xám nhạt, chọn bằng bàn phím có viền xanh. Theo chốt của chủ dự án: tài khoản chỉ có một cửa hàng thì không hiện mũi tên và dải không bấm được (không có gì để chọn), dải hiện trên mọi màn kể cả Trang chủ. Nhãn vai trò dùng chung một bảng tiếng Việt ở mọi chỗ in vai trò trên cổng: dải này, khối Cửa hàng hiện tại trên máy tính, dòng phụ dưới tên trong nút tài khoản, khối cửa hàng trong menu tài khoản và khung Tổng quan cửa hàng ở Trang chủ điện thoại"
  impact: "Giao diện dải cửa hàng trên điện thoại và chữ vai trò ở năm chỗ nói trên. Không đổi cửa hàng đang chọn, vai trò, quyền, danh sách cửa hàng được xem hay cách chuyển cửa hàng; không thêm truy vấn (nhãn đọc từ vai trò đã có sẵn trên trang). Đo 27 màn ở khổ 360, 390, 430: dải cao 48, mũi tên cách mép phải 16 và nằm giữa theo chiều dọc, vai trò và mũi tên luôn còn khi tên cửa hàng dài (tên cắt bằng dấu ba chấm), không trượt ngang. Máy tính không có dải này; các phần khác của khung điện thoại (tiêu đề trang, tiêu đề khối, thanh đáy, cuộn cuối) so trước và sau giống hệt"
  retest: "Trên điện thoại khổ 390 (hoặc 360, 430), đăng nhập tài khoản có từ hai cửa hàng: dưới thanh xanh thấy chip mã, tên cửa hàng, viên vai trò tiếng Việt và mũi tên xuống ở mép phải; bấm vào tên hoặc vào mũi tên đều mở hộp chọn cửa hàng; chọn cửa hàng khác thì dải đổi theo. Mở Trang chủ, Đặt hàng, Thông báo, Công nợ: dải giống nhau ở mọi màn. Đăng nhập tài khoản chỉ một cửa hàng: dải vẫn hiện mã, tên, vai trò nhưng không có mũi tên, bấm không mở gì. Kiểm cửa hàng có tên dài: tên bị cắt bằng dấu ba chấm, vai trò và mũi tên vẫn đủ"
  limit: "Thứ nhất, tài khoản một cửa hàng không có mũi tên theo chốt của chủ dự án, vì mũi tên mà bấm không làm gì là tín hiệu sai; mockup chỉ vẽ trường hợp đổi được cửa hàng. Thứ hai, nhãn vai trò nay luôn là tiếng Việt kể cả khi người dùng chọn ngôn ngữ khác, giống bảng nhãn đang dùng ở Trang chủ và trang Cửa hàng. Thứ ba, Trang chủ điện thoại nay có cả dải cửa hàng và khung Tổng quan cửa hàng cùng ghi vai trò, đúng như mockup"
UI-PC-TOPBAR-REG-001:
  sprint: "2026-09-29-G2"
  commit: "6745671"
  build_override: "ĐÃ DEPLOY UAT 30/09/2026 — sẵn sàng retest | 30/09/2026 | Sprint 2026-09-29-G2 | bản mã 6745671 | Đo lại CHỈ ĐỌC trên máy chạy thử bằng trình duyệt thật với tài khoản chủ tiệm em.hcm, không lệnh gửi dữ liệu nào phải chặn: Trang chủ, Đặt hàng, Giỏ hàng nhân 3 khổ màn máy tính 1440, 1280, 1200 — icon giỏ và chuông nằm đúng giữa vòng tròn, số trên giỏ/chuông 4 và 12 không chạm icon, số 0 thì ẩn; khối Cửa hàng hiện tại có nền liền, nhãn Chủ tiệm nằm trong khối; nhãn vai trò tiếng Việt ở dải điện thoại, khối máy tính, dưới ảnh đại diện, menu tài khoản và Trang chủ điện thoại; tệp giao diện số hiệu 1326 đã nạp. Bảng đo: docs/g2-acceptance-matrix.md"
  url: "/portal, /portal/order, /portal/order/cart trên máy tính từ 1200 điểm ảnh — nút giỏ, nút chuông và khối Cửa hàng hiện tại trên thanh đầu trang"
  odoo_fit: "Custom"
  fix: "Nguyên nhân hồi quy: bộ giao diện chuẩn của Odoo nạp sau giao diện cổng và ép mọi liên kết trên thanh đầu trang về dạng khối, nên lệnh căn giữa của nút tròn 40 bị vô hiệu; biểu tượng giỏ và chuông dồn vào góc trên trái của nút, số trên giỏ đè lên nét biểu tượng (với số hai chữ số đè 59 điểm ảnh vuông), và cỡ biểu tượng bị bộ giao diện nền giữ 21. Nay nút giỏ và chuông tự căn giữa biểu tượng trong vòng tròn 40, cỡ biểu tượng giỏ 19 và chuông 20 để nét vẽ cao bằng nhau (hình giỏ vốn rộng hơn hình chuông); số lượng neo ở góc trên phải vòng tròn, nằm hẳn trên biểu tượng nên không che nét với 4 hay 12, không hiện khi 0. Khối Cửa hàng hiện tại nay là một bề mặt: nền mờ phủ cả khối, chip vai trò (tiếng Việt Chủ tiệm, Quản lý, Nhân viên) nằm trong khối bên phải, tên cửa hàng dài cắt bằng dấu ba chấm; vị trí, kích thước khối và chip giữ đúng số đã chốt ở UI-01"
  impact: "Chỉ thanh đầu trang máy tính. Không đổi vùng bấm (nút giỏ, chuông vẫn 40 x 40, vùng bấm mở chọn cửa hàng vẫn là phần tên như trước), số lượng giỏ, luồng thêm giỏ, nút ngôn ngữ hay nút tài khoản; chữ vai trò dưới tên trong nút tài khoản đổi sang tiếng Việt cùng bảng nhãn. Đo ở 1440, 1280, 1200 trên cả ba màn với số 0, 4, 12: biểu tượng lệch tâm 0, số không chạm biểu tượng. So bố cục mọi phần tử 27 màn ở 1440, 1024, 992 trước và sau: chỉ nền khối cửa hàng, nền phần tên và chữ vai trò dưới tên đổi; phần còn lại giống hệt. Điện thoại không đổi (thanh đầu điện thoại dùng quy tắc riêng, không chạm)"
  retest: "Mở Portal trên máy tính khổ 1440 (hoặc từ 1200), có vài mặt hàng trong giỏ: biểu tượng giỏ và chuông nằm giữa vòng tròn, trông cùng cỡ; số trên giỏ nằm ở góc trên phải vòng tròn, không che biểu tượng; thêm hàng cho tới 10 món trở lên, số hai chữ số vẫn không che. Khối Cửa hàng hiện tại là một khối liền, chip vai trò nằm bên trong ở mép phải; bấm vào tên cửa hàng mở hộp chọn cửa hàng như cũ. Lặp lại ở Đặt hàng và Giỏ hàng. Nút ngôn ngữ và nút tài khoản hoạt động như trước"
  limit: "Thứ nhất, mockup Trang chủ V4 vẫn vẽ chip vai trò tách ngoài khối, còn issue này và UI-01 yêu cầu chip nằm trong khối; đã làm theo issue, báo BA để thống nhất mockup V4. Thứ hai, chip vai trò và chữ dưới tên nay là tiếng Việt theo chốt của chủ dự án (một bảng nhãn cho cả cổng). Thứ ba, vùng bấm của khối vẫn chỉ là phần tên cửa hàng như trước vì issue yêu cầu không đổi vùng bấm; bấm vào chip vai trò không mở hộp chọn. Thứ tư, khối nền mới cũng hiện ở khổ 992 đến 1199 vì cùng một khối; phần giỏ và chuông chỉ sửa từ 1200 như issue ghi"

