name: CI/CD Pipeline - Code Quality & Deployment

on:
  pull_request:
    branches:
      - deploy/staging
      - deploy/production
  push:
    branches:
      - deploy/staging
      - deploy/production
  workflow_dispatch:

jobs:
  validate-code:
    name: Kiểm định mã nguồn (Python, XML & Manifest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kiểm tra cú pháp Python (.py)
        run: |
          python - << 'EOF'
          import os
          import py_compile
          import sys

          errors = []
          count = 0

          print("🔍 Đang kiểm tra toàn bộ file Python...")
          for root, _, files in os.walk('.'):
              if any(skip in root for skip in ['.git', 'venv', '.venv', 'odoo19']):
                  continue
              for f in files:
                  if f.endswith('.py'):
                      count += 1
                      p = os.path.join(root, f)
                      try:
                          py_compile.compile(p, doraise=True)
                      except Exception as e:
                          errors.append(f"[LỖI CÚ PHÁP PYTHON] {p}: {e}")

          print(f"-> Đã quét {count} file Python.")
          if errors:
              print("\n❌ PHÁT HIỆN LỖI PYTHON:")
              for err in errors:
                  print(err)
              sys.exit(1)
          print("✅ Tất cả file Python hợp lệ!")
          EOF

      - name: Kiểm tra cấu trúc & cú pháp XML Views Odoo (.xml)
        run: |
          python - << 'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET

          errors = []
          count = 0

          print("🔍 Đang kiểm tra toàn bộ file XML Odoo...")
          for root, _, files in os.walk('.'):
              if any(skip in root for skip in ['.git', 'venv', '.venv', 'odoo19']):
                  continue
              for f in files:
                  if f.endswith('.xml'):
                      count += 1
                      p = os.path.join(root, f)
                      try:
                          ET.parse(p)
                      except Exception as e:
                          errors.append(f"[LỖI CÚ PHÁP XML] {p}: {e}")

          print(f"-> Đã quét {count} file XML.")
          if errors:
              print("\n❌ PHÁT HIỆN LỖI XML:")
              for err in errors:
                  print(err)
              sys.exit(1)
          print("✅ Tất cả file XML hợp lệ!")
          EOF

      - name: Kiểm tra tính hợp lệ của __manifest__.py
        run: |
          python - << 'EOF'
          import ast
          import os
          import sys

          errors = []
          count = 0

          print("🔍 Đang kiểm tra các file __manifest__.py...")
          for root, _, files in os.walk('.'):
              if any(skip in root for skip in ['.git', 'venv', '.venv', 'odoo19']):
                  continue
              for f in files:
                  if f == '__manifest__.py':
                      count += 1
                      p = os.path.join(root, f)
                      try:
                          with open(p, 'r', encoding='utf-8') as mf:
                              data = ast.literal_eval(mf.read())
                              if not isinstance(data, dict):
                                  errors.append(f"[LỖI MANIFEST] {p}: Nội dung không phải là dictionary!")
                              elif 'name' not in data:
                                  errors.append(f"[LỖI MANIFEST] {p}: Thiếu trường bắt buộc 'name'!")
                      except Exception as e:
                          errors.append(f"[LỖI MANIFEST] {p}: {e}")

          print(f"-> Đã kiểm tra {count} file manifest.")
          if errors:
              print("\n❌ PHÁT HIỆN LỖI MANIFEST:")
              for err in errors:
                  print(err)
              sys.exit(1)
          print("✅ Tất cả file __manifest__.py hợp lệ!")
          EOF

  deploy-staging:
    name: Triển khai Staging (dev.wujiatea.com.vn)
    needs: validate-code
    # Chỉ deploy khi PUSH vào nhánh deploy/staging hoặc trigger thủ công
    # Tuyệt đối KHÔNG deploy khi mở Pull Request
    if: github.ref == 'refs/heads/deploy/staging' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Kích hoạt aaPanel Webhook
        env:
          WEBHOOK_URL: ${{ secrets.AAPANEL_STAGING_WEBHOOK_URL || 'https://aapanel.hongtrangogia.com:16787/hook?access_key=OUAptF2RjpvtddxOFd0YTis3N1GoGqoQHF06ea4I8wryQbj1&site_id=10' }}
        run: |
          echo "🚀 Gửi yêu cầu triển khai đến máy chủ aaPanel..."
          RESPONSE=$(curl -k -s -w "\nHTTP_STATUS:%{http_code}" "$WEBHOOK_URL")
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          echo "Mã phản hồi HTTP: $HTTP_CODE"
          echo "Nội dung phản hồi: $BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Lỗi: Máy chủ webhook phản hồi mã $HTTP_CODE"
            exit 1
          fi
          echo "✅ Đã kích hoạt lệnh triển khai trên máy chủ!"

      - name: Kiểm tra Health Check sau Deploy
        run: |
          echo "⏳ Chờ Odoo nâng cấp module và khởi động lại..."
          sleep 15
          SUCCESS=0
          for i in {1..12}; do
            STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "https://dev.wujiatea.com.vn/web/login" || echo "000")
            echo "[Lần $i/12] Health-check https://dev.wujiatea.com.vn/web/login -> HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "303" ]; then
              SUCCESS=1
              break
            fi
            sleep 5
          done

          if [ "$SUCCESS" -eq 1 ]; then
            echo "🎉 Hệ thống dev.wujiatea.com.vn đã trực tuyến và phản hồi thành công!"
          else
            echo "⚠️ Cảnh báo: Server chưa trả về HTTP 200 trong vòng 75 giây. Vui lòng kiểm tra log trên máy chủ."
            exit 1
          fi
